[project]
name = "jivo-loadtest"
version = "0.1.0"
description = "Jivo Quick Commerce load test (Phase 8, T-812): Locust flows, ramp profiles and 09 §1 pass/fail thresholds"
requires-python = "==3.13.*"
# Direct dependencies pinned exactly; uv.lock pins the rest. Separate from backend/uv.lock.
dependencies = [
    "locust==2.47.0",
]

[project.scripts]
jivo-loadtest = "jivo_loadtest.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jivo_loadtest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "S", "T20", "PT", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311"]
"jivo_loadtest/flows.py" = ["S311"]  # random choices of products and think times, not crypto
"jivo_loadtest/cli.py" = ["T201", "S603"]  # a CLI prints; it runs locust with a fixed argv
