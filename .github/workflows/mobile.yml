# Flutter CI. The apps and the shared packages are separate Flutter projects,
# each with its own pubspec.lock, linked by path dependencies:
#   customer_app/  rider_app/  packages/jivo_core/  packages/jivo_api/
#
# - consistency: packages shared by several projects resolve to the same
#   version everywhere, the Razorpay SDK pins have not drifted, and generated code (jivo_api from
#   backend/openapi/schema.yaml, gen-l10n output) matches the commit.
# - project (matrix): pub get with the committed lockfile, analyze, test.
# - build-android (matrix): the dev-flavor APK of each app.
name: mobile

on:
  push:
    branches: [main]
    paths:
      - "customer_app/**"
      - "rider_app/**"
      - "packages/**"
      - "backend/openapi/schema.yaml"
      - "infra/scripts/check_razorpay_pins.py"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "customer_app/**"
      - "rider_app/**"
      - "packages/**"
      - "backend/openapi/schema.yaml"
      - "infra/scripts/check_razorpay_pins.py"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.9"
  JAVA_VERSION: "17"
  # rider_app compiles against API 37 (permission_handler needs it).
  ANDROID_PLATFORM: "platforms;android-37.0"

defaults:
  run:
    shell: bash

jobs:
  consistency:
    name: Shared versions and generated code
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true      # Flutter SDK
          pub-cache: true  # ~/.pub-cache, keyed on every pubspec.lock

      - name: Check the pinned Flutter version
        run: flutter --version | grep -q "Flutter ${FLUTTER_VERSION} "

      - name: Shared packages resolve to the same version in every lockfile
        run: python3 packages/tool/check_shared_versions.py

      # razorpay_flutter in pubspec.yaml/pubspec.lock and the Android SDK set forced in
      # customer_app/android/app/build.gradle.kts must match the verified pins.
      - name: Razorpay SDK pins have not drifted
        run: python3 infra/scripts/check_razorpay_pins.py

      - name: Resolve every project (also regenerates l10n)
        run: |
          for project in packages/jivo_core packages/jivo_api customer_app rider_app; do
            echo "::group::flutter pub get ($project)"
            (cd "$project" && flutter pub get --enforce-lockfile)
            echo "::endgroup::"
          done

      - name: Regenerate jivo_api from the OpenAPI schema
        run: bash packages/tool/generate_api.sh

      - name: Generated code is committed and current
        run: |
          changes="$(git status --porcelain -- customer_app rider_app packages)"
          if [[ -n "$changes" ]]; then
            echo "::error::Generated files differ from the commit. Run 'packages/tool/generate_api.sh' (jivo_api) and 'flutter pub get' in each project (l10n), then commit:"
            echo "$changes"
            git --no-pager diff --stat -- customer_app rider_app packages
            exit 1
          fi

  project:
    name: Analyze and test (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [customer_app, rider_app, packages/jivo_core, packages/jivo_api]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true      # Flutter SDK
          pub-cache: true  # ~/.pub-cache, keyed on every pubspec.lock

      - name: Resolve dependencies (lockfile must be up to date)
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: |
          if [[ -d test ]]; then
            flutter test --coverage
          else
            echo "No test/ directory in ${{ matrix.project }}."
          fi

  build-android:
    name: Build dev APK (${{ matrix.app }})
    needs: [consistency, project]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: [customer_app, rider_app]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          # ~/.gradle caches and wrapper, keyed on this app's Gradle files.
          cache: gradle
          cache-dependency-path: |
            ${{ matrix.app }}/android/**/*.gradle*
            ${{ matrix.app }}/android/gradle/wrapper/gradle-wrapper.properties

      - name: Install the Android platform the apps compile against
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "${ANDROID_PLATFORM}" > /dev/null

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true      # Flutter SDK
          pub-cache: true  # ~/.pub-cache, keyed on every pubspec.lock

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build the dev flavor
        run: flutter build apk --flavor dev -t lib/main_dev.dart

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.app }}-dev-apk
          path: ${{ matrix.app }}/build/app/outputs/flutter-apk/app-dev-release.apk
          retention-days: 7
          if-no-files-found: error
