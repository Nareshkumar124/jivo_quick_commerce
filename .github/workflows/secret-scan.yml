# Secret scan (docs/deployment.md §2.1). The repo is PUBLIC, so a committed secret is a published
# secret. gitleaks runs as a pinned release binary (sha256-checked; the binary needs no licence,
# unlike gitleaks-action for organisations) with the repo-root .gitleaks.toml: the built-in rules,
# project rules (Razorpay, Twilio, our secret env variables, DB URLs, secret files) and a
# commented allowlist of known fake values.
#
# - pull_request: the PR's commits (base..head) and the checked-out files.
# - push to develop/main: the pushed commits (before..after) and the checked-out files. A new
#   branch, or a force-push whose old tip is gone, falls back to the full history.
# - weekly schedule and workflow_dispatch: the full history of every branch and tag.
# Findings are redacted: the log, the annotations and the job summary show rule, file, line and
# commit, never the value.
name: secret-scan

on:
  push:
    branches: [develop, main]
  pull_request:
  schedule:
    - cron: "23 2 * * 1" # Mondays 02:23 UTC (07:53 IST)
  workflow_dispatch:

# A PR run is replaced by the next one (which rescans the whole PR range). Push runs are never
# cancelled: each one is the only scan of its own commit range.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pinned release binary. Upgrade deliberately: change both values together (deployment.md §2.1).
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" # gitleaks_8.30.1_linux_x64.tar.gz

defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # commit ranges and the full-history scan need every commit
          persist-credentials: false # no token in .git/config while the files are scanned

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version

      - name: Choose the commits to scan
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # A usable commit: a full SHA, not the all-zero "no previous commit", present locally.
          usable() { [[ "$1" =~ ^[0-9a-f]{40}$ && ! "$1" =~ ^0+$ ]] && git cat-file -e "$1^{commit}" 2>/dev/null; }
          base="" head=""
          case "$EVENT" in
            pull_request) if usable "$PR_BASE" && usable "$PR_HEAD"; then base="$PR_BASE" head="$PR_HEAD"; fi ;;
            push) if usable "$PUSH_BEFORE"; then base="$PUSH_BEFORE" head="$GITHUB_SHA"; fi ;;
          esac
          if [[ -n "$base" ]]; then
            echo "Scanning $(git rev-list --count "$base..$head") commit(s): $base..$head"
          else
            echo "Scanning the full history of every branch and tag."
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Flag scanner config changes for review
        if: steps.scope.outputs.base != ''
        env:
          BASE: ${{ steps.scope.outputs.base }}
          HEAD_SHA: ${{ steps.scope.outputs.head }}
        run: |
          changed="$(git diff --name-only "$BASE...$HEAD_SHA" -- .gitleaks.toml infra/security/osv-scanner.toml || true)"
          for f in $changed; do
            echo "::warning file=$f::This change edits a scanner config. Every new allowlist or ignore entry must match only a known fake value or a reviewed advisory (docs/deployment.md §2)."
          done

      - name: Scan
        env:
          BASE: ${{ steps.scope.outputs.base }}
          HEAD_SHA: ${{ steps.scope.outputs.head }}
        run: |
          common=(--config .gitleaks.toml --redact --no-banner --report-format json)
          rc=0
          if [[ -n "$BASE" ]]; then
            echo "::group::Commits $BASE..$HEAD_SHA"
            gitleaks git . "${common[@]}" --report-path "$RUNNER_TEMP/gitleaks-commits.json" \
              --log-opts="--full-history --diff-filter=tuxdb $BASE..$HEAD_SHA" || rc=1
          else
            echo "::group::Full history"
            gitleaks git . "${common[@]}" --report-path "$RUNNER_TEMP/gitleaks-commits.json" || rc=1
          fi
          echo "::endgroup::"
          # Also the checked-out files: `git log -p` shows no diff for merge commits, so this
          # catches a secret added while resolving a merge conflict.
          echo "::group::Checked-out files"
          gitleaks dir . "${common[@]}" --report-path "$RUNNER_TEMP/gitleaks-files.json" || rc=1
          echo "::endgroup::"
          exit "$rc"

      - name: Report findings (redacted)
        if: failure()
        run: |
          total=0
          for scan in commits files; do
            report="$RUNNER_TEMP/gitleaks-$scan.json"
            [[ -s "$report" ]] && total=$(( total + $(jq 'length' "$report") ))
          done
          if [[ "$total" -eq 0 ]]; then
            echo "No findings recorded; the scan itself failed (see the steps above)."
            exit 0
          fi
          {
            echo "### gitleaks: $total finding(s), values redacted"
            echo
            echo "If a value is real, rotate it first (docs/deployment.md §2.1, §11.2)."
            echo
            echo "| Scan | Rule | File | Line | Commit |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for scan in commits files; do
            report="$RUNNER_TEMP/gitleaks-$scan.json"
            [[ -s "$report" ]] || continue
            jq -r '
              def prop: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A") | gsub(":"; "%3A") | gsub(","; "%2C");
              def where: if .Commit == "" then "checked-out file" else "commit " + .Commit[0:12] end;
              .[] | "::error file=\(.File | prop),line=\(.StartLine),title=gitleaks \(.RuleID | prop)::Possible secret (\(where)); value redacted. See docs/deployment.md §2.1."
            ' "$report"
            jq -r --arg scan "$scan" '
              .[:200][] | "| \($scan) | \(.RuleID) | `\(.File)` | \(.StartLine) | \(if .Commit == "" then "-" else .Commit[0:12] end) |"
            ' "$report" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "gitleaks: $total finding(s); see the annotations and the job summary."
