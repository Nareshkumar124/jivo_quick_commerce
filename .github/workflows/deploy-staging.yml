# Staging deploy (docs/deployment.md §8.1, §8.4). Manual only. Until D-05 (hosting) is approved it
# only proves the release is deployable: it builds the production image and runs its entrypoint's
# `manage.py check --deploy --fail-level ERROR` against the REAL staging environment (P8 OWASP M8),
# so accounts.E003, payments.E001/E004, delivery.E001, notifications.E001 and every other error
# fail here, before anything is deployed. The deploy step is a placeholder that fails on purpose.
#
# Who can run it (set up once in GitHub; see deployment.md §8.4):
# - Dispatch it from a PROTECTED branch only (develop or main); any other ref is refused below.
#   It deploys exactly the commit the run was dispatched on; there is no free-form ref input.
# - Environment "staging": required reviewers, "Prevent self-review", and deployment branches
#   limited to develop and main. STAGING_BACKEND_ENV lives only in that environment.
name: deploy-staging

on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Build image and check the staging configuration
    if: github.ref_protected && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the production image, tagged with the checked-out commit
        id: build
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          docker build --target production -t "jivoqc-backend:$sha" backend/

      # STAGING_BACKEND_ENV: environment secret holding the staging env file (KEY=value lines, no
      # quotes, no `export`), with the real DJANGO_ALLOWED_HOSTS. It is written to a 0600 file in
      # the runner's temp dir and removed afterwards; it is never echoed.
      - name: Deploy checks against the real staging environment
        env:
          STAGING_BACKEND_ENV: ${{ secrets.STAGING_BACKEND_ENV }}
          IMAGE: jivoqc-backend:${{ steps.build.outputs.sha }}
        run: |
          if [ -z "$STAGING_BACKEND_ENV" ]; then
            echo "::error::STAGING_BACKEND_ENV is not set in the 'staging' environment (staging is not set up yet, D-05)."
            exit 1
          fi
          envfile="$RUNNER_TEMP/staging.env"
          trap 'rm -f "$envfile"' EXIT
          (umask 077; printf '%s\n' "$STAGING_BACKEND_ENV" > "$envfile")
          if grep -q '^JQC_SKIP_STARTUP_CHECK=' "$envfile"; then
            echo "::error::STAGING_BACKEND_ENV sets JQC_SKIP_STARTUP_CHECK; remove it (the entrypoint refuses it under staging settings)."
            exit 1
          fi
          # Keys the deploy checks need (accounts.E005 and the OTP hash): present and non-empty.
          # Their length and distinctness are checked by the entrypoint's `check --deploy` below.
          missing=""
          for key in DJANGO_SECRET_KEY JWT_SIGNING_KEY OTP_HASH_KEY; do
            grep -Eq "^${key}=.+" "$envfile" || missing="$missing $key"
          done
          if [ -n "$missing" ]; then
            echo "::error::STAGING_BACKEND_ENV is missing or empty for:$missing (docs/deployment.md §11.1)."
            exit 1
          fi
          # The image ENTRYPOINT runs `check --deploy --fail-level ERROR`, then the command (`true`).
          docker run --rm --network none --env-file "$envfile" "$IMAGE" true

  deploy:
    name: Deploy (not configured until D-05)
    needs: preflight
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - name: Placeholder
        run: |
          echo "::error::Staging hosting is not decided (D-05). Push the image, run the release task (jqc-release), then roll web, worker and beat (docs/deployment.md §8.2) once it is."
          exit 1
