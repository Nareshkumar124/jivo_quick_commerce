# jqc.jivo.in: the ONLY nginx file JQC adds to the shared host (plan.md §0 R1-R5, §4).
# Installed as /etc/nginx/sites-available/jqc.jivo.in.conf + a sites-enabled symlink.
#
# Coexistence rules:
# - server_name jqc.jivo.in only. No default_server, no catch-all, no wildcard (R2).
# - Every http-level name is prefixed jqc_ (zones, cache zone, map variables, upstream,
#   log_format) (R3). The /media/ proxy cache lives in /srv/jqc/cache/nginx-media (JQC's tree).
#   The host already defines $connection_upgrade and zones `general` / `api`: never reuse them.
# - limit_*_status, server_tokens and logging are set inside our server blocks, never at http level.
# - Always `nginx -t` then `systemctl reload nginx` (never restart) (R4).
#
# Bootstrap (before the certificate exists): install the file WITHOUT the lines between the
# "BEGIN JQC HTTPS" and "END JQC HTTPS" markers (README.md), issue the certificate with
# certbot --webroot, then install the full file. Adapted from infra/nginx/default.conf.

# --------------------------------------------------------------------------- http-level (jqc_ only)
# Per-IP edge limits (docs/deployment.md §9.1). Coarse flood caps only: the backend counts signed-in
# callers per user (T-817) and keeps per-phone OTP limits. Indian carriers put hundreds of customers
# behind one CGNAT address, so every zone except OTP and staff is sized for that (T-819):
# - jqc_api 40 r/s (2400/min): above the backend's own per-IP ceilings (anonymous 300/min plus
#   signed-in 1500/min, SIGNED_IN_IP_RATE), so the edge never 429s a CGNAT crowd before the
#   backend's per-user buckets decide.
# - jqc_search 10 r/s: search and suggest (a call per typing pause) for ~30 people typing at once.
# - jqc_media 100 r/s, burst 500: product images have their own zone, so images and API calls never
#   starve each other. One screen shows 40-60 tiles; most are served from the proxy cache below.
# - jqc_ws_upgrade + jqc_ws_conn: WebSocket handshakes and open sockets, capped by the host's
#   connection budget (see the /ws/ location).
# - jqc_otp and jqc_staff stay strict (each OTP request costs an SMS; staff are few).
limit_req_zone $binary_remote_addr zone=jqc_api:20m        rate=40r/s;
limit_req_zone $binary_remote_addr zone=jqc_otp:10m        rate=60r/m;
limit_req_zone $binary_remote_addr zone=jqc_search:10m     rate=10r/s;
limit_req_zone $binary_remote_addr zone=jqc_staff:10m      rate=10r/s;
limit_req_zone $binary_remote_addr zone=jqc_media:10m      rate=100r/s;
limit_req_zone $binary_remote_addr zone=jqc_ws_upgrade:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=jqc_ws_conn:10m;

# Public catalog images (/media/ -> MinIO bucket jivo-public): a stop-gap until a CDN exists
# (T-819, scaling-strategy A6). The directory is inside JQC's own tree; create it once before
# `nginx -t`, owned by the nginx worker user (infra/deploy/README.md). 1 GB cap (the WebP
# renditions are a few hundred MB at most); entries unused for 7 days are evicted. Private objects
# are never cached: see the /media/ location.
proxy_cache_path /srv/jqc/cache/nginx-media levels=1:2 keys_zone=jqc_media_cache:10m
                 max_size=1g inactive=7d use_temp_path=off;

# /static/ cache lifetime (T-817 manifest storage). collectstatic writes every file twice: a
# content-hashed copy (`base.4f1d2c3b5a6e.css`, 12 hex digits in Django 5.2) that never changes,
# and the plain name, which is overwritten on a deploy. Only hashed names may be immutable. Plain
# names (staticfiles.json, admin JS that builds icon paths at run time, anything not referenced
# through {% static %}) get one hour and then revalidate with ETag / Last-Modified.
map $uri $jqc_static_cache_control {
    "~^/static/.+\.[0-9a-f]{12}\.[A-Za-z0-9]+$" "public, max-age=31536000, immutable";
    default                                     "public, max-age=3600";
}

# Path without the query string (lat/lng), no request headers that can carry tokens (L8, L11).
log_format jqc_json escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
  '"path":"$uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
  '"upstream_time":"$upstream_response_time","request_id":"$request_id",'
  '"user_agent":"$http_user_agent"}';

map $http_upgrade $jqc_connection_upgrade {
    default upgrade;
    ""      close;
}

upstream jqc_backend {
    server 127.0.0.1:18001;   # compose service `web` (127.0.0.1 only)
    keepalive 16;
}

# --------------------------------------------------------------------------- HTTP :80
server {
    listen 80;
    listen [::]:80;
    server_name jqc.jivo.in;

    server_tokens off;
    access_log /var/log/nginx/jqc.access.log jqc_json;
    error_log  /var/log/nginx/jqc.error.log warn;

    # ACME http-01 for certbot --webroot (our own webroot, not shared with other sites).
    location ^~ /.well-known/acme-challenge/ {
        root /srv/jqc/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# BEGIN JQC HTTPS
# --------------------------------------------------------------------------- HTTPS :443
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jqc.jivo.in;

    ssl_certificate     /etc/letsencrypt/live/jqc.jivo.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jqc.jivo.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    access_log /var/log/nginx/jqc.access.log jqc_json;
    error_log  /var/log/nginx/jqc.error.log warn;

    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;

    # HSTS for this host only (Django's own header is hidden so there is exactly one).
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Default body cap: the backend refuses bodies over 2.5 MB (DATA_UPLOAD_MAX_MEMORY_SIZE).
    client_max_body_size 2560k;

    # Compression (T-819, BREACH-safe; docs/deployment.md §9.6). OFF for this site by default,
    # whatever the host's nginx.conf says, and switched on only in locations whose responses hold
    # no secret: public catalog, home, search, serviceability, CMS/config JSON and static files.
    # Never for auth/OTP, /me, addresses, cart, orders, payments, rider, support, admin or ops.
    # The settings below are inert until a location says `gzip on`.
    gzip off;
    gzip_types application/json text/css application/javascript text/javascript image/svg+xml;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection "";

    # JSON envelopes (06 §6) for answers nginx gives itself.
    error_page 429 = @jqc_rate_limited;
    error_page 413 = @jqc_too_large;
    location @jqc_rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Please try again shortly.","details":{"retry_after_seconds":60}}}';
    }
    location @jqc_otp_rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error":{"code":"OTP_RATE_LIMITED","message":"Too many OTP requests. Please try again shortly.","details":{"retry_after_seconds":60}}}';
    }
    location @jqc_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"The request is too large.","details":{}}}';
    }

    # collectstatic output, copied out of the image on each deploy (README.md): URI /static/x is
    # the file /srv/jqc/static/x. Cache-Control per name (map above). An `add_header` here replaces
    # the server-level ones, so HSTS is repeated.
    location /static/ {
        root /srv/jqc;
        access_log off;
        gzip on;
        add_header Cache-Control $jqc_static_cache_control;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Public catalog media: the jivo-public bucket only, read only (S3_PUBLIC_MEDIA_DOMAIN). The
    # private bucket (jivo-media: KYC files, invoices, exports) is not reachable through here at
    # all: the upstream path is fixed to /jivo-public/ and nginx normalises the URI first.
    # Cache (T-819): the key is the path only. A request with any query string (e.g. a presigned
    # URL's X-Amz-* signature) or an Authorization header is neither answered from nor stored in
    # the cache. Upstream Cache-Control / Expires win over proxy_cache_valid; responses with
    # Set-Cookie or Cache-Control private / no-store are never stored (nginx defaults, kept).
    location /media/ {
        limit_except GET HEAD { deny all; }
        limit_req zone=jqc_media burst=500 nodelay;
        proxy_pass http://127.0.0.1:19000/jivo-public/;
        proxy_set_header Host 127.0.0.1:19000;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Connection "";
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header Set-Cookie;
        proxy_cache jqc_media_cache;
        proxy_cache_key "jqc_media$uri";
        proxy_cache_bypass $args $http_authorization;
        proxy_no_cache $args $http_authorization;
        proxy_cache_valid 200 1d;
        proxy_cache_valid 404 1m;
        proxy_cache_revalidate on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        expires 30d;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Private media (bucket jivo-media: KYC files, invoices, support photos, report exports) via
    # presigned links only. The backend signs them for https://jqc.jivo.in/jivo-media/<key>
    # (S3_PRESIGN_ENDPOINT_URL, path-style SigV4, X-Amz-SignedHeaders=host). The bucket stays
    # private: MinIO refuses (403) anything without a valid, unexpired signature.
    # - proxy_pass has NO URI part, so the request URI and the full query string reach MinIO exactly
    #   as the client sent them (the signature covers the path and every X-Amz-* parameter).
    # - Host must stay jqc.jivo.in (the signed host). $host is lowercased and has no port, which is
    #   what botocore signed for https on 443. No X-Forwarded-Host is sent.
    # - Never cached here or by browsers/proxies (no proxy_cache in this location; no-store below).
    # - Uploaded files share the jqc.jivo.in origin with /admin and /ops, so scripts are blocked
    #   (CSP script-src 'none', nosniff): an uploaded HTML/SVG file cannot run as the site.
    # - An `add_header` here replaces the server-level ones, so HSTS is repeated.
    location = /jivo-media/ {
        return 404;
    }
    location /jivo-media/ {
        limit_except GET HEAD { deny all; }
        limit_req zone=jqc_media burst=100 nodelay;
        proxy_pass http://127.0.0.1:19000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "script-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location /health/ {
        proxy_pass http://jqc_backend;
        access_log off;
    }

    # WebSockets (/ws/v1/..., /ws/ops/live/). The JWT travels in the first message.
    # Per IP: 200 open sockets, 50 handshakes/s with a burst of 200. Customers (order tracking)
    # and riders (connected while online) share carrier CGNAT addresses, so the old cap of 50
    # could lock out everyone on one carrier IP in a city. The cap is bounded by the SHARED HOST:
    # each socket costs two nginx connections (client + upstream) out of the host's
    # worker_processes x worker_connections (Debian default 768 per worker), which the other
    # sites need too, so one IP may hold at most ~400 slots. Raise it (towards 500, the 09 §1
    # launch target) only after `nginx -T` shows the headroom (docs/deployment.md §9.1, §8.5).
    # The burst lets one IP's reconnect wave after a deploy (apps retry with jitter) through.
    location /ws/ {
        limit_conn jqc_ws_conn 200;
        limit_req zone=jqc_ws_upgrade burst=200 nodelay;
        client_max_body_size 64k;
        proxy_pass http://jqc_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jqc_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /api/v1/auth/otp/request/ {
        limit_req zone=jqc_otp burst=30 nodelay;
        error_page 429 = @jqc_otp_rate_limited;
        error_page 413 = @jqc_too_large;
        client_max_body_size 16k;
        proxy_pass http://jqc_backend;
    }

    # Search and suggest: per store, the same for every caller (no secret), so compressed.
    location /api/v1/search/ {
        limit_req zone=jqc_search burst=40 nodelay;
        client_max_body_size 16k;
        gzip on;
        proxy_pass http://jqc_backend;
    }

    location /api/v1/rider/documents/ {
        limit_req zone=jqc_api burst=10 nodelay;
        client_max_body_size 1200k;
        proxy_pass http://jqc_backend;
    }

    location = /api/v1/payments/razorpay/webhook/ {
        client_max_body_size 256k;
        proxy_pass http://jqc_backend;
    }

    # Support ticket photos (customer and rider): up to 5 MB (SUPPORT_ATTACHMENT_MAX_BYTES) plus
    # multipart overhead. A regex location: nginx picks the longest matching prefix (/api/ here,
    # which has no ^~), then checks regex locations in order and the first match wins, so this
    # path lands here, not in /api/ below. Everything except the body cap is the /api/ block's:
    # same zone and burst, and the server-level proxy headers and error_page list are inherited
    # because this block sets neither.
    location ~ ^/api/v1/support/tickets/\d+/attachments/$ {
        limit_req zone=jqc_api burst=80 nodelay;
        client_max_body_size 5300k;
        proxy_pass http://jqc_backend;
    }

    # Public read JSON, compressed (T-819, §9.6): home, categories, products, collections,
    # serviceability (not notify-me), app config, CMS pages and FAQs. None carries a token, OTP,
    # address, order or payment detail (home's per-user part is the "Previously bought" product
    # list), and none echoes request input next to a secret. Everything else under /api/ stays
    # uncompressed. Same limits as /api/. A regex location, checked after the prefix locations; it
    # overlaps none of the exact, prefix or regex locations above.
    location ~ ^/api/v1/(?:home/|categories/|products/(?:[^/]+/)?|collections/[^/]+/|serviceability/|config/app/|pages/[^/]+/|faqs/)$ {
        limit_req zone=jqc_api burst=80 nodelay;
        gzip on;
        proxy_pass http://jqc_backend;
    }

    location /api/ {
        limit_req zone=jqc_api burst=80 nodelay;
        proxy_pass http://jqc_backend;
    }

    # Staff panel. Product images up to 5 MB (09 §3.6).
    location ~ ^/(admin|ops)/ {
        limit_req zone=jqc_staff burst=40 nodelay;
        client_max_body_size 6m;
        proxy_pass http://jqc_backend;
    }

    location / {
        limit_req zone=jqc_api burst=80 nodelay;
        proxy_pass http://jqc_backend;
    }
}
# END JQC HTTPS
