# jqc.jivo.in: the ONLY nginx file JQC adds to the shared host (plan.md §0 R1-R5, §4).
# Installed as /etc/nginx/sites-available/jqc.jivo.in.conf + a sites-enabled symlink.
#
# Coexistence rules:
# - server_name jqc.jivo.in only. No default_server, no catch-all, no wildcard (R2).
# - Every http-level name is prefixed jqc_ (zones, map variable, upstream, log_format) (R3).
#   The host already defines $connection_upgrade and zones `general` / `api`: never reuse them.
# - limit_*_status, server_tokens and logging are set inside our server blocks, never at http level.
# - Always `nginx -t` then `systemctl reload nginx` (never restart) (R4).
#
# Bootstrap (before the certificate exists): install the file WITHOUT the lines between the
# "BEGIN JQC HTTPS" and "END JQC HTTPS" markers (README.md), issue the certificate with
# certbot --webroot, then install the full file. Adapted from infra/nginx/default.conf.

# --------------------------------------------------------------------------- http-level (jqc_ only)
limit_req_zone $binary_remote_addr zone=jqc_api:20m    rate=20r/s;
limit_req_zone $binary_remote_addr zone=jqc_otp:10m    rate=60r/m;
limit_req_zone $binary_remote_addr zone=jqc_search:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=jqc_staff:10m  rate=10r/s;
limit_conn_zone $binary_remote_addr zone=jqc_ws_conn:10m;

# Path without the query string (lat/lng), no request headers that can carry tokens (L8, L11).
log_format jqc_json escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
  '"path":"$uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
  '"upstream_time":"$upstream_response_time","request_id":"$request_id",'
  '"user_agent":"$http_user_agent"}';

map $http_upgrade $jqc_connection_upgrade {
    default upgrade;
    ""      close;
}

upstream jqc_backend {
    server 127.0.0.1:18001;   # compose service `web` (127.0.0.1 only)
    keepalive 16;
}

# --------------------------------------------------------------------------- HTTP :80
server {
    listen 80;
    listen [::]:80;
    server_name jqc.jivo.in;

    server_tokens off;
    access_log /var/log/nginx/jqc.access.log jqc_json;
    error_log  /var/log/nginx/jqc.error.log warn;

    # ACME http-01 for certbot --webroot (our own webroot, not shared with other sites).
    location ^~ /.well-known/acme-challenge/ {
        root /srv/jqc/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# BEGIN JQC HTTPS
# --------------------------------------------------------------------------- HTTPS :443
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jqc.jivo.in;

    ssl_certificate     /etc/letsencrypt/live/jqc.jivo.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jqc.jivo.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    access_log /var/log/nginx/jqc.access.log jqc_json;
    error_log  /var/log/nginx/jqc.error.log warn;

    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;

    # HSTS for this host only (Django's own header is hidden so there is exactly one).
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Default body cap: the backend refuses bodies over 2.5 MB (DATA_UPLOAD_MAX_MEMORY_SIZE).
    client_max_body_size 2560k;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection "";

    # JSON envelopes (06 §6) for answers nginx gives itself.
    error_page 429 = @jqc_rate_limited;
    error_page 413 = @jqc_too_large;
    location @jqc_rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Please try again shortly.","details":{"retry_after_seconds":60}}}';
    }
    location @jqc_otp_rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error":{"code":"OTP_RATE_LIMITED","message":"Too many OTP requests. Please try again shortly.","details":{"retry_after_seconds":60}}}';
    }
    location @jqc_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"The request is too large.","details":{}}}';
    }

    # collectstatic output, copied out of the image on each deploy (README.md).
    location /static/ {
        alias /srv/jqc/static/;
        expires 7d;
        access_log off;
    }

    # Public catalog media: the jivo-public bucket only, read only (S3_PUBLIC_MEDIA_DOMAIN).
    location /media/ {
        limit_except GET HEAD { deny all; }
        limit_req zone=jqc_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:19000/jivo-public/;
        proxy_set_header Host 127.0.0.1:19000;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        expires 30d;
    }

    location /health/ {
        proxy_pass http://jqc_backend;
        access_log off;
    }

    # WebSockets (/ws/v1/..., /ws/ops/live/). The JWT travels in the first message.
    location /ws/ {
        limit_conn jqc_ws_conn 50;
        limit_req zone=jqc_api burst=20 nodelay;
        client_max_body_size 64k;
        proxy_pass http://jqc_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jqc_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /api/v1/auth/otp/request/ {
        limit_req zone=jqc_otp burst=30 nodelay;
        error_page 429 = @jqc_otp_rate_limited;
        error_page 413 = @jqc_too_large;
        client_max_body_size 16k;
        proxy_pass http://jqc_backend;
    }

    location /api/v1/search/ {
        limit_req zone=jqc_search burst=20 nodelay;
        client_max_body_size 16k;
        proxy_pass http://jqc_backend;
    }

    location /api/v1/rider/documents/ {
        limit_req zone=jqc_api burst=10 nodelay;
        client_max_body_size 1200k;
        proxy_pass http://jqc_backend;
    }

    location = /api/v1/payments/razorpay/webhook/ {
        client_max_body_size 256k;
        proxy_pass http://jqc_backend;
    }

    # Support ticket photos (customer and rider): up to 5 MB (SUPPORT_ATTACHMENT_MAX_BYTES) plus
    # multipart overhead. A regex location: nginx picks the longest matching prefix (/api/ here,
    # which has no ^~), then checks regex locations in order and the first match wins, so this
    # path lands here, not in /api/ below. Everything except the body cap is the /api/ block's:
    # same zone and burst, and the server-level proxy headers and error_page list are inherited
    # because this block sets neither.
    location ~ ^/api/v1/support/tickets/\d+/attachments/$ {
        limit_req zone=jqc_api burst=40 nodelay;
        client_max_body_size 5300k;
        proxy_pass http://jqc_backend;
    }

    location /api/ {
        limit_req zone=jqc_api burst=40 nodelay;
        proxy_pass http://jqc_backend;
    }

    # Staff panel. Product images up to 5 MB (09 §3.6).
    location ~ ^/(admin|ops)/ {
        limit_req zone=jqc_staff burst=40 nodelay;
        client_max_body_size 6m;
        proxy_pass http://jqc_backend;
    }

    location / {
        limit_req zone=jqc_api burst=40 nodelay;
        proxy_pass http://jqc_backend;
    }
}
# END JQC HTTPS
