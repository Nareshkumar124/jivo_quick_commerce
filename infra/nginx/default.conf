# Placeholder for the edge proxy (02 §1, §8). Not part of the local compose stack yet.
# TLS terminates here (or at the cloud load balancer); Django trusts X-Forwarded-Proto.

upstream jivo_backend {
    server backend:8000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    location /static/ {
        alias /srv/static/;   # collectstatic output (STATIC_ROOT) mounted here
        expires 7d;
    }

    location /ws/ {
        proxy_pass http://jivo_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # /api, /admin, /ops, /health
    location / {
        proxy_pass http://jivo_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
