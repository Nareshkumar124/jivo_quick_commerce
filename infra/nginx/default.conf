# Edge proxy for the backend (02 §1, §8; docs/deployment.md §6 and §9). Not part of the local
# compose stack. Included in the `http {}` context (the official nginx image loads conf.d/*.conf),
# so the zone, map and log_format directives below are valid here.
#
# TLS terminates here or at the cloud load balancer; Django trusts X-Forwarded-Proto and counts
# NUM_PROXIES hops in X-Forwarded-For (docs/deployment.md §9.5: set it per topology).
#
# P8 hardening (OWASP review): per-IP request limits (H3 edge half), body size per location,
# access logs without query strings (L8) and without any request header that can carry a token
# (L11: Sec-WebSocket-Protocol, Authorization, Cookie are never logged).

# --------------------------------------------------------------------------- client address
# Behind a load balancer, $remote_addr is the balancer, so every client would share one rate
# limit bucket. Uncomment and set the balancer's subnets so nginx takes the client address from
# X-Forwarded-For (rightmost untrusted hop). Leave commented when nginx faces the internet.
# set_real_ip_from 10.0.0.0/16;        # <load-balancer-subnet-cidr>
# real_ip_header X-Forwarded-For;
# real_ip_recursive on;

# --------------------------------------------------------------------------- rate limits
# Coarse edge limits: the backend keeps its own per-user and per-phone throttles (OTP: 3 per 10
# min per phone, fail-closed), which give the real error codes. These only cap floods per IP, and
# are deliberately generous because mobile carriers put many customers behind one CGNAT address.
limit_req_zone $binary_remote_addr zone=jqc_api:20m    rate=20r/s;
limit_req_zone $binary_remote_addr zone=jqc_otp:10m    rate=10r/m;
limit_req_zone $binary_remote_addr zone=jqc_search:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=jqc_staff:10m  rate=10r/s;
limit_conn_zone $binary_remote_addr zone=jqc_ws_conn:10m;
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;

# --------------------------------------------------------------------------- access log (L8, L11)
# $uri is the path without the query string: serviceability and notify-me carry lat/lng there.
# No $request, no $request_uri, no $args, no $http_* request headers (Sec-WebSocket-Protocol,
# Authorization, Cookie). JSON so the log store can parse it.
log_format jqc_json escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
  '"path":"$uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
  '"upstream_time":"$upstream_response_time","request_id":"$request_id",'
  '"user_agent":"$http_user_agent"}';

upstream jivo_backend {
    server backend:8000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log jqc_json;
    server_tokens off;

    # Default for everything not listed below: the backend refuses bodies over 2.5 MB
    # (DATA_UPLOAD_MAX_MEMORY_SIZE, 413 PAYLOAD_TOO_LARGE); the edge stops them first.
    client_max_body_size 2560k;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection "";

    # JSON envelopes (06 §6) for answers nginx gives itself.
    error_page 429 = @rate_limited;
    error_page 413 = @too_large;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Please try again shortly.","details":{"retry_after_seconds":60}}}';
    }
    location @otp_rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error":{"code":"OTP_RATE_LIMITED","message":"Too many OTP requests. Please try again shortly.","details":{"retry_after_seconds":60}}}';
    }
    location @too_large {
        default_type application/json;
        return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"The request is too large.","details":{}}}';
    }

    location /static/ {
        alias /srv/static/;   # collectstatic output (STATIC_ROOT) mounted here
        expires 7d;
        access_log off;
    }

    # Load-balancer probes: never limited, never logged.
    location /health/ {
        proxy_pass http://jivo_backend;
        access_log off;
    }

    # WebSockets (/ws/v1/..., /ws/ops/live/). The JWT travels in the first message, never in the
    # URL or a header (CLAUDE.md); the log format above logs no headers anyway.
    location /ws/ {
        limit_conn jqc_ws_conn 10;          # sockets per IP (a customer has 1-2, ops screens a few)
        limit_req zone=jqc_api burst=20 nodelay;   # the upgrade requests themselves
        client_max_body_size 64k;
        proxy_pass http://jivo_backend;
        # proxy_set_header here replaces the server-level list, so repeat it in full.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # OTP request/verify: the strictest edge limit (SMS cost, enumeration).
    location /api/v1/auth/otp/ {
        limit_req zone=jqc_otp burst=5 nodelay;
        error_page 429 = @otp_rate_limited;
        error_page 413 = @too_large;        # error_page here replaces the server-level list
        client_max_body_size 16k;
        proxy_pass http://jivo_backend;
    }

    # Search and suggestions: typed-ahead, cheap to send, costly to answer.
    location /api/v1/search/ {
        limit_req zone=jqc_search burst=20 nodelay;
        client_max_body_size 16k;
        proxy_pass http://jivo_backend;
    }

    # Rider KYC uploads: 1 MB images (RIDER_DOCUMENT_MAX_BYTES) plus multipart overhead.
    location /api/v1/rider/documents/ {
        limit_req zone=jqc_api burst=10 nodelay;
        client_max_body_size 1200k;
        proxy_pass http://jivo_backend;
    }

    # Razorpay webhooks come from a few gateway IPs in bursts: not rate limited here (they are
    # signed, stored once per event id, and retried by Razorpay on any non-2xx answer).
    location = /api/v1/payments/razorpay/webhook/ {
        client_max_body_size 256k;
        proxy_pass http://jivo_backend;
    }

    location /api/ {
        limit_req zone=jqc_api burst=40 nodelay;
        proxy_pass http://jivo_backend;
    }

    # Staff panel. Product images may be up to 5 MB (09 §3.6, CATALOG_IMAGE_MAX_BYTES).
    location ~ ^/(admin|ops)/ {
        limit_req zone=jqc_staff burst=40 nodelay;
        client_max_body_size 6m;
        proxy_pass http://jivo_backend;
    }

    location / {
        limit_req zone=jqc_api burst=40 nodelay;
        proxy_pass http://jivo_backend;
    }
}
