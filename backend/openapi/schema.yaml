    Order:
      type: object
      description: An order with its bill. The bill is a snapshot made by `compute_bill()`
        at placement.
      properties:
        id:
          type: integer
        order_number:
          type: string
          description: Shown to the customer, e.g. "JV-261103-000123".
        status:
          allOf:
          - $ref: '#/components/schemas/OrderStatusEnum'
          description: |-
            08 §1.

            * `PAYMENT_PENDING` - Completing payment…
            * `PLACED` - Order placed
            * `ACCEPTED` - Order confirmed
            * `PACKING` - Packing your order
            * `PACKED` - Packed, rider on the way to store
            * `OUT_FOR_DELIVERY` - On the way
            * `DELIVERED` - Delivered
            * `CANCELLED` - Cancelled
            * `PAYMENT_FAILED` - Payment failed
            * `DELIVERY_FAILED` - Delivery unsuccessful
            * `RETURNED` - Delivery unsuccessful
        payment_method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        payment_status:
          $ref: '#/components/schemas/PaymentStatusEnum'
        store:
          $ref: '#/components/schemas/OrderStore'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        item_count:
          type: integer
          minimum: 1
          description: Units (sum of quantities).
        bill:
          $ref: '#/components/schemas/Bill'
        coupon_code:
          type: string
          nullable: true
          description: Null when none was used.
        address:
          $ref: '#/components/schemas/OrderAddress'
        instructions:
          $ref: '#/components/schemas/DeliveryInstructions'
        created_at:
          type: string
          format: date-time
        placed_at:
          type: string
          format: date-time
          nullable: true
          description: When it reached PLACED (paid online, or confirmed COD); null
            before.
        payment_expires_at:
          type: string
          format: date-time
          nullable: true
          description: 'PAYMENT_PENDING only: the end of the online payment window
            (15 minutes from placement, a server setting). Retrying the payment does
            not extend it. After it the order fails and the stock is released. Null
            in every other state.'
        eta_at:
          type: string
          format: date-time
          nullable: true
          description: Promised delivery time (UTC; show it in IST). Null until PLACED.
        can_cancel:
          type: boolean
          description: 'True when `POST /orders/{id}/cancel/` is allowed now (08 §7).
            Phase 3: only in PAYMENT_PENDING; from Phase 4 also PLACED and ACCEPTED.'
        can_retry_payment:
          type: boolean
          description: 'True when `POST /orders/{id}/retry-payment/` is allowed now:
            an ONLINE order in PAYMENT_PENDING before `payment_expires_at`.'
      required:
      - address
      - bill
      - can_cancel
      - can_retry_payment
      - coupon_code
      - created_at
      - eta_at
      - id
      - instructions
      - item_count
      - items
      - order_number
      - payment_expires_at
      - payment_method
      - payment_status
      - placed_at
      - status
      - store
    OrderAddress:
      type: object
