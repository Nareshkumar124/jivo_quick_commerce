  /api/v1/orders/{id}/cancel/:
    post:
      operationId: orders_cancel
      description: |-
        08 §7: allowed in PAYMENT_PENDING, PLACED and ACCEPTED; use `can_cancel` to show the button (from PACKING on, show 'Contact support').

        - **PAYMENT_PENDING (T5):** the customer gives up on paying or wants to pay another way: the stock and the coupon hold are released; the cart is still there.
