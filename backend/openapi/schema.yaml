        email:
          type: string
          format: email
          nullable: true
          description: Optional. Send null (or an empty string) to remove it. Must
            be unique.
        marketing_opt_in:
          type: boolean
          description: Consent to promotional push notifications.
        is_profile_complete:
          type: boolean
          readOnly: true
          description: 'False until a name is set: show the complete-profile screen.'
        rider_status:
          allOf:
          - $ref: '#/components/schemas/RiderStatusEnum'
          readOnly: true
          description: |-
            Rider profile status; NONE without a rider profile (always NONE until Phase 5).

            * `NONE` - No rider profile: show registration
            * `PENDING_KYC` - Registered, waiting for KYC approval
            * `ACTIVE` - Approved: can go online
            * `REJECTED` - KYC rejected: see the reason, re-submit
            * `SUSPENDED` - Suspended by ops
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_profile_complete
      - name
      - phone
      - rider_status
    NotifyMe:
      type: object
      description: '`POST /serviceability/notify-me/`: interest in delivery to an
        unserviced location.'
      properties:
        id:
          type: integer
          readOnly: true
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
          description: Latitude (WGS84, decimal degrees).
        lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
          description: Longitude (WGS84, decimal degrees).
        phone:
          type: string
          nullable: true
          description: 'Contact for the ''we now deliver here'' message. Optional:
            defaults to the signed-in user''s phone; anonymous requests without it
            are kept as a demand signal only.'
          pattern: ^\+91[6-9][0-9]{9}$
        address_text:
          type: string
          description: The reverse-geocoded address shown on the map screen (for ops
            planning).
          maxLength: 500
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - lat
      - lng
    NotifyMeRequest:
      type: object
      description: '`POST /serviceability/notify-me/`: interest in delivery to an
        unserviced location.'
      properties:
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
          description: Latitude (WGS84, decimal degrees).
        lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
          description: Longitude (WGS84, decimal degrees).
        phone:
          type: string
          nullable: true
          minLength: 1
          description: 'Contact for the ''we now deliver here'' message. Optional:
            defaults to the signed-in user''s phone; anonymous requests without it
            are kept as a demand signal only.'
          pattern: ^\+91[6-9][0-9]{9}$
        address_text:
          type: string
