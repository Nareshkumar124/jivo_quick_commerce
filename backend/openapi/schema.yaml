  /api/v1/orders/{id}/retry-payment/:
    post:
      operationId: orders_retry_payment
      description: 'For an ONLINE order in PAYMENT_PENDING before `payment_expires_at`
        (the ''Payment failed'' screen''s Retry, 03 §2.9): creates a new Razorpay
        order for the same amount and returns new checkout options. The payment window
        is **not** extended. To pay another way, cancel the order (`POST /orders/{id}/cancel/`)
        and place a new one: the cart is still there.'
      summary: Retry the online payment
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{8,64}$
        description: 'One key per attempt (a UUID v4 is recommended), 8-64 letters,
          digits, `-` or `_`. Send the **same** key again when retrying after a timeout
          or a lost response: the original result is returned and nothing is done
          twice. Only a successful result is remembered, so a failed attempt may be
          retried with the same key. The same key with a different body is a 400.
          Missing or malformed: 400 `VALIDATION_ERROR` with `details: {"Idempotency-Key":
          [...]}`.'
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: '`Order.id`.'
        required: true
      tags:
      - orders
      security:
      - jwtAuth: []
