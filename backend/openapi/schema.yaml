          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                TOKENINVALID:
                  value:
                    error:
                      code: TOKEN_INVALID
                      message: Given token not valid for any token type
                      details: {}
                  summary: Expired token
          description: Only when an `Authorization` header is sent and the token is
            invalid, expired or revoked. Anonymous calls (no header) never get 401.
            Refresh once and retry, or retry without the header after logout.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                XSTOREIDMISSING:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Some fields are invalid.
                      details:
                        X-Store-Id:
                        - This header is required.
                  summary: X_STORE_ID_MISSING
                XSTOREIDINVALID:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Some fields are invalid.
                      details:
                        X-Store-Id:
                        - A valid store id is required.
                  summary: X_STORE_ID_INVALID
          description: 'Invalid request: the `X-Store-Id` header is missing or malformed.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                STORENOTFOUND:
                  value:
                    error:
                      code: STORE_NOT_FOUND
                      message: This store is not available. Check serviceability again.
                      details:
                        store_id: 7
                  summary: 'Unknown or deactivated store: check serviceability again'
          description: '`STORE_NOT_FOUND`: the store in `X-Store-Id` does not exist
            or was deactivated.'
        '426':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                APPUPDATEREQUIRED:
                  value:
                    error:
                      code: APP_UPDATE_REQUIRED
                      message: Please update the app to continue.
                      details:
                        min_supported_version: 1.2.0
                        latest_version: 1.4.0
                        store_url: https://play.google.com/store/apps/details?id=in.jivo.quick
                  summary: APP_UPDATE_REQUIRED
          description: Force update. Sent only when the request carries `X-App-Name`,
            `X-Platform` and `X-App-Version`, and the version is below `min_supported_version`
            for that app and platform. Requests without these headers never get 426.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                MAINTENANCE:
                  value:
                    error:
                      code: MAINTENANCE
                      message: Jivo is down for scheduled maintenance. We will be
                        back by 6:00 AM.
                      details: {}
          description: 'Maintenance mode is on (`/api/v1/config/app/` returns `maintenance:
            true`). `message` is the text to show.'
  /api/v1/me/:
    get:
      operationId: me_retrieve
      description: Also used on app start to restore routing (`rider_status`, profile
        state).
      summary: The signed-in user
      tags:
      - account
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                Customer:
                  value:
                    id: 42
                    phone: '+919876543210'
                    name: Asha Verma
                    email: asha.verma@example.com
                    marketing_opt_in: false
                    is_profile_complete: true
                    rider_status: NONE
                    created_at: '2026-10-20T06:30:00Z'
                ProfileIncomplete:
                  value:
                    id: 42
                    phone: '+919876543210'
                    name: ''
                    email: null
                    marketing_opt_in: false
                    is_profile_complete: false
                    rider_status: NONE
                    created_at: '2026-11-02T10:15:00Z'
                  summary: Profile incomplete
                Rider,KYCPending:
                  value:
                    id: 57
                    phone: '+919811122233'
                    name: Ravi Kumar
                    email: null
                    marketing_opt_in: false
                    is_profile_complete: true
                    rider_status: PENDING_KYC
                    created_at: '2026-10-28T04:00:00Z'
                  summary: Rider, KYC pending
          description: The user.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                AUTHREQUIRED:
                  value:
                    error:
                      code: AUTH_REQUIRED
                      message: Authentication is required.
                      details: {}
                  summary: No Authorization header
                TOKENINVALID:
                  value:
                    error:
                      code: TOKEN_INVALID
                      message: Given token not valid for any token type
                      details: {}
                  summary: Expired token
          description: No access token (`AUTH_REQUIRED`), or the token is invalid,
            expired or revoked (`TOKEN_INVALID`). On `TOKEN_INVALID`, refresh once
