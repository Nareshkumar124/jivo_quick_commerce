openapi: 3.0.3
info:
  title: Jivo Quick Commerce API
  version: 0.1.0
  description: |-
    REST API for the Jivo customer and rider apps.

    Conventions (docs/02-system-architecture.md §5): JSON with snake_case keys; money as 2-decimal strings; times in UTC ISO 8601; pagination with `page`/`page_size` (default 20, max 100). Apps send `X-App-Name`, `X-App-Version` and `X-Platform` on every request. Errors use the envelope `{"error": {"code", "message", "details"}}` (see the `ErrorEnvelope` schema). Any request whose body is larger than 2.5 MB gets 413 `PAYLOAD_TOO_LARGE`.
paths:
  /api/v1/addresses/:
    get:
      operationId: addresses_list
      description: The caller's addresses (deleted ones excluded), default first,
        then newest.
      summary: My saved addresses
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: Page number (1-based). Default 1.
      - in: query
        name: page_size
        schema:
          type: integer
        description: 'Items per page: default 20, max 100.'
      tags:
      - addresses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAddressList'
              examples:
                TwoAddresses:
                  value:
                    count: 2
                    next: null
                    previous: null
                    results:
                    - id: 12
                      label: home
                      custom_label: ''
                      receiver_name: Asha Verma
                      receiver_phone: '+919876543210'
                      house: Flat 402, Tower B
                      building_street: Sunshine Apartments, MG Road
                      landmark: Opposite City Mall
                      area: Sector 14
                      city: Gurugram
                      state: Haryana
                      pincode: '122001'
                      lat: 28.4595
                      lng: 77.0266
                      is_default: true
                      is_serviceable: true
                      created_at: '2026-10-20T06:35:00Z'
                      updated_at: '2026-10-20T06:35:00Z'
                    - id: 13
                      label: other
                      custom_label: Mom's place
                      receiver_name: Sunita Verma
                      receiver_phone: '+919812345678'
                      house: House 18
                      building_street: Block C, Sushant Lok 1
                      landmark: ''
                      area: Sushant Lok
                      city: Gurugram
                      state: Haryana
                      pincode: '122001'
                      lat: 28.4646
                      lng: 77.0864
                      is_default: false
                      is_serviceable: false
                      created_at: '2026-10-25T12:00:00Z'
                      updated_at: '2026-10-25T12:00:00Z'
                  summary: Two addresses
          description: One page.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                AUTHREQUIRED:
                  value:
                    error:
                      code: AUTH_REQUIRED
                      message: Authentication is required.
                      details: {}
                  summary: No Authorization header
                TOKENINVALID:
                  value:
                    error:
                      code: TOKEN_INVALID
                      message: Given token not valid for any token type
                      details: {}
                  summary: Expired token
          description: No access token (`AUTH_REQUIRED`), or the token is invalid,
            expired or revoked (`TOKEN_INVALID`). On `TOKEN_INVALID`, refresh once
            and retry.
        '426':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                APPUPDATEREQUIRED:
                  value:
                    error:
                      code: APP_UPDATE_REQUIRED
                      message: Please update the app to continue.
                      details:
                        min_supported_version: 1.2.0
                        latest_version: 1.4.0
                        store_url: https://play.google.com/store/apps/details?id=in.jivo.quick
                  summary: APP_UPDATE_REQUIRED
          description: Force update. Sent only when the request carries `X-App-Name`,
            `X-Platform` and `X-App-Version`, and the version is below `min_supported_version`
            for that app and platform. Requests without these headers never get 426.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                MAINTENANCE:
                  value:
                    error:
                      code: MAINTENANCE
                      message: Jivo is down for scheduled maintenance. We will be
                        back by 6:00 AM.
                      details: {}
          description: 'Maintenance mode is on (`/api/v1/config/app/` returns `maintenance:
            true`). `message` is the text to show.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                PAGENOTFOUND:
                  value:
                    error:
                      code: NOT_FOUND
                      message: Invalid page.
                      details: {}
                  summary: Page out of range
          description: '`page` is not a page of this list: 0, past the last page,
            or not a number. Go back to page 1.'
    post:
      operationId: addresses_create
      description: '`lat`/`lng` (the map pin) are required. `receiver_name`/`receiver_phone`
        default to the user''s own. The user''s first address becomes the default.
        Saving an address outside the service area is allowed; it is flagged from
        Phase 2 (03 §2.4).'
      summary: Add an address
      tags:
      - addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
            examples:
              NewAddress:
                value:
                  label: other
                  custom_label: Mom's place
                  receiver_name: Sunita Verma
                  receiver_phone: '+919812345678'
                  house: House 18
                  building_street: Block C, Sushant Lok 1
                  area: Sushant Lok
                  city: Gurugram
                  state: Haryana
                  pincode: '122001'
                  lat: 28.4646
                  lng: 77.0864
                summary: New address
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
              examples:
                Created:
                  value:
                    id: 13
                    label: other
                    custom_label: Mom's place
                    receiver_name: Sunita Verma
                    receiver_phone: '+919812345678'
                    house: House 18
                    building_street: Block C, Sushant Lok 1
                    landmark: ''
                    area: Sushant Lok
                    city: Gurugram
                    state: Haryana
                    pincode: '122001'
                    lat: 28.4646
                    lng: 77.0864
                    is_default: false
                    is_serviceable: false
                    created_at: '2026-10-25T12:00:00Z'
                    updated_at: '2026-10-25T12:00:00Z'
          description: Created.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                VALIDATIONERROR:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Some fields are invalid.
                      details:
                        pincode:
                        - Enter a 6-digit PIN code.
                        lat:
                        - This field is required.
                        lng:
                        - This field is required.
                  summary: VALIDATION_ERROR
          description: Invalid fields.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                AUTHREQUIRED:
                  value:
                    error:
                      code: AUTH_REQUIRED
                      message: Authentication is required.
                      details: {}
                  summary: No Authorization header
                TOKENINVALID:
                  value:
                    error:
                      code: TOKEN_INVALID
                      message: Given token not valid for any token type
                      details: {}
                  summary: Expired token
          description: No access token (`AUTH_REQUIRED`), or the token is invalid,
            expired or revoked (`TOKEN_INVALID`). On `TOKEN_INVALID`, refresh once
            and retry.
        '426':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                APPUPDATEREQUIRED:
                  value:
                    error:
                      code: APP_UPDATE_REQUIRED
                      message: Please update the app to continue.
                      details:
                        min_supported_version: 1.2.0
                        latest_version: 1.4.0
                        store_url: https://play.google.com/store/apps/details?id=in.jivo.quick
                  summary: APP_UPDATE_REQUIRED
          description: Force update. Sent only when the request carries `X-App-Name`,
            `X-Platform` and `X-App-Version`, and the version is below `min_supported_version`
            for that app and platform. Requests without these headers never get 426.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                MAINTENANCE:
                  value:
                    error:
                      code: MAINTENANCE
