    post:
      operationId: orders_create
      description: |-
        Places the cart as an order at the store in `X-Store-Id` (08 T1/T2). Stock is reserved now, never earlier (08 §6.1). The server re-checks everything: the address is served by the store, the store is open, every line is available (else 409 `STOCK_UNAVAILABLE`), the minimum order, the coupon, and that its bill equals `expected_grand_total` (else 409 `PRICE_CHANGED`: reload the cart).

        **COD:** the order is PLACED at once (`razorpay` is null) and the cart is emptied. COD needs the store to offer it and `grand_total` within its limit.

        **ONLINE:** the order is PAYMENT_PENDING for the payment window (15 minutes); the stock and the coupon are held. Open Razorpay checkout with `razorpay`, then call `POST /payments/razorpay/verify/`. The cart is emptied only when the payment is confirmed; if it never is, the order fails, the stock is released and the cart is still there to try again.

        Send the same `Idempotency-Key` when retrying a request whose response was lost: the first order is returned (200) and nothing is placed twice. Disable the button while a request is in flight.
      summary: Place an order from the cart
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{8,64}$
        description: 'One key per attempt (a UUID v4 is recommended), 8-64 letters,
          digits, `-` or `_`. Send the **same** key again when retrying after a timeout
          or a lost response: the original result is returned and nothing is done
          twice. Only a successful result is remembered, so a failed attempt may be
          retried with the same key. The same key with a different body is a 400.
          Missing or malformed: 400 `VALIDATION_ERROR` with `details: {"Idempotency-Key":
          [...]}`.'
        required: true
      - in: header
        name: X-Store-Id
        schema:
          type: integer
        description: 'The store id from `GET /serviceability/` (`store.id`) for the
          selected location. Missing or not a positive integer: 400 `VALIDATION_ERROR`
          with `details: {"X-Store-Id": [...]}`. Unknown or deactivated store: 404
          `STORE_NOT_FOUND`; drop the saved store and check serviceability again.
          A closed store is still browsable.'
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
            examples:
              PayOnline:
                value:
                  address_id: 12
                  payment_method: ONLINE
                  expected_grand_total: '753.00'
                summary: Pay online
              CashOnDelivery:
                value:
                  address_id: 12
                  payment_method: COD
                  expected_grand_total: '753.00'
                summary: Cash on delivery
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPlacement'
              examples:
                Online:OpenCheckout:
                  value:
                    order:
                      id: 5012
                      order_number: JV-261103-000123
                      status: PAYMENT_PENDING
                      payment_method: ONLINE
                      payment_status: PENDING
                      store:
                        id: 1
