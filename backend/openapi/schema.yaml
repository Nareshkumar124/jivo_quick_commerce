    PatchedAddressRequest:
      type: object
      properties:
        label:
          $ref: '#/components/schemas/AddressLabelEnum'
        custom_label:
          type: string
          description: Shown instead of the label when set, e.g. "Mom's place".
          maxLength: 40
        receiver_name:
          type: string
          description: Defaults to the user's name. Send an empty string to reset
            it to the user's own (copied when saved). Omit it to keep the current
            value; null is rejected.
          maxLength: 120
        receiver_phone:
          description: Defaults to the user's phone. Send an empty string to reset
            it to the user's own (copied when saved). Omit it to keep the current
            value; null is rejected.
          oneOf:
          - type: string
            pattern: ^\+91[6-9][0-9]{9}$
          - type: string
            maxLength: 0
        house:
          type: string
          minLength: 1
          description: House / flat / floor.
          maxLength: 120
        building_street:
          type: string
          minLength: 1
          description: Building and street.
          maxLength: 200
        landmark:
          type: string
          maxLength: 120
        area:
          type: string
          maxLength: 120
        city:
          type: string
          minLength: 1
          maxLength: 80
        state:
          type: string
          minLength: 1
          maxLength: 80
        pincode:
          type: string
          minLength: 1
          pattern: ^[1-9][0-9]{5}$
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
          description: Map pin latitude (WGS84). Required. Stored to 6 decimal places.
        lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
          description: Map pin longitude (WGS84). Required. Stored to 6 decimal places.
    PatchedCartUpdateRequest:
      type: object
      description: 'Partial update: send only the fields that change.'
      properties:
        tip:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Rider tip, e.g. "20.00"; "0.00" removes it. At most the server's
            tip limit (`CART_MAX_TIP`, ₹500 by default).
        instructions:
          allOf:
          - $ref: '#/components/schemas/DeliveryInstructionsRequest'
          description: Replaces the instructions (chips and note) as a whole.
        address_id:
          type: integer
          minimum: 1
          description: One of the caller's saved addresses. It must be inside the
            service area of the store in `X-Store-Id`, else 422 `NOT_SERVICEABLE`
            and nothing is saved.
    PatchedMeRequest:
      type: object
      description: The signed-in user. PATCH accepts `name`, `email` and `marketing_opt_in`.
      properties:
        name:
          type: string
          minLength: 1
          description: Required to complete the profile. Cannot be blanked.
          maxLength: 120
        email:
          type: string
          format: email
          nullable: true
          description: Optional. Send null (or an empty string) to remove it. Must
            be unique.
        marketing_opt_in:
          type: boolean
          description: Consent to promotional push notifications.
    PatchedRiderProfileUpdateRequest:
      type: object
      description: |-
        PATCH: every field optional. Which fields may change depends on the status (see the
        operation's description).
      properties:
        full_name:
          type: string
          minLength: 1
          description: Legal name, as on the documents.
          maxLength: 120
        dob:
          type: string
          format: date
          description: Date of birth. The rider must be 18 or older (IST).
        emergency_contact_name:
          type: string
          minLength: 1
          maxLength: 120
        emergency_contact_phone:
          type: string
          minLength: 1
          description: Indian mobile number (E.164, +91...), not the rider's own number.
          pattern: ^\+91[6-9][0-9]{9}$
          maxLength: 15
        preferred_store_id:
          type: integer
          description: From `GET /rider/stores/`.
        vehicle_type:
          $ref: '#/components/schemas/VehicleTypeEnum'
        vehicle_number:
          type: string
          nullable: true
          description: Required for MOTORBIKE and SCOOTER (e.g. HR26DQ1234; spaces
            and hyphens are ignored); must be empty or null for BICYCLE and E_BIKE.
          maxLength: 20
    PaymentMethodEnum:
      enum:
      - ONLINE
      - COD
      type: string
      description: |-
        * `ONLINE` - Pay online
        * `COD` - Cash on delivery
    PaymentOption:
      type: object
      properties:
        method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        is_available:
          type: boolean
          description: 'Show the method only when true (03 §2.9: COD is shown only
            if eligible).'
        unavailable_reason:
          allOf:
          - $ref: '#/components/schemas/PaymentUnavailableReasonEnum'
          nullable: true
        message:
          type: string
          nullable: true
          description: Display text when not available; null when available.
      required:
      - is_available
      - message
      - method
      - unavailable_reason
    PaymentStatusEnum:
      enum:
      - PENDING
      - PAID
      - FAILED
      - REFUND_PENDING
      - REFUNDED
      - PARTIALLY_REFUNDED
      - COD_PENDING
      - COD_COLLECTED
      type: string
      description: |-
        * `PENDING` - Awaiting payment
        * `PAID` - Paid
        * `FAILED` - Not paid
        * `REFUND_PENDING` - Refund in progress
        * `REFUNDED` - Refunded
        * `PARTIALLY_REFUNDED` - Partially refunded
        * `COD_PENDING` - Pay on delivery
        * `COD_COLLECTED` - Paid on delivery
    PaymentUnavailableReasonEnum:
      enum:
      - COD_DISABLED
      - ABOVE_LIMIT
      - NOT_ALLOWED
      type: string
      description: |-
        * `COD_DISABLED` - The store does not offer cash on delivery.
        * `ABOVE_LIMIT` - The order is above the cash-on-delivery limit.
        * `NOT_ALLOWED` - Cash on delivery is not available for this account.
    PaymentVerifyRequest:
      type: object
      properties:
        order_id:
          type: integer
          minimum: 1
          description: Our order id (`Order.id`).
        razorpay_order_id:
          type: string
          minLength: 1
          description: From the checkout success callback.
          pattern: ^order_[A-Za-z0-9]{10,40}$
        razorpay_payment_id:
          type: string
          minLength: 1
          description: From the checkout success callback.
          pattern: ^pay_[A-Za-z0-9]{10,40}$
        razorpay_signature:
          type: string
          minLength: 1
          description: From the checkout success callback (64 hex characters).
          pattern: ^[0-9a-f]{64}$
      required:
      - order_id
      - razorpay_order_id
      - razorpay_payment_id
      - razorpay_signature
    Payout:
      type: object
      properties:
        id:
          type: integer
        period_start:
          type: string
          format: date
          description: IST calendar date, YYYY-MM-DD.
        period_end:
          type: string
          format: date
          description: IST calendar date, YYYY-MM-DD. Inclusive.
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Paid or to be paid.
        status:
          $ref: '#/components/schemas/PayoutStatusEnum'
        reference:
          type: string
          nullable: true
          description: Bank transfer reference (UTR).
        paid_at:
          type: string
          format: date-time
          nullable: true
          description: UTC instant; null if PENDING.
      required:
      - amount
      - id
      - paid_at
      - period_end
      - period_start
      - reference
      - status
    PayoutStatusEnum:
      enum:
      - PENDING
      - PAID
      type: string
      description: |-
        * `PENDING` - Pending
        * `PAID` - Paid
    PickupRequest:
      type: object
      properties:
        order_code:
          type: string
          minLength: 1
          description: The 4-character order code typed by the rider, or the whole
            bag QR payload `JQC1:<order_number>:<code>` as scanned. Case-insensitive.
          maxLength: 64
      required:
      - order_code
    PlatformEnum:
      enum:
      - android
      - ios
      type: string
      description: |-
        * `android` - Android
        * `ios` - iOS
    PolicyUrls:
      type: object
      properties:
        terms:
          type: string
          format: uri
        privacy:
          type: string
          format: uri
        refund:
          type: string
          format: uri
      required:
      - privacy
      - refund
      - terms
    PositionRequest:
      type: object
      properties:
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
          description: Latitude (WGS84), decimal degrees.
        lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
          description: Longitude (WGS84), decimal degrees.
        accuracy:
          type: number
          format: double
          minimum: 0
          nullable: true
          description: Metres; widens the geofence by at most 50 m.
      required:
      - lat
      - lng
    ProductCard:
      type: object
      description: 'A product tile (03 §2.5): used by home rails, lists, search, collections,
        similar items.'
      properties:
        id:
          type: integer
        slug:
          type: string
          description: 'For product links: `GET /products/{slug}/`.'
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          description: e.g. "Jivo Cold Pressed Canola Oil".
        brand:
          type: string
          description: '"Jivo" for every product in v1.'
        is_veg:
          type: boolean
          description: FSSAI veg mark (green dot) when true.
        image:
          allOf:
          - $ref: '#/components/schemas/ImageSet'
          nullable: true
          description: Image of the default variant (see `default_variant_id`). Null
            when none.
        default_variant_id:
          type: integer
          description: 'The variant the tile shows and ADD adds: the one this list
            is about (e.g. the collection item or past purchase), else the first in-stock
            variant, else the first. Always one of `variants`.'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/VariantSummary'
          description: Every active variant this store sells, in display order (the
            chips on the detail page), including out-of-stock ones. With more than
            one, ADD opens a variant picker. Never empty.
      required:
      - brand
      - default_variant_id
      - id
      - image
      - is_veg
      - name
      - slug
      - variants
    ProductDetail:
      type: object
      description: |-
        Product detail (03 §2.6) with the mandatory label information (09 §4: FSSAI and Legal
        Metrology). Label text fields are "" when not applicable: hide the row.
      properties:
        id:
          type: integer
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
        brand:
          type: string
        is_veg:
          type: boolean
          description: FSSAI veg mark (green dot) when true.
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryTile'
          description: The product's category (breadcrumb, links).
        short_description:
          type: string
          description: One or two lines.
        description:
          type: string
          description: Plain text; paragraphs are separated by a blank line. No HTML
            or Markdown.
        highlights:
          type: array
          items:
            type: string
          description: Key highlights (bullet points).
        default_variant_id:
          type: integer
          description: Variant selected when the page opens (the one tapped, else
            first in stock).
        variants:
          type: array
          items:
            $ref: '#/components/schemas/VariantDetail'
          description: Every active variant this store sells, in chip order (1 L /
            2 L / 5 L), including out-of-stock ones. Never empty.
        ingredients:
          type: string
        nutrition:
          allOf:
          - $ref: '#/components/schemas/NutritionTable'
          nullable: true
          description: Null when the product has no nutrition table.
        shelf_life:
          type: string
          description: Best-before guidance, e.g. "9 months from manufacture".
        storage_instructions:
          type: string
        country_of_origin:
          type: string
        manufacturer:
          type: string
          description: Name and address of the manufacturer or packer.
        marketer:
          type: string
          description: Name and address of the marketer, when different.
        importer:
          type: string
          description: Name and address of the importer, for imported products.
        consumer_care:
          type: string
          description: Consumer care details (phone, email, address).
        fssai_license_no:
          type: string
          description: FSSAI licence number printed on the label (14 digits).
        similar_products:
          type: array
          items:
            $ref: '#/components/schemas/ProductCard'
          description: Up to 10 products from the same category at this store, in
            stock first.
      required:
      - brand
      - category
      - consumer_care
      - country_of_origin
      - default_variant_id
      - description
      - fssai_license_no
      - highlights
      - id
      - importer
      - ingredients
      - is_veg
      - manufacturer
      - marketer
      - name
      - nutrition
      - shelf_life
      - short_description
      - similar_products
      - slug
      - storage_instructions
      - variants
    RazorpayCheckout:
      type: object
      description: |-
        Options for Razorpay checkout (`razorpay_flutter` `open()`), all set by the server: pass
        them through unchanged. The amount is the order's `grand_total` in paise.
      properties:
        key_id:
          type: string
          description: 'Razorpay key id (`key`). Local development only: `rzp_fake_jivo_local`
            means the server uses the fake gateway; complete the payment with the
            dev-only scheme in 06 §2.6 instead of opening Razorpay.'
        order_id:
          type: string
          description: Razorpay order id (`order_id`), "order_...".
        amount:
          type: integer
          minimum: 100
          description: '`grand_total` in paise (`amount`), e.g. 75300 for ₹753.00.
            Display the order''s `bill.grand_total` instead.'
        currency:
          type: string
          description: Always "INR".
        name:
          type: string
          description: Merchant name shown in checkout (`name`), "Jivo".
        description:
          type: string
          description: '`description`, e.g. the order number.'
        prefill:
          $ref: '#/components/schemas/RazorpayPrefill'
        expires_at:
          type: string
          format: date-time
          description: Same as the order's `payment_expires_at`.
        timeout_seconds:
          type: integer
          minimum: 1
          description: Seconds left in the payment window (`timeout`), so checkout
            closes in time.
      required:
      - amount
      - currency
      - description
      - expires_at
      - key_id
      - name
      - order_id
      - prefill
      - timeout_seconds
    RazorpayPrefill:
      type: object
      properties:
        name:
          type: string
        contact:
          type: string
          description: The customer's phone, E.164.
        email:
          type: string
          description: '"" when the customer has none.'
      required:
      - contact
      - email
      - name
    RazorpayWebhookEventRequest:
      type: object
      description: |-
        A Razorpay webhook event (only the fields the server reads are listed; others are
        ignored). Sent by Razorpay, never by the apps.
      properties:
        entity:
          type: string
          minLength: 1
          description: '"event".'
        account_id:
          type: string
          minLength: 1
        event:
          type: string
          minLength: 1
          description: 'Handled: `payment.captured`, `payment.failed`, `refund.processed`,
            `refund.failed`. Others are acknowledged and ignored.'
        contains:
          type: array
          items:
            type: string
            minLength: 1
        payload:
          type: object
          additionalProperties: {}
          description: The entities, e.g. `payment.entity`.
        created_at:
          type: integer
          description: Unix time.
      required:
      - event
      - payload
    RecentTask:
      type: object
      properties:
        id:
          type: integer
        order_number:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/DeliveryTaskStatusEnum'
          description: |-
            DELIVERED, RETURNED or CANCELLED.

            * `SEARCHING` - Looking for a rider
            * `OFFERED` - Offered to a rider
            * `ASSIGNED` - Rider heading to the store
            * `AT_STORE` - Rider at the store
            * `PICKED_UP` - Picked up
            * `AT_CUSTOMER` - Rider at the drop location
            * `DELIVERED` - Delivered
            * `FAILED` - Delivery failed
            * `RETURNING` - Returning items to the store
            * `RETURNED` - Items returned to the store
            * `UNASSIGNED` - No rider found: ops to assign
            * `CANCELLED` - Cancelled
        ended_at:
          type: string
          format: date-time
      required:
      - ended_at
      - id
      - order_number
      - status
    ReorderIssue:
      type: object
      properties:
        variant_id:
          type: integer
        product_name:
          type: string
        variant_name:
          type: string
        requested_quantity:
          type: integer
          minimum: 1
          description: Units in the past order (those that were delivered or coming).
        added_quantity:
          type: integer
          minimum: 0
          description: Units now in the cart for this variant (0 = not added).
        reason:
          $ref: '#/components/schemas/ReorderIssueReasonEnum'
      required:
      - added_quantity
      - product_name
      - reason
      - requested_quantity
      - variant_id
      - variant_name
    ReorderIssueReasonEnum:
      enum:
      - OUT_OF_STOCK
      - LIMITED_STOCK
      - NOT_AVAILABLE
      type: string
      description: |-
        * `OUT_OF_STOCK` - Out of stock
        * `LIMITED_STOCK` - Only part of the quantity is available
        * `NOT_AVAILABLE` - No longer sold at this store
    ReorderResult:
      type: object
      properties:
        cart:
          allOf:
          - $ref: '#/components/schemas/Cart'
          description: The whole cart after the items were added.
        added_count:
          type: integer
          minimum: 0
          description: 'How many of the order''s lines now have at least one unit
            in the cart (e.g. for "3 items added"). 0: nothing could be added.'
        unavailable:
          type: array
          items:
            $ref: '#/components/schemas/ReorderIssue'
          description: Lines that could not be added in full; [] when everything was
            added.
      required:
      - added_count
      - cart
      - unavailable
    RiderBankAccount:
      type: object
      description: Bank details for payouts, masked (09 §3). The full account number
        is never sent back.
      properties:
        holder_name:
          type: string
        account_number_masked:
          type: string
          description: '"XXXXXX6789".'
        ifsc:
          type: string
        upi_id:
          type: string
          nullable: true
        updated_at:
          type: string
          format: date-time
      required:
      - account_number_masked
      - holder_name
      - ifsc
      - updated_at
      - upi_id
    RiderBankAccountUpdateRequest:
      type: object
      properties:
        holder_name:
          type: string
          minLength: 1
          description: As on the bank account.
          maxLength: 120
        account_number:
          type: string
          minLength: 1
          description: 9 to 18 digits. Stored encrypted; only the last 4 are shown.
          maxLength: 24
        ifsc:
          type: string
          minLength: 1
          description: e.g. HDFC0001234.
          maxLength: 16
        upi_id:
          type: string
          nullable: true
          description: Optional, e.g. name@okhdfcbank. Send null or "" to remove.
          maxLength: 256
      required:
      - account_number
      - holder_name
      - ifsc
    RiderCash:
      type: object
      description: |-
        Cash in hand (04 §2.7). `limit_reached` is the server's verdict: show the "Deposit cash"
        banner on it, never compare the amounts on the phone.
      properties:
        cash_in_hand:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: COD cash collected and not yet deposited.
        cash_limit:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: The rider's limit (default ₹5,000).
        limit_reached:
          type: boolean
          description: 'True at or above the limit: only prepaid offers are sent (08
            §5).'
      required:
      - cash_in_hand
      - cash_limit
      - limit_reached
    RiderDocument:
      type: object
      description: One KYC document as the rider sees it. The file itself is never
        sent back.
      properties:
        doc_type:
          $ref: '#/components/schemas/RiderDocumentTypeEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/RiderDocumentStatusEnum'
          description: |-
            PENDING (in review), APPROVED (locked), REJECTED (upload a new copy).

            * `PENDING` - In review
            * `APPROVED` - Approved
            * `REJECTED` - Rejected: upload a new copy
        doc_number_masked:
          type: string
          nullable: true
          description: Masked number ("XXXX XXXX 1234" for Aadhaar, "ABXXXXXX4F" for
            PAN, the last 4 characters for DL/RC); null for the photo and the Aadhaar
            back.
        review_note:
          type: string
          description: Why ops rejected it ("" otherwise). Show it with REJECTED.
        uploaded_at:
          type: string
          format: date-time
        reviewed_at:
          type: string
          format: date-time
          nullable: true
      required:
      - doc_number_masked
      - doc_type
      - review_note
      - reviewed_at
      - status
      - uploaded_at
    RiderDocumentStatusEnum:
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      type: string
      description: |-
        * `PENDING` - In review
        * `APPROVED` - Approved
        * `REJECTED` - Rejected: upload a new copy
    RiderDocumentTypeEnum:
      enum:
      - PHOTO
      - AADHAAR_FRONT
      - AADHAAR_BACK
      - PAN
      - DL
      - RC
      type: string
      description: |-
        * `PHOTO` - Photo (selfie)
        * `AADHAAR_FRONT` - Aadhaar (front)
        * `AADHAAR_BACK` - Aadhaar (back)
        * `PAN` - PAN card
        * `DL` - Driving licence
        * `RC` - Vehicle RC
    RiderDocumentUploadRequest:
      type: object
      description: '`multipart/form-data`: `doc_type`, `file` and, for numbered documents,
        `number`.'
      properties:
        doc_type:
          $ref: '#/components/schemas/RiderDocumentTypeEnum'
        file:
          type: string
          format: binary
          description: JPEG or PNG, at most 1 MB (1,048,576 bytes). Re-encoded on
            the server as JPEG without metadata (EXIF, GPS).
        number:
          type: string
          description: Required for AADHAAR_FRONT (12 digits, Verhoeff check), PAN
            (ABCDE1234F), DL and RC (the vehicle number); must be absent for PHOTO
            and AADHAAR_BACK. Spaces and hyphens are ignored. Only the masked number
            is ever returned; Aadhaar is never stored in full.
          maxLength: 32
      required:
      - doc_type
      - file
    RiderHomeStore:
      type: object
      description: 'The home store with its position (go-online radius, navigation;
        api-requests #40).'
      properties:
        id:
          type: integer
        name:
          type: string
          description: e.g. "Jivo Sector 14".
        city:
          type: string
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
          description: Store entrance latitude.
        lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
          description: Store entrance longitude.
      required:
      - city
      - id
      - lat
      - lng
      - name
    RiderLocationSettings:
      type: object
      description: |-
        Rider location tracking periods (04 §3, api-requests #2). Also returned by
        `rider_shift_start`, `rider_locations_create` and `rider_heartbeat`, so a change in the
        panel reaches riders already online; use the latest one received.
      properties:
        active_interval_seconds:
          type: integer
          description: Upload a batch this often while on a task (default 10 s, 04
            §3).
        idle_interval_seconds:
          type: integer
          description: Upload a batch this often while online and idle (default 30
            s).
        active_sample_seconds:
          type: integer
          description: Take a GPS fix this often while on a task (default 5 s; <=
            the upload interval).
        idle_sample_seconds:
          type: integer
          description: Take a GPS fix this often while idle (default 30 s; <= the
            upload interval).
        max_batch:
          type: integer
          description: Most points per `POST /rider/locations/` (default 50). Buffered
            points beyond it go in the next request, oldest first.
      required:
      - active_interval_seconds
      - active_sample_seconds
      - idle_interval_seconds
      - idle_sample_seconds
      - max_batch
    RiderOffer:
      type: object
      description: |-
        An order offered to the rider (04 §2.4). The full address and phone appear only in the
        task, after accepting.
      properties:
        id:
          type: integer
        task_id:
          type: integer
        store_name:
          type: string
        drop_locality:
          type: string
          description: Area only, e.g. "Sector 21, Gurugram".
        distance_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          description: Store to drop (road estimate), e.g. "2.40".
        payment_type:
          $ref: '#/components/schemas/RiderPaymentTypeEnum'
        cod_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: Cash to collect for COD; null for prepaid.
        estimated_payout:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: What the rider earns for this order (before tips).
        item_count:
          type: integer
        offered_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Accept before this (offered_at + 30 s). Correct with `server_time`.
      required:
      - cod_amount
      - distance_km
      - drop_locality
      - estimated_payout
      - expires_at
      - id
      - item_count
      - offered_at
      - payment_type
      - store_name
      - task_id
    RiderPaymentTypeEnum:
      enum:
      - PREPAID
      - COD
      type: string
      description: |-
        * `PREPAID` - Prepaid
        * `COD` - Cash on delivery
    RiderProfile:
      type: object
      description: '`GET /rider/me/`: everything the onboarding, status, home and
        profile screens need.'
      properties:
        id:
          type: integer
        phone:
          type: string
          description: Login phone (E.164).
        status:
          allOf:
          - $ref: '#/components/schemas/RiderStatusEnum'
          description: |-
            PENDING_KYC, ACTIVE, REJECTED or SUSPENDED (never NONE here). Same value as `rider_status` of `GET /me/`.

            * `NONE` - No rider profile: show registration
            * `PENDING_KYC` - Registered, waiting for KYC approval
            * `ACTIVE` - Approved: can go online
            * `REJECTED` - KYC rejected: see the reason, re-submit
            * `SUSPENDED` - Suspended by ops
        rejection_reason:
          type: string
          description: Shown on the status screen when REJECTED ("" otherwise).
        suspension_reason:
          type: string
          description: Shown when SUSPENDED ("" otherwise).
        full_name:
          type: string
        dob:
          type: string
          format: date
          description: Date of birth.
        emergency_contact_name:
          type: string
        emergency_contact_phone:
          type: string
          description: E.164.
        vehicle_type:
          $ref: '#/components/schemas/VehicleTypeEnum'
        vehicle_number:
          type: string
          nullable: true
          description: e.g. "HR26DQ1234"; null for a bicycle or e-bike.
        preferred_store:
          allOf:
          - $ref: '#/components/schemas/RiderStore'
          description: The store chosen at registration.
        home_store:
          allOf:
          - $ref: '#/components/schemas/RiderHomeStore'
          nullable: true
          description: Set by ops on approval; offers come only from this store. Null
            before.
        photo_url:
          type: string
          format: uri
          nullable: true
          description: Signed link to the rider's photo (the PHOTO document), valid
            until `photo_url_expires_at` (1 hour). Null without a photo. Do not cache
            past expiry.
        photo_url_expires_at:
          type: string
          format: date-time
          nullable: true
        rating_avg:
          type: string
          nullable: true
          description: Average customer rating, one decimal ("4.8"); null until rated
            (Phase 7).
        documents:
          type: array
          items:
            $ref: '#/components/schemas/RiderDocument'
          description: Uploaded documents, any status.
        required_documents:
          type: array
          items:
            $ref: '#/components/schemas/RiderDocumentTypeEnum'
          description: 'Documents this rider needs (D-14 default): PHOTO, AADHAAR_FRONT,
            AADHAAR_BACK, PAN; plus DL and RC for MOTORBIKE/SCOOTER. Follows `vehicle_type`.'
        missing_documents:
          type: array
          items:
            $ref: '#/components/schemas/RiderDocumentTypeEnum'
          description: 'Required documents not uploaded yet or REJECTED: the rider
            must upload these.'
        bank_account:
          allOf:
          - $ref: '#/components/schemas/RiderBankAccount'
          nullable: true
        ready_for_review:
          type: boolean
          description: 'True when nothing required is missing (documents and bank
            details): the application waits for ops. Show "Documents under review".'
        is_online:
          type: boolean
        cash:
          $ref: '#/components/schemas/RiderCash'
        today:
          $ref: '#/components/schemas/RiderToday'
        created_at:
          type: string
          format: date-time
      required:
      - bank_account
      - cash
      - created_at
      - dob
      - documents
      - emergency_contact_name
      - emergency_contact_phone
      - full_name
      - home_store
      - id
      - is_online
      - missing_documents
      - phone
      - photo_url
      - photo_url_expires_at
      - preferred_store
      - rating_avg
      - ready_for_review
      - rejection_reason
      - required_documents
      - status
      - suspension_reason
      - today
      - vehicle_number
      - vehicle_type
    RiderRegisterRequest:
      type: object
      description: Shared validation of the editable profile fields (register and
        PATCH).
      properties:
        full_name:
          type: string
          minLength: 1
          description: Legal name, as on the documents.
          maxLength: 120
        dob:
          type: string
          format: date
          description: Date of birth. The rider must be 18 or older (IST).
        emergency_contact_name:
          type: string
          minLength: 1
          maxLength: 120
        emergency_contact_phone:
          type: string
          minLength: 1
          description: Indian mobile number (E.164, +91...), not the rider's own number.
          pattern: ^\+91[6-9][0-9]{9}$
          maxLength: 15
        preferred_store_id:
          type: integer
          description: From `GET /rider/stores/`.
        vehicle_type:
          $ref: '#/components/schemas/VehicleTypeEnum'
        vehicle_number:
          type: string
          nullable: true
          description: Required for MOTORBIKE and SCOOTER (e.g. HR26DQ1234; spaces
            and hyphens are ignored); must be empty or null for BICYCLE and E_BIKE.
          maxLength: 20
      required:
      - dob
      - emergency_contact_name
      - emergency_contact_phone
      - full_name
      - preferred_store_id
      - vehicle_type
    RiderShift:
      type: object
      properties:
        id:
          type: integer
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        end_reason:
          allOf:
          - $ref: '#/components/schemas/ShiftEndReasonEnum'
          nullable: true
          description: |-
            MANUAL, AUTO_OFFLINE (no location for 10 min) or ADMIN; null while open.

            * `MANUAL` - Rider went offline
            * `AUTO_OFFLINE` - No location for too long
            * `ADMIN` - Set offline by ops
        ended_by:
          allOf:
          - $ref: '#/components/schemas/ShiftEndedByEnum'
          nullable: true
          description: |-
            rider, system or ops; null while open.

            * `rider` - The rider
            * `system` - The server (no location)
            * `ops` - Ops
      required:
      - end_reason
      - ended_at
      - ended_by
      - id
      - started_at
    RiderStatusEnum:
      enum:
      - NONE
      - PENDING_KYC
      - ACTIVE
      - REJECTED
      - SUSPENDED
      type: string
      description: |-
        * `NONE` - No rider profile: show registration
        * `PENDING_KYC` - Registered, waiting for KYC approval
        * `ACTIVE` - Approved: can go online
        * `REJECTED` - KYC rejected: see the reason, re-submit
        * `SUSPENDED` - Suspended by ops
    RiderStore:
      type: object
      description: A dark store as the rider app lists it (registration dropdown,
        profile).
      properties:
        id:
          type: integer
        name:
          type: string
          description: e.g. "Jivo Sector 14".
        city:
          type: string
      required:
      - city
      - id
      - name
    RiderTask:
      type: object
      description: 'The rider''s delivery task with everything the task screens need
        (api-requests #13).'
      properties:
        id:
          type: integer
        status:
          $ref: '#/components/schemas/DeliveryTaskStatusEnum'
        order_id:
          type: integer
        order_number:
          type: string
        order_status:
          allOf:
          - $ref: '#/components/schemas/OrderStatusEnum'
          description: |-
            ACCEPTED/PACKING: show "Packing…"; PACKED: "Ready for pickup".

            * `PAYMENT_PENDING` - Completing payment…
            * `PLACED` - Order placed
            * `ACCEPTED` - Order confirmed
            * `PACKING` - Packing your order
            * `PACKED` - Packed, rider on the way to store
            * `OUT_FOR_DELIVERY` - On the way
            * `DELIVERED` - Delivered
            * `CANCELLED` - Cancelled
            * `PAYMENT_FAILED` - Payment failed
            * `DELIVERY_FAILED` - Delivery unsuccessful
            * `RETURNED` - Delivery unsuccessful
        ready_for_pickup:
          type: boolean
          description: True once the order is PACKED.
        payment_type:
          $ref: '#/components/schemas/RiderPaymentTypeEnum'
        cod_amount_due:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: 'COD: exactly what to collect (it can drop if the store removed
            items); null if prepaid.'
        cod_amount_previous:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: 'COD: the amount before the last change since the offer (store
            removed items, 08 T8a), for "Collect ₹X (was ₹Y)"; null when unchanged
            or prepaid. The rider also gets a push when it changes.'
        store:
          $ref: '#/components/schemas/TaskStore'
        customer_address:
          allOf:
          - $ref: '#/components/schemas/OrderAddress'
          description: The drop address (receiver name and phone included), revealed
            on accept.
        instructions:
          $ref: '#/components/schemas/DeliveryInstructions'
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskItem'
        item_count:
          type: integer
          description: Units in the bag.
        distance_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          description: Store to drop (road estimate).
        estimated_payout:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Base + distance pay for this order (tips come on delivery).
        geofence:
          $ref: '#/components/schemas/TaskGeofence'
        delivery_otp:
          $ref: '#/components/schemas/DeliveryOtpState'
        cod_qr:
          allOf:
          - $ref: '#/components/schemas/CodQr'
          nullable: true
          description: The UPI QR, once generated.
        assigned_at:
          type: string
          format: date-time
        arrived_store_at:
          type: string
          format: date-time
          nullable: true
        picked_up_at:
          type: string
          format: date-time
          nullable: true
        arrived_customer_at:
          type: string
          format: date-time
          nullable: true
        not_reachable_after:
          type: string
          format: date-time
          nullable: true
          description: '`arrived_customer_at` + 10 minutes: from then on CUSTOMER_NOT_REACHABLE
            is accepted. Null before arriving.'
        delivered_at:
          type: string
          format: date-time
          nullable: true
        failed_at:
          type: string
          format: date-time
          nullable: true
        fail_reason:
          allOf:
          - $ref: '#/components/schemas/DeliveryFailReasonEnum'
          nullable: true
        returned_at:
          type: string
          format: date-time
          nullable: true
        earnings:
          allOf:
          - $ref: '#/components/schemas/TaskEarnings'
          nullable: true
          description: Set once DELIVERED (base, distance, tip...).
      required:
      - arrived_customer_at
      - arrived_store_at
      - assigned_at
      - cod_amount_due
      - cod_amount_previous
      - cod_qr
      - customer_address
      - delivered_at
      - delivery_otp
      - distance_km
      - earnings
      - estimated_payout
      - fail_reason
      - failed_at
      - geofence
      - id
      - instructions
      - item_count
      - items
      - not_reachable_after
      - order_id
      - order_number
      - order_status
      - payment_type
      - picked_up_at
      - ready_for_pickup
      - returned_at
      - status
      - store
    RiderToday:
      type: object
      description: 'Home "Today" card (04 §2.3): the IST day so far, computed by the
        server.'
      properties:
        date:
          type: string
          format: date
          description: IST calendar date, YYYY-MM-DD.
        orders_delivered:
          type: integer
        earnings:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Everything earned today (orders, tips, adjustments).
        cash_in_hand:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Same as `cash.cash_in_hand`.
        online_seconds:
          type: integer
          description: Time online today, the current shift included up to now.
      required:
      - cash_in_hand
      - date
      - earnings
      - online_seconds
      - orders_delivered
    SearchSuggestion:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/SearchSuggestionTypeEnum'
        text:
          type: string
          description: What to show in the suggestion row.
        query:
          type: string
          description: The search term to run (and save in recent searches) when tapped.
        id:
          type: integer
          nullable: true
          description: Product or category id; null for keywords.
        slug:
          type: string
          nullable: true
          description: Product or category slug to open; null for keywords.
          pattern: ^[-a-zA-Z0-9_]+$
        image:
          allOf:
          - $ref: '#/components/schemas/ImageSet'
          nullable: true
          description: Product or category image, if any.
      required:
      - id
      - image
      - query
      - slug
      - text
      - type
    SearchSuggestionTypeEnum:
      enum:
      - product
      - category
      - keyword
      type: string
      description: |-
        * `product` - A product: open its detail page (slug)
        * `category` - A category: open its product list (slug)
        * `keyword` - A search term (typed match or trending): run the search with `query`
    SearchSuggestions:
      type: object
      properties:
        query:
          type: string
          description: The `q` these are for (match it to the latest keystroke).
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/SearchSuggestion'
          description: 'Up to 10, best first. For a blank `q`: the trending searches
            (`keyword`), possibly empty.'
      required:
      - query
      - suggestions
    Serviceability:
      type: object
      properties:
        serviceable:
          type: boolean
          description: 'True when the point is inside an active store''s service area
            (whether or not the store is open). False: show ''We''re not in your area
            yet'' with Notify me.'
        store:
          allOf:
          - $ref: '#/components/schemas/StoreStatus'
          nullable: true
          description: The store that serves this point (the nearest open one when
            service areas overlap). Null when not serviceable.
        eta_minutes:
          type: integer
          minimum: 1
          nullable: true
          description: Estimated delivery time in minutes for the home header ('Delivery
            in 14 mins'), 08 §8. Null when not serviceable or when the store is closed.
        message:
          type: string
          nullable: true
          description: Text to show when the location is not serviceable or the store
            is closed (times in IST). Null when serviceable and open.
      required:
      - eta_minutes
      - message
      - serviceable
      - store
    ShiftEndReasonEnum:
      enum:
      - MANUAL
      - AUTO_OFFLINE
      - ADMIN
      type: string
      description: |-
        * `MANUAL` - Rider went offline
        * `AUTO_OFFLINE` - No location for too long
        * `ADMIN` - Set offline by ops
    ShiftEndedByEnum:
      enum:
      - rider
      - system
      - ops
      type: string
      description: |-
        * `rider` - The rider
        * `system` - The server (no location)
        * `ops` - Ops
    ShiftStartRequest:
      type: object
      properties:
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
          description: Current position (precise location).
        lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
          description: Longitude (WGS84), decimal degrees.
        accuracy:
          type: number
          format: double
          minimum: 0
          description: Reported accuracy in metres (optional).
      required:
      - lat
      - lng
    ShiftState:
      type: object
      description: The rider's shift after `shift/start` or `shift/end`.
      properties:
        is_online:
          type: boolean
        shift:
          allOf:
          - $ref: '#/components/schemas/RiderShift'
          nullable: true
          description: The current shift (online), or the one just ended.
        prepaid_only:
          type: boolean
          description: 'True when cash in hand is at or above the limit: online, but
            only prepaid offers come (04 §2.3). Show the "Deposit cash" banner.'
        cash:
          $ref: '#/components/schemas/RiderCash'
        location:
          $ref: '#/components/schemas/RiderLocationSettings'
        server_time:
          type: string
          format: date-time
          description: Server clock, for skew correction.
      required:
      - cash
      - is_online
      - location
      - prepaid_only
      - server_time
      - shift
    StockStatusEnum:
      enum:
      - IN_STOCK
      - LOW_STOCK
      - OUT_OF_STOCK
      type: string
      description: |-
        * `IN_STOCK` - In stock
        * `LOW_STOCK` - In stock, only a few left: show 'Only {units_left} left'
        * `OUT_OF_STOCK` - Out of stock: grey the tile out, no ADD button
    StoreList:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/RiderStore'
      required:
      - results
    StoreStatus:
      type: object
      description: The dark store serving a location, and whether it takes orders
        right now.
      properties:
        id:
          type: integer
          description: Send it as the `X-Store-Id` header on every catalog (and, from
            P3, cart) call.
        name:
          type: string
          description: Display name, e.g. "Jivo Sector 14, Gurugram".
        is_open:
          type: boolean
          description: 'True when the store is inside its opening hours and accepting
            orders. When false, browsing still works but checkout is disabled: show
            the store-closed banner.'
        opens_at:
          type: string
          format: date-time
          nullable: true
          description: UTC time of the next opening (show it in IST, e.g. 'Opens at
            7:00 AM' or 'Opens tomorrow at 7:00 AM'). Null when the store is open,
            and null when it is temporarily not accepting orders with no known reopening
            time.
      required:
      - id
      - is_open
      - name
      - opens_at
    SupportContacts:
      type: object
      properties:
        phone:
          type: string
          description: Support phone, E.164.
        email:
          type: string
          format: email
      required:
      - email
      - phone
    TaskEarnings:
      type: object
      properties:
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Sum of the lines.
        lines:
          type: array
          items:
            $ref: '#/components/schemas/EarningLine'
      required:
      - lines
      - total
    TaskGeofence:
      type: object
      properties:
        store_radius_m:
          type: integer
          description: '`arrived-store` allowed within this.'
        customer_radius_m:
          type: integer
          description: '`arrived-customer` allowed within this (or with `override_reason`).'
      required:
      - customer_radius_m
      - store_radius_m
    TaskHistoryItem:
      type: object
      properties:
        task_id:
          type: integer
        order_number:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/DeliveryTaskStatusEnum'
          description: |-
            DELIVERED, RETURNED or CANCELLED.

            * `SEARCHING` - Looking for a rider
            * `OFFERED` - Offered to a rider
            * `ASSIGNED` - Rider heading to the store
            * `AT_STORE` - Rider at the store
            * `PICKED_UP` - Picked up
            * `AT_CUSTOMER` - Rider at the drop location
            * `DELIVERED` - Delivered
            * `FAILED` - Delivery failed
            * `RETURNING` - Returning items to the store
            * `RETURNED` - Items returned to the store
            * `UNASSIGNED` - No rider found: ops to assign
            * `CANCELLED` - Cancelled
        store_name:
          type: string
        drop_locality:
          type: string
        distance_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          nullable: true
          description: Null for a task cancelled before pickup.
        payout:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: Earned for this task (all lines); null if nothing was earned.
        completed_at:
          type: string
          format: date-time
          description: When it ended.
      required:
      - completed_at
      - distance_km
      - drop_locality
      - order_number
      - payout
      - status
      - store_name
      - task_id
    TaskItem:
      type: object
      properties:
        name:
          type: string
          description: Product name.
        variant:
          type: string
          description: e.g. "1 L".
        quantity:
          type: integer
          description: Units in the bag (after any unavailable).
      required:
      - name
      - quantity
      - variant
    TaskStore:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        phone:
          type: string
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
          description: Latitude (WGS84), decimal degrees.
        lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
          description: Longitude (WGS84), decimal degrees.
      required:
      - address
      - id
      - lat
      - lng
      - name
      - phone
    Ticket:
      type: object
      description: A ticket with its whole thread, oldest message first.
      properties:
        id:
          type: integer
        number:
          type: string
          description: Shown to the customer and support, e.g. "TK-000123".
        category:
          $ref: '#/components/schemas/TicketCategoryEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/TicketStatusEnum'
          description: |-
            The customer can reply unless CLOSED; a reply to RESOLVED reopens it (OPEN).

            * `OPEN` - Open
            * `IN_PROGRESS` - In progress
            * `RESOLVED` - Resolved
            * `CLOSED` - Closed
        order_id:
          type: integer
          nullable: true
        order_number:
          type: string
          nullable: true
        last_message:
          type: string
          nullable: true
          description: The newest message, cut to 140 characters (plain text).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: Last message or status change; the list is sorted by it, newest
            first.
        can_reply:
          type: boolean
          readOnly: true
          description: 'False once the ticket is CLOSED: hide the reply box and offer
            a new ticket.'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/TicketMessage'
      required:
      - can_reply
      - category
      - created_at
      - id
      - last_message
      - messages
      - number
      - order_id
      - order_number
      - status
      - updated_at
    TicketCategoryEnum:
      enum:
      - MISSING_ITEMS
      - DAMAGED_ITEMS
      - WRONG_ITEMS
      - LATE_DELIVERY
      - PAYMENT_REFUND
      - ACCOUNT
      - OTHER
      type: string
      description: |-
        * `MISSING_ITEMS` - Missing items
        * `DAMAGED_ITEMS` - Damaged items
        * `WRONG_ITEMS` - Wrong items
        * `LATE_DELIVERY` - Late delivery
        * `PAYMENT_REFUND` - Payment or refund
        * `ACCOUNT` - Account
        * `OTHER` - Other
    TicketCreateRequest:
      type: object
      properties:
        category:
          allOf:
          - $ref: '#/components/schemas/TicketCategoryEnum'
          description: |-
            MISSING_ITEMS, DAMAGED_ITEMS, WRONG_ITEMS and LATE_DELIVERY need `order_id`.

            * `MISSING_ITEMS` - Missing items
            * `DAMAGED_ITEMS` - Damaged items
            * `WRONG_ITEMS` - Wrong items
            * `LATE_DELIVERY` - Late delivery
            * `PAYMENT_REFUND` - Payment or refund
            * `ACCOUNT` - Account
            * `OTHER` - Other
        message:
          type: string
          minLength: 10
          description: Plain text, 10 to 1000 characters after trimming.
          maxLength: 1000
        order_id:
          type: integer
          minimum: 1
          nullable: true
          description: One of the caller's orders (another user's order is refused
            as not found).
      required:
      - category
      - message
    TicketMessage:
      type: object
      properties:
        id:
          type: integer
        body:
          type: string
          description: Plain text; show as text, never as HTML.
        from_support:
          type: boolean
          description: Sent by Jivo support, not the customer.
        created_at:
          type: string
          format: date-time
      required:
      - body
      - created_at
      - from_support
      - id
    TicketReplyRequest:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          description: Plain text, 1 to 1000 characters after trimming.
          maxLength: 1000
      required:
      - message
    TicketStatusEnum:
      enum:
      - OPEN
      - IN_PROGRESS
      - RESOLVED
      - CLOSED
      type: string
      description: |-
        * `OPEN` - Open
        * `IN_PROGRESS` - In progress
        * `RESOLVED` - Resolved
        * `CLOSED` - Closed
    TicketSummary:
      type: object
      description: One row of "My tickets".
      properties:
        id:
          type: integer
        number:
          type: string
          description: Shown to the customer and support, e.g. "TK-000123".
        category:
          $ref: '#/components/schemas/TicketCategoryEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/TicketStatusEnum'
          description: |-
            The customer can reply unless CLOSED; a reply to RESOLVED reopens it (OPEN).

            * `OPEN` - Open
            * `IN_PROGRESS` - In progress
            * `RESOLVED` - Resolved
            * `CLOSED` - Closed
        order_id:
          type: integer
          nullable: true
        order_number:
          type: string
          nullable: true
        last_message:
          type: string
          nullable: true
          description: The newest message, cut to 140 characters (plain text).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: Last message or status change; the list is sorted by it, newest
            first.
      required:
      - category
      - created_at
      - id
      - last_message
      - number
      - order_id
      - order_number
      - status
      - updated_at
    TokenPair:
      type: object
      properties:
        access:
          type: string
          description: New access token (15 minutes).
        refresh:
          type: string
          description: New refresh token (30 days). Replace the stored one; the old
            one is revoked.
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
          description: The current refresh token. It is single use.
      required:
      - refresh
    TrackPoint:
      type: object
      properties:
        lat:
          type: number
          format: double
          description: Latitude (WGS84).
        lng:
          type: number
          format: double
          description: Longitude (WGS84).
      required:
      - lat
      - lng
    TrackRider:
      type: object
      description: The assigned rider, shown from assignment until the order ends
        (08 §9).
      properties:
        name:
          type: string
          description: The rider's first name and last initial.
        phone:
          type: string
          nullable: true
          description: E.164. Only while the order is OUT_FOR_DELIVERY (and only to
            the order's owner); null otherwise. Masked/proxy calling is planned.
        photo:
          type: string
          format: uri
          nullable: true
          description: Signed https link to the rider's photo, valid about an hour
            (re-read `track/` for a fresh one); null without a photo.
        lat:
          type: number
          format: double
          nullable: true
          description: Last known position; null if none.
        lng:
          type: number
          format: double
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: When that position was recorded.
      required:
      - lat
      - lng
      - name
      - phone
      - photo
      - updated_at
    TrackStore:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
      required:
      - id
      - lat
      - lng
      - name
    UnitPrice:
      type: object
      description: Unit sale price for comparison (Legal Metrology), e.g. ₹27.90 per
        100 ml.
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Selling price per `per`.
        per:
          type: string
          description: The unit quantity, e.g. "100 ml", "100 g", "1 kg".
      required:
      - amount
      - per
    VariantDetail:
      type: object
      description: A sellable variant (SKU) with its price and stock at the store.
      properties:
        id:
          type: integer
          description: 'Variant id: what the cart adds (Phase 3).'
        name:
          type: string
          description: Variant label shown on tiles and chips, e.g. "1 L".
        mrp:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: MRP (inclusive of all taxes). Show struck out when above `selling_price`.
        selling_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Price at this store (the store's price override when set).
        discount_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: '`mrp` - `selling_price`, "0.00" when none ("You save ₹70").'
        discount_percent:
          type: integer
          maximum: 99
          minimum: 0
          description: Whole percent off MRP, rounded down (never overstated). Show
            the badge ('20% OFF') only when above 0.
        unit_price:
          allOf:
          - $ref: '#/components/schemas/UnitPrice'
          nullable: true
          description: Unit sale price; null when not applicable.
        stock_status:
          $ref: '#/components/schemas/StockStatusEnum'
        orderable_quantity:
          type: integer
          minimum: 0
          description: 'Units a customer can add right now: min(units in stock at
            this store, `max_qty_per_order`). 0 when out of stock. Cap the ADD stepper
            here.'
        units_left:
          type: integer
          minimum: 1
          nullable: true
          description: 'Set only when `stock_status` is LOW_STOCK: the units left,
            for ''Only 2 left''. Null otherwise (exact stock is not published).'
        max_qty_per_order:
          type: integer
          minimum: 1
          description: Per-order limit for this variant (also enforced by the cart).
        image:
          allOf:
          - $ref: '#/components/schemas/ImageSet'
          nullable: true
          description: The variant's own first image, else the product's. Null when
            none.
        sku:
          type: string
          description: Stock keeping unit (support, analytics).
        net_quantity:
          type: string
          description: Net quantity as on the pack (Legal Metrology), e.g. "1 L" or
            "2 x 1 L".
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageSet'
          description: 'Gallery when this variant is selected: its own images first,
            then the product''s shared images. May be empty (show a placeholder).'
      required:
      - discount_amount
      - discount_percent
      - id
      - image
      - images
      - max_qty_per_order
      - mrp
      - name
      - net_quantity
      - orderable_quantity
      - selling_price
      - sku
      - stock_status
      - unit_price
      - units_left
    VariantSummary:
      type: object
