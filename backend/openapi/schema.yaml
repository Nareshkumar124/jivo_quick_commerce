    HomeBanner:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
          description: Accessibility label / analytics name.
        image:
          allOf:
          - $ref: '#/components/schemas/ImageSet'
          description: Wide banner image (about 2.25:1).
        link_type:
          $ref: '#/components/schemas/BannerLinkTypeEnum'
        link_value:
          type: string
          description: 'category/collection/product: the target''s slug. url: an absolute
            https URL. none: "". Ignore a banner whose target no longer opens (404).'
      required:
      - id
      - image
      - link_type
      - link_value
      - title
    HomeFeed:
      type: object
      properties:
        store:
          allOf:
          - $ref: '#/components/schemas/StoreStatus'
          description: Current status of the store in `X-Store-Id` (store-closed banner).
        banners:
          type: array
          items:
            $ref: '#/components/schemas/HomeBanner'
          description: Active banners for this store, in admin order (auto-scrolling
            carousel).
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryTile'
          description: Top-level categories with products at this store, in admin
            order.
        collections:
          type: array
          items:
            $ref: '#/components/schemas/CollectionRail'
          description: Collections shown on home for this store, in admin order. Empty
            rails omitted.
        buy_again:
          type: array
          items:
            $ref: '#/components/schemas/ProductCard'
          description: '''Previously bought'': up to 10 variants from the user''s
            delivered orders that this store sells, most recent first (`default_variant_id`
            is the bought variant). Empty when anonymous or without history (hide
            the rail).'
      required:
      - banners
      - buy_again
      - categories
      - collections
      - store
    ImageSet:
      type: object
      description: |-
        One picture in three widths (made at upload, 09 §1). Product and category images are
        square on a white background; banner images are wide (about 2.25:1).
      properties:
        thumbnail:
          type: string
          format: uri
          description: 'About 256 px wide: cart lines, suggestions.'
        medium:
          type: string
          format: uri
          description: 'About 512 px wide: product tiles, category grid.'
        large:
          type: string
          format: uri
          description: 'About 1024 px wide: detail gallery and zoom, banners.'
        alt_text:
          type: string
          description: Accessibility label (may be empty).
      required:
      - alt_text
      - large
      - medium
      - thumbnail
    LocationBatchRequest:
      type: object
      properties:
        points:
          type: array
          items:
            $ref: '#/components/schemas/LocationPointRequest'
          description: '1 to `max_batch` points (default 50), any order. Send a batch
            again unchanged if its response was lost: points already stored are skipped.'
      required:
      - points
    LocationBatchResult:
      type: object
      properties:
        accepted:
          type: integer
          description: Points stored now.
        duplicates:
          type: integer
          description: Points already stored (a resent batch).
        rejected:
          type: integer
          description: 'Points not stored: recorded more than 24 hours ago, or more
            than 2 minutes in the future. Do not resend them.'
        location:
          $ref: '#/components/schemas/RiderLocationSettings'
        server_time:
          type: string
          format: date-time
      required:
      - accepted
      - duplicates
      - location
      - rejected
      - server_time
    LocationPointRequest:
      type: object
      properties:
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
          description: Latitude (WGS84), decimal degrees.
        lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
          description: Longitude (WGS84), decimal degrees.
        accuracy:
          type: number
          format: double
          minimum: 0
          description: Horizontal accuracy, metres.
        speed:
          type: number
          format: double
          minimum: 0
          nullable: true
          description: Metres per second.
        heading:
          type: number
          format: double
          maximum: 360
          minimum: 0
          nullable: true
          description: Degrees from north, 0-360.
        recorded_at:
          type: string
          format: date-time
          description: When the fix was taken (UTC). The de-duplication key with the
            rider.
        is_mocked:
          type: boolean
          default: false
          description: 'True when Android reports a mock location (fraud signal, api-requests
            #5).'
      required:
      - accuracy
      - lat
      - lng
      - recorded_at
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
          description: The refresh token to revoke.
        fcm_token:
          type: string
          minLength: 1
          description: This device's FCM token, to stop its pushes.
          maxLength: 512
      required:
      - refresh
    Me:
      type: object
      description: The signed-in user. PATCH accepts `name`, `email` and `marketing_opt_in`.
      properties:
        id:
          type: integer
          readOnly: true
        phone:
          type: string
          readOnly: true
          nullable: true
          description: Login phone. Not editable in v1.
        name:
          type: string
          description: Required to complete the profile. Cannot be blanked.
          maxLength: 120
        email:
          type: string
          format: email
          nullable: true
          description: Optional. Send null (or an empty string) to remove it. Must
            be unique.
        marketing_opt_in:
          type: boolean
          description: Consent to promotional push notifications.
        is_profile_complete:
          type: boolean
          readOnly: true
          description: 'False until a name is set: show the complete-profile screen.'
        rider_status:
          allOf:
          - $ref: '#/components/schemas/RiderStatusEnum'
          readOnly: true
          description: |-
            Rider profile status; NONE without a rider profile (`POST /rider/register/`).

            * `NONE` - No rider profile: show registration
            * `PENDING_KYC` - Registered, waiting for KYC approval
            * `ACTIVE` - Approved: can go online
            * `REJECTED` - KYC rejected: see the reason, re-submit
            * `SUSPENDED` - Suspended by ops
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_profile_complete
      - name
      - phone
      - rider_status
    NotifyMe:
      type: object
      description: '`POST /serviceability/notify-me/`: interest in delivery to an
        unserviced location.'
      properties:
        id:
          type: integer
          readOnly: true
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
          description: Latitude (WGS84, decimal degrees).
        lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
          description: Longitude (WGS84, decimal degrees).
        phone:
          type: string
          nullable: true
          description: 'Contact for the ''we now deliver here'' message. Optional:
            defaults to the signed-in user''s phone; anonymous requests without it
            are kept as a demand signal only.'
          pattern: ^\+91[6-9][0-9]{9}$
        address_text:
          type: string
          description: The reverse-geocoded address shown on the map screen (for ops
            planning).
          maxLength: 500
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - lat
      - lng
    NotifyMeRequest:
      type: object
      description: '`POST /serviceability/notify-me/`: interest in delivery to an
        unserviced location.'
      properties:
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
          description: Latitude (WGS84, decimal degrees).
        lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
          description: Longitude (WGS84, decimal degrees).
        phone:
          type: string
          nullable: true
          minLength: 1
          description: 'Contact for the ''we now deliver here'' message. Optional:
            defaults to the signed-in user''s phone; anonymous requests without it
            are kept as a demand signal only.'
          pattern: ^\+91[6-9][0-9]{9}$
        address_text:
          type: string
          description: The reverse-geocoded address shown on the map screen (for ops
            planning).
          maxLength: 500
      required:
      - lat
      - lng
    NutritionRow:
      type: object
      properties:
        name:
          type: string
          description: Nutrient, e.g. "Energy (kcal)".
        values:
          type: array
          items:
            type: string
          description: One value per column, as printed, e.g. ["900", "135"]. "" =
            not stated.
        is_sub_row:
          type: boolean
          description: Indent under the previous row (e.g. "Saturated fat" under "Total
            fat").
      required:
      - is_sub_row
      - name
      - values
    NutritionTable:
      type: object
      description: The nutrition table as printed on the label (FSSAI).
      properties:
        columns:
          type: array
          items:
            type: string
          description: Column headings, e.g. ["Per 100 ml", "Per serving (15 ml)"].
        rows:
          type: array
          items:
            $ref: '#/components/schemas/NutritionRow'
      required:
      - columns
      - rows
    OfferRejectReasonEnum:
      enum:
      - TOO_FAR
      - VEHICLE_ISSUE
      - ON_BREAK
      - OTHER
      type: string
      description: |-
        * `TOO_FAR` - Too far
        * `VEHICLE_ISSUE` - Vehicle issue
        * `ON_BREAK` - On a break
        * `OTHER` - Other
    OfferRejectRequest:
      type: object
      properties:
        reason:
          allOf:
          - $ref: '#/components/schemas/OfferRejectReasonEnum'
          nullable: true
    Order:
      type: object
      description: An order with its bill. The bill is a snapshot made by `compute_bill()`
        at placement.
      properties:
        id:
          type: integer
        order_number:
          type: string
          description: Shown to the customer, e.g. "JV-261103-000123".
        status:
          allOf:
          - $ref: '#/components/schemas/OrderStatusEnum'
          description: |-
            08 §1.

            * `PAYMENT_PENDING` - Completing payment…
            * `PLACED` - Order placed
            * `ACCEPTED` - Order confirmed
            * `PACKING` - Packing your order
            * `PACKED` - Packed, rider on the way to store
            * `OUT_FOR_DELIVERY` - On the way
            * `DELIVERED` - Delivered
            * `CANCELLED` - Cancelled
            * `PAYMENT_FAILED` - Payment failed
            * `DELIVERY_FAILED` - Delivery unsuccessful
            * `RETURNED` - Delivery unsuccessful
        payment_method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        payment_status:
          $ref: '#/components/schemas/PaymentStatusEnum'
        store:
          $ref: '#/components/schemas/OrderStore'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        item_count:
          type: integer
          minimum: 1
          description: Units (sum of quantities).
        bill:
          $ref: '#/components/schemas/Bill'
        coupon_code:
          type: string
          nullable: true
          description: Null when none was used.
        address:
          $ref: '#/components/schemas/OrderAddress'
        instructions:
          $ref: '#/components/schemas/DeliveryInstructions'
        created_at:
          type: string
          format: date-time
        placed_at:
          type: string
          format: date-time
          nullable: true
          description: When it reached PLACED (paid online, or confirmed COD); null
            before.
        payment_expires_at:
          type: string
          format: date-time
          nullable: true
          description: 'PAYMENT_PENDING only: the end of the online payment window
            (15 minutes from placement, a server setting). Retrying the payment does
            not extend it. After it the order fails and the stock is released. Null
            in every other state.'
        eta_at:
          type: string
          format: date-time
          nullable: true
          description: Promised delivery time (UTC; show it in IST). Null until PLACED.
        can_cancel:
          type: boolean
          description: 'True when `POST /orders/{id}/cancel/` is allowed now (08 §7):
            PAYMENT_PENDING, PLACED or ACCEPTED (from PACKING on, show ''Contact support'').'
        can_retry_payment:
          type: boolean
          description: 'True when `POST /orders/{id}/retry-payment/` is allowed now:
            an ONLINE order in PAYMENT_PENDING before `payment_expires_at`.'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/OrderTimelineEntry'
          description: Every state reached, oldest first (Phase 4).
        cancellation:
          allOf:
          - $ref: '#/components/schemas/OrderCancellation'
          nullable: true
          description: Set when the order is CANCELLED; null otherwise (Phase 4).
        amount_refunded:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: 'Refunded so far (processed refunds), Phase 4. `bill` is always
            the current bill: after items were found unavailable it is the reduced
            one.'
        refunds:
          type: array
          items:
            $ref: '#/components/schemas/OrderRefund'
          description: Refunds of this order, oldest first; [] when none (Phase 4).
        can_download_invoice:
          type: boolean
          description: 'True when `GET /orders/{id}/invoice/` has an invoice: DELIVERED
            orders (Phase 4).'
      required:
      - address
      - amount_refunded
      - bill
      - can_cancel
      - can_download_invoice
      - can_retry_payment
      - cancellation
      - coupon_code
      - created_at
      - eta_at
      - id
      - instructions
      - item_count
      - items
      - order_number
      - payment_expires_at
      - payment_method
      - payment_status
      - placed_at
      - refunds
      - status
      - store
      - timeline
    OrderAddress:
      type: object
      description: |-
        The delivery address as it was when the order was placed (a snapshot: later edits to the
        saved address do not change it). Same fields and types as `Address`.
      properties:
        label:
          $ref: '#/components/schemas/AddressLabelEnum'
        custom_label:
          type: string
          description: Shown instead of the label when set, e.g. "Mom's place".
          maxLength: 40
        receiver_name:
          type: string
          description: Who receives the order, as it was at order time.
          maxLength: 120
        receiver_phone:
          description: The receiver's phone at order time (E.164).
          oneOf:
          - type: string
            pattern: ^\+91[6-9][0-9]{9}$
          - type: string
            maxLength: 0
        house:
          type: string
          description: House / flat / floor.
          maxLength: 120
        building_street:
          type: string
          description: Building and street.
          maxLength: 200
        landmark:
          type: string
          maxLength: 120
        area:
          type: string
          maxLength: 120
        city:
          type: string
          maxLength: 80
        state:
          type: string
          maxLength: 80
        pincode:
          type: string
          pattern: ^[1-9][0-9]{5}$
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
          description: Map pin latitude (WGS84). Required. Stored to 6 decimal places.
        lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
          description: Map pin longitude (WGS84). Required. Stored to 6 decimal places.
      required:
      - area
      - building_street
      - city
      - custom_label
      - house
      - label
      - landmark
      - lat
      - lng
      - pincode
      - receiver_name
      - receiver_phone
      - state
    OrderCancelReasonEnum:
      enum:
      - CHANGE_PAYMENT_METHOD
      - PAYMENT_PROBLEM
      - ORDERED_BY_MISTAKE
      - CHANGED_MIND
      - DELIVERY_TOO_SLOW
      - OTHER
      - ITEMS_UNAVAILABLE
      - STORE_CLOSING
      - ADDRESS_ISSUE
      - CUSTOMER_REQUEST
      - SUSPECTED_FRAUD
      - NO_RIDER
      - OTHER_STAFF
      type: string
      description: |-
        * `CHANGE_PAYMENT_METHOD` - I want to pay another way
        * `PAYMENT_PROBLEM` - The payment did not work
        * `ORDERED_BY_MISTAKE` - I ordered by mistake
        * `CHANGED_MIND` - I changed my mind
        * `DELIVERY_TOO_SLOW` - Delivery is taking too long
        * `OTHER` - Other
        * `ITEMS_UNAVAILABLE` - Items are not available at the store
        * `STORE_CLOSING` - The store had to close
        * `ADDRESS_ISSUE` - We could not deliver to this address
        * `CUSTOMER_REQUEST` - Cancelled at your request
        * `SUSPECTED_FRAUD` - The order could not be verified
        * `NO_RIDER` - No delivery partner was available
        * `OTHER_STAFF` - Cancelled by the store
    OrderCancelRequest:
      type: object
      properties:
        reason:
          $ref: '#/components/schemas/CancelReasonEnum'
        note:
          type: string
          description: Optional free text, e.g. for OTHER.
          maxLength: 250
      required:
      - reason
    OrderCancellation:
      type: object
      properties:
        reason:
          $ref: '#/components/schemas/OrderCancelReasonEnum'
        message:
          type: string
          description: The reason as text to show.
        cancelled_by:
          allOf:
          - $ref: '#/components/schemas/CancelledByEnum'
          description: |-
            `customer`, `store`, `ops` (Jivo support) or `system` (payment window).

            * `customer` - Customer
            * `store` - Store staff
            * `rider` - Rider
            * `ops` - Ops / support
            * `system` - System
        cancelled_at:
          type: string
          format: date-time
      required:
      - cancelled_at
      - cancelled_by
      - message
      - reason
    OrderCreateRequest:
      type: object
      properties:
        address_id:
          type: integer
          minimum: 1
          description: 'One of the caller''s saved addresses, inside the service area
            of the store in `X-Store-Id`. Unknown or another user''s: 400.'
        payment_method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        expected_grand_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: 'The cart''s `bill.grand_total` exactly as displayed. If the
            server''s bill differs (a price, fee or coupon changed), the order is
            not placed: 409 `PRICE_CHANGED`; reload the cart and show the new bill.'
      required:
      - address_id
      - expected_grand_total
      - payment_method
    OrderInvoice:
      type: object
      description: '`GET /orders/{id}/invoice/`: a short-lived link to the GST invoice
        PDF.'
      properties:
        invoice_number:
          type: string
          description: e.g. "GGN01/26-27/000123".
        issued_at:
          type: string
          format: date-time
        url:
          type: string
          format: uri
          description: Signed link to the PDF; open or download it before `expires_at`.
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - invoice_number
      - issued_at
      - url
    OrderLine:
      type: object
      description: An ordered variant, with the names and prices as they were at order
        time.
      properties:
        id:
          type: integer
        variant_id:
          type: integer
        product_id:
          type: integer
        product_name:
          type: string
        variant_name:
          type: string
          description: e.g. "1 L".
        image:
          allOf:
          - $ref: '#/components/schemas/ImageSet'
          nullable: true
        mrp:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Unit MRP at order time.
        selling_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Unit price paid at order time.
        quantity:
          type: integer
          minimum: 1
          description: Units ordered.
        quantity_unavailable:
          type: integer
          minimum: 0
          description: 'Units the store could not supply (08 T8a, Phase 4): removed
            from the order and the bill (refunded if paid online). 0 normally. Units
            coming = `quantity` - `quantity_unavailable`; show the removed ones struck
            through.'
        line_mrp_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: '`mrp` x the units coming (`quantity` - `quantity_unavailable`).'
        line_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: '`selling_price` x the units coming (`quantity` - `quantity_unavailable`).'
      required:
      - id
      - image
      - line_mrp_total
      - line_total
      - mrp
      - product_id
      - product_name
      - quantity
      - quantity_unavailable
      - selling_price
      - variant_id
      - variant_name
    OrderPlacement:
      type: object
      properties:
        order:
          $ref: '#/components/schemas/Order'
        razorpay:
          allOf:
          - $ref: '#/components/schemas/RazorpayCheckout'
          nullable: true
          description: 'ONLINE orders in PAYMENT_PENDING: open checkout with it, then
            call `POST /payments/razorpay/verify/`. Null for COD (and for an online
            order that is no longer awaiting payment).'
      required:
      - order
      - razorpay
    OrderRefund:
      type: object
      description: Money going back to the original payment method (08 §4 rule 4,
        §6.4).
      properties:
        id:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Amount refunded.
        status:
          allOf:
          - $ref: '#/components/schemas/OrderRefundStatusEnum'
          description: |-
            PENDING: started; banks usually take 5-7 working days. PROCESSED: the gateway has sent it. A refund the gateway refused is retried by Jivo's team and stays PENDING here (never FAILED).

            * `PENDING` - Refund in progress
            * `PROCESSED` - Refunded
        reason:
          $ref: '#/components/schemas/OrderRefundReasonEnum'
        created_at:
          type: string
          format: date-time
        processed_at:
          type: string
          format: date-time
          nullable: true
      required:
      - amount
      - created_at
      - id
      - processed_at
      - reason
      - status
    OrderRefundReasonEnum:
      enum:
      - ORDER_CANCELLED
      - ITEMS_UNAVAILABLE
      - DELIVERY_FAILED
      - PAYMENT_ISSUE
      - GOODWILL
      type: string
      description: |-
        * `ORDER_CANCELLED` - Order cancelled
        * `ITEMS_UNAVAILABLE` - Items not available
        * `DELIVERY_FAILED` - Delivery unsuccessful
        * `PAYMENT_ISSUE` - Extra or late payment returned
        * `GOODWILL` - Refund from customer support
    OrderRefundStatusEnum:
      enum:
      - PENDING
      - PROCESSED
      type: string
      description: |-
        * `PENDING` - Refund in progress
        * `PROCESSED` - Refunded
    OrderStatusEnum:
      enum:
      - PAYMENT_PENDING
      - PLACED
      - ACCEPTED
      - PACKING
      - PACKED
      - OUT_FOR_DELIVERY
      - DELIVERED
      - CANCELLED
      - PAYMENT_FAILED
      - DELIVERY_FAILED
      - RETURNED
      type: string
      description: |-
        * `PAYMENT_PENDING` - Completing payment…
        * `PLACED` - Order placed
        * `ACCEPTED` - Order confirmed
        * `PACKING` - Packing your order
        * `PACKED` - Packed, rider on the way to store
        * `OUT_FOR_DELIVERY` - On the way
        * `DELIVERED` - Delivered
        * `CANCELLED` - Cancelled
        * `PAYMENT_FAILED` - Payment failed
        * `DELIVERY_FAILED` - Delivery unsuccessful
        * `RETURNED` - Delivery unsuccessful
    OrderStore:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          description: e.g. "Jivo Sector 14, Gurugram".
      required:
      - id
      - name
    OrderSummary:
      type: object
      description: A row of the order list.
      properties:
        id:
          type: integer
        order_number:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatusEnum'
        payment_method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        payment_status:
          $ref: '#/components/schemas/PaymentStatusEnum'
        store:
          $ref: '#/components/schemas/OrderStore'
        item_count:
          type: integer
          minimum: 1
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageSet'
          description: Pictures of up to the first 4 lines, for the row thumbnails.
        grand_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: The order's `bill.grand_total`.
        created_at:
          type: string
          format: date-time
        placed_at:
          type: string
          format: date-time
          nullable: true
        payment_expires_at:
          type: string
          format: date-time
          nullable: true
          description: 'As on `Order`: set only while PAYMENT_PENDING.'
        eta_at:
          type: string
          format: date-time
          nullable: true
        can_retry_payment:
          type: boolean
      required:
      - can_retry_payment
      - created_at
      - eta_at
      - grand_total
      - id
      - images
      - item_count
      - order_number
      - payment_expires_at
      - payment_method
      - payment_status
      - placed_at
      - status
      - store
    OrderTimelineEntry:
      type: object
      description: A state the order reached (08 §1), oldest first.
      properties:
        status:
          $ref: '#/components/schemas/OrderStatusEnum'
        title:
          type: string
          description: The customer label of the state, e.g. "Order confirmed".
        at:
          type: string
          format: date-time
      required:
      - at
      - status
      - title
    OrderTrack:
      type: object
      description: |-
        `GET /orders/{id}/track/` (api-requests #28): poll every 10 s while the tracking screen is
        open (WebSocket from Phase 6).
      properties:
        order_id:
          type: integer
        order_number:
          type: string
          description: e.g. "JV-261110-001203".
        status:
          $ref: '#/components/schemas/OrderStatusEnum'
        eta_at:
          type: string
          format: date-time
          nullable: true
          description: Promised delivery time (08 §8); null once the order ended.
        store:
          $ref: '#/components/schemas/TrackStore'
        destination:
          allOf:
          - $ref: '#/components/schemas/TrackPoint'
          description: The delivery pin.
        rider:
          allOf:
          - $ref: '#/components/schemas/TrackRider'
          nullable: true
          description: Null until a rider accepts, and again once the order is finished.
        delivery_otp:
          type: string
          nullable: true
          description: The 4-digit OTP to give the rider, only while OUT_FOR_DELIVERY;
            null otherwise. Never share it before the rider arrives.
        server_time:
          type: string
          format: date-time
      required:
      - delivery_otp
      - destination
      - eta_at
      - order_id
      - order_number
      - rider
      - server_time
      - status
      - store
    OtpPurposeEnum:
      enum:
      - login
      - delete_account
      type: string
      description: |-
        * `login` - Log in or sign up
        * `delete_account` - Confirm account deletion
    OtpSendRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
          description: E.164 Indian mobile, e.g. +919876543210.
          pattern: ^\+91[6-9][0-9]{9}$
        app:
          allOf:
          - $ref: '#/components/schemas/AppEnum'
          description: |-
            The app asking. Same value as `X-App-Name`.

            * `customer` - Customer app
            * `rider` - Rider app
        purpose:
          allOf:
          - $ref: '#/components/schemas/OtpPurposeEnum'
          default: login
          description: |-
            `login` (default): for `/auth/otp/verify/`. `delete_account`: for `/me/delete/` only; it can never log anyone in.

            * `login` - Log in or sign up
            * `delete_account` - Confirm account deletion
      required:
      - app
      - phone
    OtpSent:
      type: object
      properties:
        otp_length:
          type: integer
          description: Digits in the OTP (6).
        expires_in_seconds:
          type: integer
          description: The OTP is valid this long (300).
        resend_after_seconds:
          type: integer
          description: Enable the Resend button after this many seconds (30).
      required:
      - expires_in_seconds
      - otp_length
      - resend_after_seconds
    OtpSettings:
      type: object
      properties:
        length:
          type: integer
          description: OTP digits (6).
        resend_after_seconds:
          type: integer
          description: Resend countdown (30).
      required:
      - length
      - resend_after_seconds
    OtpVerifyRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
          pattern: ^\+91[6-9][0-9]{9}$
        otp:
          type: string
          minLength: 1
          description: 6 digits.
          pattern: ^[0-9]{6}$
        app:
          allOf:
          - $ref: '#/components/schemas/AppEnum'
          description: |-
            Must match the `app` the OTP was requested for. Authoritative over X-App-Name.

            * `customer` - Customer app
            * `rider` - Rider app
        terms_version:
          type: string
          minLength: 1
          description: 'The Terms & Privacy version the user accepted on the login
            screen: send `terms_version` from `/config/app/` (DPDP consent record).'
          maxLength: 32
      required:
      - app
      - otp
      - phone
      - terms_version
    Page:
      type: object
      properties:
        slug:
          type: string
          description: about, terms, privacy or refund-policy.
        title:
          type: string
        html:
          type: string
          description: 'Sanitised HTML: h1-h6, p, br, ul/ol/li, blockquote, strong/em/b/i
            and <a href> with https:, mailto: or tel: only. No attributes other than
            href, no scripts, styles, images or relative links. Still render it with
            the app''s own safe HTML parser.'
        updated_at:
          type: string
          format: date-time
          description: Last edit (UTC).
      required:
      - html
      - slug
      - title
      - updated_at
    PaginatedAddressList:
