                    otp:
                      length: 6
                      resend_after_seconds: 30
                    rider_location:
                      active_interval_seconds: 10
                      idle_interval_seconds: 30
                    feature_flags: {}
                Maintenance:
                  value:
                    min_supported_version: 1.0.0
                    latest_version: 1.2.0
                    store_url: https://play.google.com/store/apps/details?id=in.jivo.quick
