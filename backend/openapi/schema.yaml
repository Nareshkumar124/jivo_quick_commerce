  /api/v1/search/suggest/:
    get:
      operationId: search_suggest
      description: 'Call while typing (debounced 300 ms). Up to 10 suggestions: products
        and categories open directly (`slug`), keywords run a search (`query`). With
        a blank or missing `q`, returns the trending searches (03 §2.7) as `keyword`
        items. Recent searches are kept on the device.'
      summary: Typeahead suggestions, or trending searches
      parameters:
      - in: header
        name: X-Store-Id
        schema:
          type: integer
        description: 'The store id from `GET /serviceability/` (`store.id`) for the
          selected location. Missing or not a positive integer: 400 `VALIDATION_ERROR`
          with `details: {"X-Store-Id": [...]}`. Unknown or deactivated store: 404
          `STORE_NOT_FOUND`; drop the saved store and check serviceability again.
          A closed store is still browsable.'
        required: true
      - in: query
        name: q
        schema:
          type: string
          default: ''
          maxLength: 100
        description: 'Text typed so far (debounce 300 ms). Blank or missing: trending
          searches.'
      tags:
      - catalog
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchSuggestions'
              examples:
                Typing"can":
                  value:
                    query: can
                    suggestions:
                    - type: product
                      text: Jivo Cold Pressed Canola Oil
                      query: canola oil
                      id: 101
                      slug: jivo-cold-pressed-canola-oil
                      image:
                        thumbnail: https://media.jivo.in/catalog/8f3b2c/canola-1l-256.webp
                        medium: https://media.jivo.in/catalog/8f3b2c/canola-1l-512.webp
                        large: https://media.jivo.in/catalog/8f3b2c/canola-1l-1024.webp
                        alt_text: Jivo Cold Pressed Canola Oil 1 L bottle
                    - type: category
                      text: Canola Oil
                      query: canola oil
                      id: 11
                      slug: canola-oil
                      image:
                        thumbnail: https://media.jivo.in/catalog/5d2e8a/canola-oil-256.webp
                        medium: https://media.jivo.in/catalog/5d2e8a/canola-oil-512.webp
                        large: https://media.jivo.in/catalog/5d2e8a/canola-oil-1024.webp
                        alt_text: Canola oil
                    - type: keyword
                      text: canola oil 5 l
                      query: canola oil 5 l
                      id: null
                      slug: null
                      image: null
                  summary: Typing "can"
                Trending(blankQ):
                  value:
                    query: ''
                    suggestions:
                    - type: keyword
                      text: olive oil
                      query: olive oil
                      id: null
                      slug: null
                      image: null
                    - type: keyword
                      text: wheatgrass juice
                      query: wheatgrass juice
                      id: null
                      slug: null
                      image: null
                    - type: keyword
                      text: mustard oil
                      query: mustard oil
                      id: null
                      slug: null
                      image: null
                  summary: Trending (blank q)
                NoMatch:
                  value:
                    query: xyz
                    suggestions: []
                  summary: No match
          description: Suggestions.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                XSTOREIDMISSING:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Some fields are invalid.
                      details:
                        X-Store-Id:
                        - This header is required.
                  summary: X_STORE_ID_MISSING
                XSTOREIDINVALID:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Some fields are invalid.
                      details:
                        X-Store-Id:
                        - A valid store id is required.
                  summary: X_STORE_ID_INVALID
                QTooLong:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Some fields are invalid.
                      details:
                        q:
                        - Ensure this field has no more than 100 characters.
                  summary: q too long
          description: 'Invalid request: the `X-Store-Id` header is missing or malformed,
            or a query parameter is invalid.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                STORENOTFOUND:
                  value:
                    error:
                      code: STORE_NOT_FOUND
                      message: This store is not available. Check serviceability again.
                      details:
                        store_id: 7
                  summary: 'Unknown or deactivated store: check serviceability again'
          description: '`STORE_NOT_FOUND`: the store in `X-Store-Id` does not exist
            or was deactivated.'
        '426':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                APPUPDATEREQUIRED:
                  value:
                    error:
                      code: APP_UPDATE_REQUIRED
                      message: Please update the app to continue.
                      details:
                        min_supported_version: 1.2.0
                        latest_version: 1.4.0
                        store_url: https://play.google.com/store/apps/details?id=in.jivo.quick
                  summary: APP_UPDATE_REQUIRED
          description: Force update. Sent only when the request carries `X-App-Name`,
            `X-Platform` and `X-App-Version`, and the version is below `min_supported_version`
            for that app and platform. Requests without these headers never get 426.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                MAINTENANCE:
                  value:
                    error:
                      code: MAINTENANCE
                      message: Jivo is down for scheduled maintenance. We will be
                        back by 6:00 AM.
                      details: {}
          description: 'Maintenance mode is on (`/api/v1/config/app/` returns `maintenance:
            true`). `message` is the text to show.'
  /api/v1/serviceability/:
    get:
      operationId: serviceability_check
      description: |-
        Call it after the user picks a location (GPS or map pin), on app start for the selected address, and on pull-to-refresh. Save `store.id` and send it as `X-Store-Id` on catalog calls.

        A valid point **always answers 200**: not serviceable is `serviceable: false` with `store: null`, and a closed store is `serviceable: true` with `store.is_open: false` (browsing allowed, checkout disabled). This endpoint never returns `NOT_SERVICEABLE` or `STORE_CLOSED`; those are 422 errors of the actions that need an open store (cart address and order placement, Phase 3).

        When service areas overlap, the nearest open store is chosen (07 §2.2). `eta_minutes` follows 08 §8.
      summary: Is this location serviceable, and by which store?
      parameters:
      - in: query
        name: lat
        schema:
          type: number
          format: double
          maximum: 90
          minimum: -90
        description: Latitude (WGS84, decimal degrees).
        required: true
      - in: query
        name: lng
        schema:
          type: number
          format: double
          maximum: 180
          minimum: -180
        description: Longitude (WGS84, decimal degrees).
        required: true
      tags:
      - serviceability
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Serviceability'
              examples:
                Serviceable,StoreOpen:
                  value:
                    serviceable: true
                    store:
                      id: 1
                      name: Jivo Sector 14, Gurugram
                      is_open: true
                      opens_at: null
                    eta_minutes: 14
                    message: null
                  summary: Serviceable, store open
                Serviceable,StoreClosedForTheNight:
                  value:
                    serviceable: true
                    store:
                      id: 1
                      name: Jivo Sector 14, Gurugram
                      is_open: false
                      opens_at: '2026-11-03T01:30:00Z'
                    eta_minutes: null
                    message: The store is closed now. It opens at 7:00 AM.
                  summary: Serviceable, store closed for the night
                Serviceable,StorePaused:
                  value:
                    serviceable: true
                    store:
                      id: 1
                      name: Jivo Sector 14, Gurugram
                      is_open: false
                      opens_at: null
                    eta_minutes: null
                    message: The store is not taking orders right now. Please check
                      back soon.
                  summary: Serviceable, store paused
                NotServiceable:
                  value:
                    serviceable: false
                    store: null
                    eta_minutes: null
                    message: We're not in your area yet. Tap Notify me and we'll tell
                      you when we arrive.
                  summary: Not serviceable
          description: Serviceability of the point.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                MissingCoordinates:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Some fields are invalid.
                      details:
                        lat:
                        - This field is required.
                        lng:
                        - This field is required.
                  summary: Missing coordinates
                LatitudeOutOfRange:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Some fields are invalid.
                      details:
                        lat:
                        - Ensure this value is less than or equal to 90.
                  summary: Latitude out of range
          description: '`lat`/`lng` missing or out of range.'
        '426':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                APPUPDATEREQUIRED:
                  value:
                    error:
                      code: APP_UPDATE_REQUIRED
                      message: Please update the app to continue.
                      details:
                        min_supported_version: 1.2.0
                        latest_version: 1.4.0
                        store_url: https://play.google.com/store/apps/details?id=in.jivo.quick
                  summary: APP_UPDATE_REQUIRED
          description: Force update. Sent only when the request carries `X-App-Name`,
            `X-Platform` and `X-App-Version`, and the version is below `min_supported_version`
            for that app and platform. Requests without these headers never get 426.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                MAINTENANCE:
                  value:
                    error:
                      code: MAINTENANCE
                      message: Jivo is down for scheduled maintenance. We will be
                        back by 6:00 AM.
                      details: {}
          description: 'Maintenance mode is on (`/api/v1/config/app/` returns `maintenance:
            true`). `message` is the text to show.'
  /api/v1/serviceability/notify-me/:
    post:
      operationId: serviceability_notify_me
      description: |-
        Saves interest in an unserviced location (the 'Notify me' button on the not serviceable screen). Works signed in or anonymous: send the token when signed in, so the request is linked to the user and `phone` defaults to theirs.

        Always 201 for a valid request; repeating it is harmless (the server may merge duplicates). Rate-limited per user and IP (429 `RATE_LIMITED`).
      summary: Notify me when you deliver here
      tags:
      - serviceability
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotifyMeRequest'
            examples:
              SignedIn:
                value:
                  lat: 28.6692
                  lng: 77.4538
                  address_text: Raj Nagar Extension, Ghaziabad, Uttar Pradesh 201017
                summary: Signed in
              AnonymousWithPhone:
                value:
                  lat: 28.6692
                  lng: 77.4538
                  address_text: Raj Nagar Extension, Ghaziabad, Uttar Pradesh 201017
                  phone: '+919876543210'
                summary: Anonymous with phone
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotifyMe'
              examples:
                Saved:
                  value:
                    id: 301
                    lat: 28.6692
                    lng: 77.4538
                    address_text: Raj Nagar Extension, Ghaziabad, Uttar Pradesh 201017
                    phone: '+919876543210'
                    created_at: '2026-11-02T10:15:00Z'
          description: Interest saved.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                VALIDATIONERROR:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Some fields are invalid.
                      details:
                        lat:
                        - This field is required.
                        phone:
                        - Enter a 10-digit Indian mobile number in the form +919876543210.
                  summary: VALIDATION_ERROR
          description: Invalid fields.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                TOKENINVALID:
                  value:
                    error:
                      code: TOKEN_INVALID
                      message: Given token not valid for any token type
                      details: {}
                  summary: Expired token
          description: Only when an `Authorization` header is sent and the token is
            invalid, expired or revoked. Anonymous calls (no header) never get 401.
            Refresh once and retry, or retry without the header after logout.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                RATELIMITED:
                  value:
                    error:
                      code: RATE_LIMITED
                      message: Request was throttled. Expected available in 1800 seconds.
                      details:
                        retry_after_seconds: 1800
                  summary: RATE_LIMITED
          description: Too many requests. Wait `details.retry_after_seconds` (also
            `Retry-After`).
        '426':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                APPUPDATEREQUIRED:
                  value:
                    error:
                      code: APP_UPDATE_REQUIRED
                      message: Please update the app to continue.
                      details:
                        min_supported_version: 1.2.0
                        latest_version: 1.4.0
                        store_url: https://play.google.com/store/apps/details?id=in.jivo.quick
                  summary: APP_UPDATE_REQUIRED
          description: Force update. Sent only when the request carries `X-App-Name`,
            `X-Platform` and `X-App-Version`, and the version is below `min_supported_version`
            for that app and platform. Requests without these headers never get 426.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                MAINTENANCE:
                  value:
                    error:
                      code: MAINTENANCE
                      message: Jivo is down for scheduled maintenance. We will be
                        back by 6:00 AM.
                      details: {}
          description: 'Maintenance mode is on (`/api/v1/config/app/` returns `maintenance:
            true`). `message` is the text to show.'
  /health/live:
    get:
      operationId: health_live
      description: Returns 200 while the process can serve requests. Checks no dependencies.
        The apps call this until `/api/v1/config/app/` exists (Phase 1).
      summary: Liveness probe
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLive'
              examples:
                Alive:
                  value:
                    status: ok
          description: The process is alive.
  /health/ready:
    get:
      operationId: health_ready
      description: Checks PostgreSQL (`SELECT 1`) and Redis (`PING`). Returns 200
        when both answer, otherwise 503 `SERVICE_UNAVAILABLE` with the per-check result
        in `details.checks`.
      summary: Readiness probe
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReady'
              examples:
                Ready:
                  value:
                    status: ok
                    checks:
                      database: ok
                      redis: ok
          description: Database and Redis are reachable.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                RedisDown:
                  value:
                    error:
                      code: SERVICE_UNAVAILABLE
                      message: Service is not ready.
                      details:
                        checks:
                          database: ok
                          redis: error
                  summary: Redis down
          description: A dependency is unreachable.
components:
  schemas:
    AccountDeleteRequest:
      type: object
      properties:
        otp:
          type: string
          minLength: 1
          description: 'OTP from `POST /auth/otp/request/` with `purpose: delete_account`
            for the caller''s own phone. A login OTP is rejected.'
          pattern: ^[0-9]{6}$
        reason:
          type: string
          description: Optional feedback.
          maxLength: 500
      required:
      - otp
    AccountDeletion:
      type: object
      properties:
        deleted_at:
          type: string
          format: date-time
          description: When the deletion was recorded.
        anonymise_after:
          type: string
          format: date-time
          description: Personal data is anonymised after this time (30-day grace period,
            07 §4).
      required:
      - anonymise_after
      - deleted_at
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        label:
          $ref: '#/components/schemas/AddressLabelEnum'
        custom_label:
          type: string
          description: Shown instead of the label when set, e.g. "Mom's place".
          maxLength: 40
        receiver_name:
          type: string
          description: Defaults to the user's name. Send an empty string to reset
            it to the user's own (copied when saved). Omit it to keep the current
            value; null is rejected.
          maxLength: 120
        receiver_phone:
          description: Defaults to the user's phone. Send an empty string to reset
            it to the user's own (copied when saved). Omit it to keep the current
            value; null is rejected.
          oneOf:
          - type: string
            pattern: ^\+91[6-9][0-9]{9}$
          - type: string
            maxLength: 0
        house:
          type: string
          description: House / flat / floor.
          maxLength: 120
        building_street:
          type: string
          description: Building and street.
          maxLength: 200
        landmark:
          type: string
          maxLength: 120
        area:
          type: string
          maxLength: 120
        city:
          type: string
          maxLength: 80
        state:
          type: string
          maxLength: 80
        pincode:
          type: string
          pattern: ^[1-9][0-9]{5}$
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
          description: Map pin latitude (WGS84). Required. Stored to 6 decimal places.
        lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
          description: Map pin longitude (WGS84). Required. Stored to 6 decimal places.
        is_default:
          type: boolean
          readOnly: true
          description: Change it with `POST /addresses/{id}/set-default/`.
        is_serviceable:
          type: boolean
          readOnly: true
          description: 'True when the pin is inside an active store''s service area
            (open or not), checked on every read. An unserviceable address can be
            saved but not used for an order: show it flagged (03 §2.4). Added in Phase
            2.'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - building_street
      - city
      - created_at
      - house
      - id
      - is_default
      - is_serviceable
      - label
      - lat
      - lng
      - pincode
      - state
      - updated_at
    AddressLabelEnum:
      enum:
      - home
      - work
      - other
      type: string
      description: |-
        * `home` - Home
        * `work` - Work
        * `other` - Other
    AddressRequest:
      type: object
      properties:
        label:
          $ref: '#/components/schemas/AddressLabelEnum'
        custom_label:
          type: string
          description: Shown instead of the label when set, e.g. "Mom's place".
          maxLength: 40
        receiver_name:
          type: string
          description: Defaults to the user's name. Send an empty string to reset
            it to the user's own (copied when saved). Omit it to keep the current
            value; null is rejected.
          maxLength: 120
        receiver_phone:
          description: Defaults to the user's phone. Send an empty string to reset
            it to the user's own (copied when saved). Omit it to keep the current
            value; null is rejected.
          oneOf:
          - type: string
            pattern: ^\+91[6-9][0-9]{9}$
          - type: string
            maxLength: 0
        house:
          type: string
          minLength: 1
          description: House / flat / floor.
          maxLength: 120
        building_street:
          type: string
          minLength: 1
          description: Building and street.
          maxLength: 200
        landmark:
          type: string
          maxLength: 120
        area:
          type: string
          maxLength: 120
        city:
          type: string
          minLength: 1
          maxLength: 80
        state:
          type: string
          minLength: 1
          maxLength: 80
        pincode:
          type: string
          minLength: 1
          pattern: ^[1-9][0-9]{5}$
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
          description: Map pin latitude (WGS84). Required. Stored to 6 decimal places.
        lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
          description: Map pin longitude (WGS84). Required. Stored to 6 decimal places.
      required:
      - building_street
      - city
      - house
      - label
      - lat
      - lng
      - pincode
      - state
    AppConfig:
      type: object
      properties:
        min_supported_version:
          type: string
          nullable: true
          description: 'For the app and platform in X-App-Name / X-Platform; null
            when those headers are missing. Below it: blocking update screen.'
        latest_version:
          type: string
          nullable: true
          description: 'Below it: dismissible update prompt. Null without headers.'
        store_url:
          type: string
          format: uri
          nullable: true
          description: Store page for the update button. Null without headers.
        maintenance:
          type: boolean
          description: 'True: show the maintenance screen.'
        maintenance_message:
          type: string
          description: Text for the maintenance screen.
        support:
          $ref: '#/components/schemas/SupportContacts'
        policy_urls:
          $ref: '#/components/schemas/PolicyUrls'
        terms_version:
          type: string
          description: Current Terms & Privacy version; send it as `terms_version`
            on OTP verify.
        otp:
          $ref: '#/components/schemas/OtpSettings'
        rider_location:
          $ref: '#/components/schemas/RiderLocationSettings'
        feature_flags:
          type: object
          additionalProperties:
            type: boolean
          description: Named on/off switches. Keys are added per phase; ignore unknown
            keys.
      required:
      - feature_flags
      - latest_version
      - maintenance
      - maintenance_message
      - min_supported_version
      - otp
      - policy_urls
      - rider_location
      - store_url
      - support
      - terms_version
    AppEnum:
      enum:
      - customer
      - rider
      type: string
      description: |-
        * `customer` - Customer app
        * `rider` - Rider app
    AuthSession:
      type: object
      properties:
        access:
          type: string
          description: JWT access token, valid 15 minutes.
        refresh:
          type: string
          description: JWT refresh token, valid 30 days, single use.
        user:
          $ref: '#/components/schemas/Me'
        is_new_user:
          type: boolean
          description: True when this verification created the account. Show the complete-profile
            screen when `is_new_user` is true or `user.is_profile_complete` is false.
        rider_status:
          allOf:
          - $ref: '#/components/schemas/RiderStatusEnum'
          description: |-
            Always present (NONE without a rider profile). The rider app routes on it: NONE -> registration, PENDING_KYC/REJECTED -> status screen, ACTIVE -> home, SUSPENDED -> blocked. The customer app ignores it.

            * `NONE` - No rider profile: show registration
            * `PENDING_KYC` - Registered, waiting for KYC approval
            * `ACTIVE` - Approved: can go online
            * `REJECTED` - KYC rejected: see the reason, re-submit
