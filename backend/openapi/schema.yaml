            true`). `message` is the text to show.'
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout
      description: 'Revokes `refresh` and, when `fcm_token` is sent, deactivates that
        device so it gets no more pushes. Idempotent: always 204 for a signed-in caller,
        even if the refresh token is already revoked, expired or not the caller''s
        (then nothing happens).'
      summary: Log out this device
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
            examples:
              Logout:
                value:
                  refresh: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoicmVmcmVzaCIsImV4cCI6MTc5NjIwMjkwMCwiaWF0IjoxNzkzNjEwOTAwLCJqdGkiOiIwYTliOGM3ZDZlNWY0YTNiMmMxZDBlOWY4YTdiNmM1ZCIsInVzZXJfaWQiOjQyfQ.c2lnbmF0dXJlLWZvci1leGFtcGxlcy1vbmx5
                  fcm_token: dQw4w9WgXcQ:APA91bHun4MxP5egoKMwt2KZFBaFUH-1RYqx
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Logged out.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                VALIDATIONERROR:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Some fields are invalid.
                      details:
                        refresh:
                        - This field is required.
                  summary: VALIDATION_ERROR
          description: No refresh token in the body.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                AUTHREQUIRED:
                  value:
                    error:
                      code: AUTH_REQUIRED
                      message: Authentication is required.
                      details: {}
                  summary: No Authorization header
                TOKENINVALID:
                  value:
                    error:
                      code: TOKEN_INVALID
                      message: Given token not valid for any token type
                      details: {}
                  summary: Expired token
          description: No access token (`AUTH_REQUIRED`), or the token is invalid,
            expired or revoked (`TOKEN_INVALID`). On `TOKEN_INVALID`, refresh once
            and retry.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                RATELIMITED:
                  value:
                    error:
                      code: RATE_LIMITED
                      message: Request was throttled. Expected available in 30 seconds.
                      details:
                        retry_after_seconds: 30
                  summary: RATE_LIMITED
          description: Too many requests. Wait `details.retry_after_seconds` (also
            in `Retry-After`), then retry.
        '426':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                APPUPDATEREQUIRED:
                  value:
                    error:
                      code: APP_UPDATE_REQUIRED
                      message: Please update the app to continue.
                      details:
                        min_supported_version: 1.2.0
                        latest_version: 1.4.0
                        store_url: https://play.google.com/store/apps/details?id=in.jivo.quick
                  summary: APP_UPDATE_REQUIRED
          description: Force update. Sent only when the request carries `X-App-Name`,
            `X-Platform` and `X-App-Version`, and the version is below `min_supported_version`
            for that app and platform. Requests without these headers never get 426.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                MAINTENANCE:
                  value:
                    error:
                      code: MAINTENANCE
                      message: Jivo is down for scheduled maintenance. We will be
                        back by 6:00 AM.
                      details: {}
          description: 'Maintenance mode is on (`/api/v1/config/app/` returns `maintenance:
            true`). `message` is the text to show.'
  /api/v1/auth/otp/request/:
    post:
      operationId: auth_otp_request
      description: |-
        Sends a 6-digit OTP to `phone` for `app`. The response is the same whether or not the phone has an account (no account enumeration). With `purpose: delete_account` the OTP can only be used on `POST /me/delete/`; no SMS is sent if the phone has no account, but the response is identical.

        Fixed-OTP test numbers exist only outside production (D-15).
      summary: Send an OTP by SMS
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpSendRequest'
            examples:
              Login:
                value:
                  phone: '+919876543210'
                  app: customer
              RiderLogin:
                value:
                  phone: '+919811122233'
                  app: rider
                  purpose: login
                summary: Rider login
              DeleteAccount:
                value:
                  phone: '+919876543210'
                  app: customer
                  purpose: delete_account
                summary: Delete account
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSent'
              examples:
                Sent:
                  value:
                    otp_length: 6
                    expires_in_seconds: 300
                    resend_after_seconds: 30
          description: OTP sent.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                VALIDATIONERROR:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Some fields are invalid.
                      details:
                        phone:
                        - Enter a 10-digit Indian mobile number in the form +919876543210.
                  summary: VALIDATION_ERROR
          description: Invalid phone, app or purpose.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                OTPRATELIMITED:
                  value:
                    error:
                      code: OTP_RATE_LIMITED
                      message: Too many OTP requests. Try again later. Expected available
                        in 540 seconds.
                      details:
                        retry_after_seconds: 540
                  summary: OTP_RATE_LIMITED
          description: 'Too many OTP requests or attempts (09 §3.1: 3 sends per phone
            per 10 minutes, 10 per day, plus per-IP limits). Wait `details.retry_after_seconds`
            (also in `Retry-After`).'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                MAINTENANCE:
                  value:
                    error:
                      code: MAINTENANCE
                      message: Jivo is down for scheduled maintenance. We will be
                        back by 6:00 AM.
                      details: {}
                SERVICEUNAVAILABLE:
                  value:
                    error:
                      code: SERVICE_UNAVAILABLE
                      message: Sign-in is temporarily unavailable. Please try again
                        in a minute.
                      details: {}
                  summary: SERVICE_UNAVAILABLE
          description: Maintenance mode (`MAINTENANCE`), or sign-in is temporarily
            unavailable because the OTP rate-limit store is down (`SERVICE_UNAVAILABLE`;
            fail-closed by design). Retry shortly.
        '426':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                APPUPDATEREQUIRED:
                  value:
                    error:
                      code: APP_UPDATE_REQUIRED
                      message: Please update the app to continue.
                      details:
                        min_supported_version: 1.2.0
                        latest_version: 1.4.0
                        store_url: https://play.google.com/store/apps/details?id=in.jivo.quick
                  summary: APP_UPDATE_REQUIRED
          description: Force update. Sent only when the request carries `X-App-Name`,
            `X-Platform` and `X-App-Version`, and the version is below `min_supported_version`
            for that app and platform. Requests without these headers never get 426.
