  /api/v1/orders/{id}/reorder/:
    post:
      operationId: orders_reorder
      description: 'Puts the order''s items back in the cart, priced at the store
        in `X-Store-Id`, as far as they can be ordered now (03 §2.10). Each line is
        raised to the units of the past order, capped by what can be ordered (`orderable_quantity`);
        it is never added on top, so repeating the call changes nothing. Lines already
        in the cart with more units are left as they are. Returns the whole cart and
        the lines that could not be added in full (`unavailable`): show them, then
        open the cart.'
      summary: Order again
      parameters:
      - in: header
        name: X-Store-Id
        schema:
          type: integer
        description: 'The store id from `GET /serviceability/` (`store.id`) for the
          selected location. Missing or not a positive integer: 400 `VALIDATION_ERROR`
          with `details: {"X-Store-Id": [...]}`. Unknown or deactivated store: 404
          `STORE_NOT_FOUND`; drop the saved store and check serviceability again.
          A closed store is still browsable.'
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: '`Order.id`.'
        required: true
      tags:
      - orders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReorderResult'
              examples:
                EverythingAdded:
                  value:
                    cart:
                      store:
                        id: 1
                        name: Jivo Sector 14, Gurugram
                        is_open: true
                        opens_at: null
                      items:
                      - id: 501
                        product:
                          id: 101
                          slug: jivo-cold-pressed-canola-oil
                          name: Jivo Cold Pressed Canola Oil
                          brand: Jivo
                          is_veg: true
                        variant:
                          id: 1001
                          name: 1 L
                          mrp: '349.00'
                          selling_price: '279.00'
                          discount_amount: '70.00'
                          discount_percent: 20
                          unit_price:
                            amount: '27.90'
