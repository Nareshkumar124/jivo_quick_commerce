  /api/v1/rider/locations/:
    post:
      operationId: rider_locations_create
      description: 'A batch of GPS points while online (04 §3, api-requests #3-#5).
        Body `{points: [...]}`, 1 to `max_batch` (50) points; lat/lng are JSON numbers.
        Points are de-duplicated on `recorded_at`, so resend a batch unchanged when
        its response was lost. 409 `RIDER_OFFLINE`: the server set the rider offline
        (no location for 10 minutes, or ops): stop the service and show the offline
        state; drop the buffer. Other 4xx: drop the batch.'
      summary: Send location points
      tags:
      - rider
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationBatchRequest'
            examples:
              TwoPoints:
                value:
                  points:
                  - lat: 28.459512
                    lng: 77.026631
                    accuracy: 8.0
                    speed: 6.2
                    heading: 87.5
                    recorded_at: '2026-11-10T09:29:50.000000Z'
                    is_mocked: false
                  - lat: 28.459601
                    lng: 77.02721
                    accuracy: 7.5
                    speed: 6.4
                    heading: 88.0
                    recorded_at: '2026-11-10T09:29:55.000000Z'
                    is_mocked: false
                summary: Two points
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationBatchResult'
              examples:
                Stored:
                  value:
                    accepted: 2
                    duplicates: 0
                    rejected: 0
                    location:
                      active_interval_seconds: 10
                      idle_interval_seconds: 30
                      active_sample_seconds: 5
                      idle_sample_seconds: 30
                      max_batch: 50
                    server_time: '2026-11-10T09:30:00.120000Z'
                ResentBatch:
                  value:
                    accepted: 0
                    duplicates: 2
                    rejected: 0
                    location:
                      active_interval_seconds: 10
                      idle_interval_seconds: 30
                      active_sample_seconds: 5
                      idle_sample_seconds: 30
                      max_batch: 50
                    server_time: '2026-11-10T09:30:00.120000Z'
                  summary: Resent batch
          description: Stored.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                TooMany:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Some fields are invalid.
                      details:
                        points:
                        - Send at most 50 points per request.
                  summary: Too many
          description: Invalid points.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                RATELIMITED:
                  value:
                    error:
                      code: RATE_LIMITED
                      message: Request was throttled. Expected available in 120 seconds.
                      details:
                        retry_after_seconds: 120
                  summary: RATE_LIMITED
          description: Too many requests from this account. Wait `details.retry_after_seconds`
            (also in `Retry-After`), then try again with the same request.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                AUTHREQUIRED:
                  value:
                    error:
                      code: AUTH_REQUIRED
                      message: Authentication is required.
                      details: {}
                  summary: No Authorization header
                TOKENINVALID:
                  value:
                    error:
                      code: TOKEN_INVALID
                      message: Given token not valid for any token type
                      details: {}
                  summary: Expired token
          description: No access token (`AUTH_REQUIRED`), or the token is invalid,
            expired or revoked (`TOKEN_INVALID`). On `TOKEN_INVALID`, refresh once
            and retry.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                NOTARIDER:
                  value:
                    error:
                      code: PERMISSION_DENIED
