              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                XSTOREIDMISSING:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Some fields are invalid.
                      details:
                        X-Store-Id:
                        - This header is required.
                  summary: X_STORE_ID_MISSING
                XSTOREIDINVALID:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Some fields are invalid.
                      details:
                        X-Store-Id:
                        - A valid store id is required.
                  summary: X_STORE_ID_INVALID
                InvalidSort:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Some fields are invalid.
                      details:
                        sort:
                        - '"cheapest" is not a valid choice.'
                  summary: Invalid sort
          description: 'Invalid request: the `X-Store-Id` header is missing or malformed,
            or a query parameter is invalid.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                STORENOTFOUND:
                  value:
                    error:
                      code: STORE_NOT_FOUND
                      message: This store is not available. Check serviceability again.
                      details:
                        store_id: 7
                  summary: 'Unknown or deactivated store: check serviceability again'
                CATEGORYNOTFOUND:
                  value:
                    error:
                      code: NOT_FOUND
                      message: Category not found.
                      details: {}
                  summary: CATEGORY_NOT_FOUND
                COLLECTIONNOTFOUND:
                  value:
                    error:
                      code: NOT_FOUND
                      message: Collection not found.
                      details: {}
                  summary: COLLECTION_NOT_FOUND
                PAGENOTFOUND:
                  value:
                    error:
                      code: NOT_FOUND
                      message: Invalid page.
                      details: {}
                  summary: Page out of range
          description: '`STORE_NOT_FOUND`: the store in `X-Store-Id` does not exist
            or was deactivated. `NOT_FOUND`: the requested object or page does not
            exist.'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                RATELIMITED:
                  value:
                    error:
                      code: RATE_LIMITED
                      message: Request was throttled. Expected available in 30 seconds.
                      details:
                        retry_after_seconds: 30
                  summary: RATE_LIMITED
          description: Too many requests. Wait `details.retry_after_seconds` (also
            in `Retry-After`), then retry.
        '426':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                APPUPDATEREQUIRED:
                  value:
                    error:
                      code: APP_UPDATE_REQUIRED
                      message: Please update the app to continue.
                      details:
                        min_supported_version: 1.2.0
                        latest_version: 1.4.0
                        store_url: https://play.google.com/store/apps/details?id=in.jivo.quick
                  summary: APP_UPDATE_REQUIRED
          description: Force update. Sent only when the request carries `X-App-Name`,
            `X-Platform` and `X-App-Version`, and the version is below `min_supported_version`
            for that app and platform. Requests without these headers never get 426.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                MAINTENANCE:
                  value:
                    error:
                      code: MAINTENANCE
                      message: Jivo is down for scheduled maintenance. We will be
                        back by 6:00 AM.
                      details: {}
          description: 'Maintenance mode is on (`/api/v1/config/app/` returns `maintenance:
            true`). `message` is the text to show.'
  /api/v1/products/{id_or_slug}/:
    get:
      operationId: products_retrieve
      description: All variants this store sells (with price and stock), the gallery
        per variant, highlights, the label information required by FSSAI and Legal
        Metrology (09 §4) and similar products. 404 `NOT_FOUND` when the product is
        unknown, inactive, or not sold at this store.
      summary: Product detail
      parameters:
      - in: header
        name: X-Store-Id
        schema:
          type: integer
        description: 'The store id from `GET /serviceability/` (`store.id`) for the
          selected location. Missing or not a positive integer: 400 `VALIDATION_ERROR`
          with `details: {"X-Store-Id": [...]}`. Unknown or deactivated store: 404
          `STORE_NOT_FOUND`; drop the saved store and check serviceability again.
          A closed store is still browsable.'
        required: true
      - in: path
        name: id_or_slug
        schema:
          type: string
        description: Product id (e.g. "101") or slug (e.g. "jivo-cold-pressed-canola-oil").
        required: true
