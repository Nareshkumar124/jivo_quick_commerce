      description: Partial update. `phone` cannot be changed in v1. `name` cannot
        be blanked. `email` is optional (null or empty string removes it). An email
        that cannot be used (e.g. it belongs to another account) is rejected with
        a generic message.
      summary: Update name, email or promotional-push consent
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
            examples:
              CompleteProfile:
                value:
                  name: Asha Verma
                summary: Complete profile
              EditProfile:
                value:
                  name: Asha Verma
                  email: asha.verma@example.com
                  marketing_opt_in: true
                summary: Edit profile
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                Updated:
                  value:
                    id: 42
                    phone: '+919876543210'
                    name: Asha Verma
                    email: asha.verma@example.com
                    marketing_opt_in: false
                    is_profile_complete: true
                    rider_status: NONE
                    created_at: '2026-10-20T06:30:00Z'
          description: Updated user.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                EmailUnavailable:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Some fields are invalid.
                      details:
                        email:
                        - This email can't be used.
                  summary: Email unavailable
                BlankName:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Some fields are invalid.
                      details:
                        name:
                        - This field may not be blank.
                  summary: Blank name
          description: Invalid fields.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                AUTHREQUIRED:
                  value:
                    error:
                      code: AUTH_REQUIRED
                      message: Authentication is required.
                      details: {}
                  summary: No Authorization header
                TOKENINVALID:
                  value:
                    error:
                      code: TOKEN_INVALID
                      message: Given token not valid for any token type
                      details: {}
                  summary: Expired token
          description: No access token (`AUTH_REQUIRED`), or the token is invalid,
            expired or revoked (`TOKEN_INVALID`). On `TOKEN_INVALID`, refresh once
            and retry.
        '426':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                APPUPDATEREQUIRED:
                  value:
                    error:
                      code: APP_UPDATE_REQUIRED
                      message: Please update the app to continue.
                      details:
                        min_supported_version: 1.2.0
                        latest_version: 1.4.0
                        store_url: https://play.google.com/store/apps/details?id=in.jivo.quick
                  summary: APP_UPDATE_REQUIRED
          description: Force update. Sent only when the request carries `X-App-Name`,
            `X-Platform` and `X-App-Version`, and the version is below `min_supported_version`
            for that app and platform. Requests without these headers never get 426.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                MAINTENANCE:
                  value:
                    error:
                      code: MAINTENANCE
                      message: Jivo is down for scheduled maintenance. We will be
                        back by 6:00 AM.
                      details: {}
          description: 'Maintenance mode is on (`/api/v1/config/app/` returns `maintenance:
            true`). `message` is the text to show.'
  /api/v1/me/delete/:
    post:
      operationId: me_delete_account
      description: |-
        Two steps: (1) `POST /auth/otp/request/` with the user's own phone and `purpose: delete_account`; (2) this call with that OTP. Only a `delete_account` OTP issued to the caller's phone is accepted.

        On success every refresh token of the user is revoked and their devices are deactivated: clear local data and go to the login screen. Personal data is anonymised after the grace period (`anonymise_after`, 30 days, 07 §4); order and invoice records are kept without personal data.
      summary: Delete my account (OTP confirmed)
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeleteRequest'
            examples:
              Delete:
                value:
                  otp: '739204'
                  reason: I no longer use the app
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletion'
              examples:
                Scheduled:
                  value:
                    deleted_at: '2026-11-02T10:15:00Z'
                    anonymise_after: '2026-12-02T10:15:00Z'
          description: Deletion recorded.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                OTPINVALID:
                  value:
                    error:
                      code: OTP_INVALID
                      message: The OTP is incorrect.
                      details:
                        attempts_remaining: 3
                  summary: Wrong OTP
                OTPEXPIRED:
                  value:
                    error:
                      code: OTP_EXPIRED
                      message: The OTP has expired.
                      details: {}
                  summary: 'Expired, already used or out of attempts: request a new
                    OTP'
                VALIDATIONERROR:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Some fields are invalid.
                      details:
                        otp:
                        - Enter the 6-digit OTP.
                  summary: VALIDATION_ERROR
          description: Wrong or expired OTP, or invalid input.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                AUTHREQUIRED:
                  value:
                    error:
                      code: AUTH_REQUIRED
                      message: Authentication is required.
                      details: {}
                  summary: No Authorization header
                TOKENINVALID:
                  value:
                    error:
                      code: TOKEN_INVALID
                      message: Given token not valid for any token type
                      details: {}
                  summary: Expired token
          description: No access token (`AUTH_REQUIRED`), or the token is invalid,
            expired or revoked (`TOKEN_INVALID`). On `TOKEN_INVALID`, refresh once
            and retry.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                PERMISSIONDENIED:
                  value:
                    error:
                      code: PERMISSION_DENIED
                      message: Staff accounts are deleted by an administrator.
                      details: {}
                  summary: PERMISSION_DENIED
          description: Staff accounts cannot be deleted from the app.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                OTPRATELIMITED:
                  value:
                    error:
                      code: OTP_RATE_LIMITED
                      message: Too many OTP requests. Try again later. Expected available
                        in 540 seconds.
                      details:
                        retry_after_seconds: 540
                  summary: OTP_RATE_LIMITED
          description: 'Too many OTP requests or attempts (09 §3.1: 3 sends per phone
            per 10 minutes, 10 per day, plus per-IP limits). Wait `details.retry_after_seconds`
            (also in `Retry-After`).'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                MAINTENANCE:
                  value:
                    error:
                      code: MAINTENANCE
                      message: Jivo is down for scheduled maintenance. We will be
                        back by 6:00 AM.
                      details: {}
                SERVICEUNAVAILABLE:
                  value:
                    error:
                      code: SERVICE_UNAVAILABLE
                      message: Sign-in is temporarily unavailable. Please try again
                        in a minute.
                      details: {}
                  summary: SERVICE_UNAVAILABLE
          description: Maintenance mode (`MAINTENANCE`), or sign-in is temporarily
            unavailable because the OTP rate-limit store is down (`SERVICE_UNAVAILABLE`;
            fail-closed by design). Retry shortly.
        '426':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                APPUPDATEREQUIRED:
                  value:
                    error:
                      code: APP_UPDATE_REQUIRED
                      message: Please update the app to continue.
                      details:
                        min_supported_version: 1.2.0
                        latest_version: 1.4.0
                        store_url: https://play.google.com/store/apps/details?id=in.jivo.quick
                  summary: APP_UPDATE_REQUIRED
          description: Force update. Sent only when the request carries `X-App-Name`,
            `X-Platform` and `X-App-Version`, and the version is below `min_supported_version`
            for that app and platform. Requests without these headers never get 426.
  /api/v1/me/devices/:
    post:
      operationId: me_device_register
      description: 'Upsert keyed on `fcm_token`: call after login, on every FCM token
        refresh and when the app version changes. If the token was registered to another
        user it moves to the caller. Always 200.'
      summary: Register or update this device's push token
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
