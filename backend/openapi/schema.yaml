  /api/v1/config/app/:
    get:
      operationId: config_app
      description: 'Called on every app start. Versions and `store_url` are for the
        app and platform given by the `X-App-Name` and `X-Platform` headers (null
        without them). Never returns 426 or 503: during maintenance it answers 200
        with `maintenance: true`.'
      summary: App configuration (splash)
      tags:
      - config
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
              examples:
                Normal:
                  value:
                    min_supported_version: 1.0.0
                    latest_version: 1.2.0
                    store_url: https://play.google.com/store/apps/details?id=in.jivo.quick
                    maintenance: false
                    maintenance_message: ''
                    support:
                      phone: '+911800123456'
                      email: support@jivo.in
                    policy_urls:
