  /api/v1/payments/razorpay/webhook/:
    post:
      operationId: payments_razorpay_webhook
      description: |-
        Configured in the Razorpay dashboard for `payment.captured`, `payment.failed`, `refund.processed` and `refund.failed`. **Not for the apps.**

        `X-Razorpay-Signature` must be the hex HMAC-SHA256 of the exact raw body bytes, keyed with the webhook secret; anything else is a 400 and nothing is stored. Events are processed once per `X-Razorpay-Event-Id` (a repeat answers `duplicate`) and in any order relative to verify (08 §4). Unhandled event types answer `ignored`. A 2xx tells Razorpay not to retry; a 503 asks it to.
      summary: Razorpay webhook (server to server)
      parameters:
      - in: header
        name: X-Razorpay-Event-Id
        schema:
          type: string
        description: 'Unique per event: the idempotency key.'
        required: true
      - in: header
        name: X-Razorpay-Signature
        schema:
          type: string
        description: Hex HMAC-SHA256 of the raw body, keyed with the webhook secret.
        required: true
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RazorpayWebhookEventRequest'
            examples:
              Payment.captured:
                value:
                  entity: event
                  account_id: acc_EXAMPLEEXAMPLE
                  event: payment.captured
                  contains:
                  - payment
                  payload:
                    payment:
                      entity:
                        id: pay_Nq3vA1bC2dE3fG
                        entity: payment
                        amount: 75300
                        currency: INR
                        status: captured
                        order_id: order_Nq3uVxY7kL9pQe
                        method: upi
                        captured: true
                        notes:
                          order_number: JV-261103-000123
                  created_at: 1793687525
                summary: payment.captured
              Payment.failed:
                value:
                  entity: event
                  account_id: acc_EXAMPLEEXAMPLE
                  event: payment.failed
                  contains:
                  - payment
                  payload:
                    payment:
                      entity:
                        id: pay_Nq3wQ9rS8tU7vW
                        entity: payment
                        amount: 75300
                        currency: INR
                        status: failed
                        order_id: order_Nq3uVxY7kL9pQe
                        method: card
                        captured: false
                        error_code: BAD_REQUEST_ERROR
                        error_description: Payment failed due to insufficient balance.
                  created_at: 1793687525
                summary: payment.failed
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
              examples:
                Processed:
                  value:
                    status: processed
                DuplicateEventId:
                  value:
                    status: duplicate
                  summary: Duplicate event id
                EventTypeNotHandled:
                  value:
                    status: ignored
                  summary: Event type not handled
          description: Accepted.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                PAYMENTVERIFICATIONFAILED:
                  value:
                    error:
                      code: PAYMENT_VERIFICATION_FAILED
                      message: The webhook signature is invalid.
                      details: {}
                  summary: PAYMENT_VERIFICATION_FAILED
                NoEventId:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Some fields are invalid.
                      details:
                        X-Razorpay-Event-Id:
                        - This header is required.
                  summary: No event id
          description: '`PAYMENT_VERIFICATION_FAILED`: missing or wrong signature
            (nothing stored). `VALIDATION_ERROR`: no event id header, or not a Razorpay
            event.'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                SERVICEUNAVAILABLE:
                  value:
                    error:
                      code: SERVICE_UNAVAILABLE
                      message: The service is temporarily unavailable.
                      details: {}
                  summary: SERVICE_UNAVAILABLE
          description: '`SERVICE_UNAVAILABLE`: the event cannot be applied yet (a
            refund whose gateway id is still being recorded). Nothing is stored; Razorpay
            retries it.'
