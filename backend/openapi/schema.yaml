      description: |-
        Sets the line for `variant_id` to `quantity`: creates it, changes it, or removes it with 0. It sets, it does not add, so a retried request never doubles a line.

        An increase is checked against the store's stock and the variant's `max_qty_per_order`; a decrease is always accepted, so a customer can step down a line that has a stock issue. The cart does not reserve stock (08 §6.1).
