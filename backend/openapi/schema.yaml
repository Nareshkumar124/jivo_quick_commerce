    post:
      operationId: rider_tasks_deliver
      description: '08 T10. One call: checked in order (1) state (AT_CUSTOMER), (2)
        COD collection: `cod` must be sent for COD orders with `amount` = `cod_amount_due`
        exactly (for `upi`, the QR must be PAID); a mismatch is 400 and does **not**
        use an OTP attempt; (3) the OTP. Wrong OTP: 400 `DELIVERY_OTP_INVALID` with
        `details.attempts_remaining`; after 5 wrong ones 423 `DELIVERY_OTP_LOCKED`
        (`attempts_remaining` 0; ops are alerted). A wrong OTP keeps the collection:
        send it again with the next try. Success: DELIVERED with `earnings`.'
      summary: Deliver (OTP + COD)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: The offer or task id.
        required: true
      tags:
      - rider
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliverRequest'
