            pattern: ^\+91[6-9][0-9]{9}$
          - type: string
            maxLength: 0
        house:
          type: string
          description: House / flat / floor.
          maxLength: 120
        building_street:
          type: string
          description: Building and street.
          maxLength: 200
        landmark:
          type: string
          maxLength: 120
        area:
          type: string
          maxLength: 120
        city:
          type: string
          maxLength: 80
        state:
          type: string
          maxLength: 80
        pincode:
          type: string
          pattern: ^[1-9][0-9]{5}$
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
          description: Map pin latitude (WGS84). Required. Stored to 6 decimal places.
        lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
          description: Map pin longitude (WGS84). Required. Stored to 6 decimal places.
      required:
      - area
      - building_street
      - city
      - custom_label
      - house
      - label
      - landmark
      - lat
      - lng
      - pincode
      - receiver_name
      - receiver_phone
      - state
    OrderCancelRequest:
      type: object
      properties:
        reason:
          $ref: '#/components/schemas/CancelReasonEnum'
        note:
          type: string
          description: Optional free text, e.g. for OTHER.
          maxLength: 250
      required:
      - reason
    OrderCreateRequest:
      type: object
      properties:
        address_id:
          type: integer
          minimum: 1
          description: 'One of the caller''s saved addresses, inside the service area
            of the store in `X-Store-Id`. Unknown or another user''s: 400.'
        payment_method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        expected_grand_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: 'The cart''s `bill.grand_total` exactly as displayed. If the
            server''s bill differs (a price, fee or coupon changed), the order is
            not placed: 409 `PRICE_CHANGED`; reload the cart and show the new bill.'
      required:
      - address_id
      - expected_grand_total
      - payment_method
    OrderLine:
      type: object
      description: An ordered variant, with the names and prices as they were at order
        time.
      properties:
        id:
          type: integer
        variant_id:
          type: integer
        product_id:
          type: integer
        product_name:
          type: string
        variant_name:
          type: string
          description: e.g. "1 L".
        image:
          allOf:
          - $ref: '#/components/schemas/ImageSet'
          nullable: true
        mrp:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Unit MRP at order time.
        selling_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Unit price paid at order time.
        quantity:
          type: integer
          minimum: 1
        line_mrp_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: '`mrp` x `quantity`.'
        line_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: '`selling_price` x `quantity`.'
      required:
      - id
      - image
      - line_mrp_total
      - line_total
      - mrp
      - product_id
      - product_name
      - quantity
      - selling_price
      - variant_id
      - variant_name
    OrderPlacement:
      type: object
      properties:
        order:
          $ref: '#/components/schemas/Order'
        razorpay:
          allOf:
          - $ref: '#/components/schemas/RazorpayCheckout'
          nullable: true
          description: 'ONLINE orders in PAYMENT_PENDING: open checkout with it, then
            call `POST /payments/razorpay/verify/`. Null for COD (and for an online
            order that is no longer awaiting payment).'
      required:
      - order
      - razorpay
    OrderStatusEnum:
      enum:
      - PAYMENT_PENDING
      - PLACED
      - ACCEPTED
      - PACKING
      - PACKED
      - OUT_FOR_DELIVERY
      - DELIVERED
      - CANCELLED
      - PAYMENT_FAILED
      - DELIVERY_FAILED
      - RETURNED
      type: string
      description: |-
        * `PAYMENT_PENDING` - Completing payment…
        * `PLACED` - Order placed
        * `ACCEPTED` - Order confirmed
        * `PACKING` - Packing your order
        * `PACKED` - Packed, rider on the way to store
        * `OUT_FOR_DELIVERY` - On the way
        * `DELIVERED` - Delivered
        * `CANCELLED` - Cancelled
        * `PAYMENT_FAILED` - Payment failed
        * `DELIVERY_FAILED` - Delivery unsuccessful
        * `RETURNED` - Delivery unsuccessful
    OrderStore:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          description: e.g. "Jivo Sector 14, Gurugram".
      required:
      - id
      - name
    OrderSummary:
      type: object
      description: A row of the order list.
      properties:
        id:
          type: integer
        order_number:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatusEnum'
        payment_method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        payment_status:
          $ref: '#/components/schemas/PaymentStatusEnum'
        store:
          $ref: '#/components/schemas/OrderStore'
        item_count:
          type: integer
          minimum: 1
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageSet'
          description: Pictures of up to the first 4 lines, for the row thumbnails.
        grand_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: The order's `bill.grand_total`.
        created_at:
          type: string
          format: date-time
        placed_at:
          type: string
          format: date-time
          nullable: true
        payment_expires_at:
          type: string
          format: date-time
          nullable: true
          description: 'As on `Order`: set only while PAYMENT_PENDING.'
        eta_at:
          type: string
          format: date-time
          nullable: true
        can_retry_payment:
          type: boolean
      required:
      - can_retry_payment
      - created_at
      - eta_at
      - grand_total
      - id
      - images
      - item_count
      - order_number
      - payment_expires_at
      - payment_method
      - payment_status
      - placed_at
      - status
      - store
    OtpPurposeEnum:
      enum:
      - login
      - delete_account
      type: string
      description: |-
        * `login` - Log in or sign up
        * `delete_account` - Confirm account deletion
    OtpSendRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
          description: E.164 Indian mobile, e.g. +919876543210.
          pattern: ^\+91[6-9][0-9]{9}$
        app:
          allOf:
          - $ref: '#/components/schemas/AppEnum'
          description: |-
            The app asking. Same value as `X-App-Name`.

            * `customer` - Customer app
            * `rider` - Rider app
        purpose:
          allOf:
          - $ref: '#/components/schemas/OtpPurposeEnum'
          default: login
          description: |-
            `login` (default): for `/auth/otp/verify/`. `delete_account`: for `/me/delete/` only; it can never log anyone in.

            * `login` - Log in or sign up
            * `delete_account` - Confirm account deletion
      required:
      - app
      - phone
    OtpSent:
      type: object
      properties:
        otp_length:
          type: integer
          description: Digits in the OTP (6).
        expires_in_seconds:
          type: integer
          description: The OTP is valid this long (300).
        resend_after_seconds:
          type: integer
          description: Enable the Resend button after this many seconds (30).
      required:
      - expires_in_seconds
      - otp_length
      - resend_after_seconds
    OtpSettings:
      type: object
      properties:
        length:
          type: integer
          description: OTP digits (6).
        resend_after_seconds:
          type: integer
          description: Resend countdown (30).
      required:
      - length
      - resend_after_seconds
    OtpVerifyRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
          pattern: ^\+91[6-9][0-9]{9}$
        otp:
          type: string
          minLength: 1
          description: 6 digits.
          pattern: ^[0-9]{6}$
        app:
          allOf:
          - $ref: '#/components/schemas/AppEnum'
          description: |-
            Must match the `app` the OTP was requested for. Authoritative over X-App-Name.

            * `customer` - Customer app
            * `rider` - Rider app
        terms_version:
          type: string
          minLength: 1
          description: 'The Terms & Privacy version the user accepted on the login
            screen: send `terms_version` from `/config/app/` (DPDP consent record).'
          maxLength: 32
      required:
      - app
      - otp
      - phone
      - terms_version
    PaginatedAddressList:
      type: object
      description: 'Standard page (02 §5): `?page=&page_size=`, default 20, max 100.'
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/Address'
      required:
      - count
      - next
      - previous
      - results
    PaginatedOrderSummaryList:
      type: object
      description: 'Standard page (02 §5): `?page=&page_size=`, default 20, max 100.'
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummary'
      required:
      - count
      - next
      - previous
      - results
    PaginatedProductCardList:
      type: object
      description: 'Standard page (02 §5): `?page=&page_size=`, default 20, max 100.'
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProductCard'
      required:
      - count
      - next
      - previous
      - results
    PatchedAddressRequest:
      type: object
      properties:
        label:
          $ref: '#/components/schemas/AddressLabelEnum'
        custom_label:
          type: string
          description: Shown instead of the label when set, e.g. "Mom's place".
          maxLength: 40
        receiver_name:
          type: string
          description: Defaults to the user's name. Send an empty string to reset
            it to the user's own (copied when saved). Omit it to keep the current
            value; null is rejected.
          maxLength: 120
        receiver_phone:
          description: Defaults to the user's phone. Send an empty string to reset
            it to the user's own (copied when saved). Omit it to keep the current
            value; null is rejected.
          oneOf:
          - type: string
            pattern: ^\+91[6-9][0-9]{9}$
          - type: string
            maxLength: 0
        house:
          type: string
          minLength: 1
          description: House / flat / floor.
          maxLength: 120
        building_street:
          type: string
          minLength: 1
          description: Building and street.
          maxLength: 200
        landmark:
          type: string
          maxLength: 120
        area:
          type: string
          maxLength: 120
        city:
          type: string
          minLength: 1
          maxLength: 80
        state:
          type: string
          minLength: 1
          maxLength: 80
        pincode:
          type: string
          minLength: 1
          pattern: ^[1-9][0-9]{5}$
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
          description: Map pin latitude (WGS84). Required. Stored to 6 decimal places.
        lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
          description: Map pin longitude (WGS84). Required. Stored to 6 decimal places.
    PatchedCartUpdateRequest:
      type: object
      description: 'Partial update: send only the fields that change.'
      properties:
        tip:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Rider tip, e.g. "20.00"; "0.00" removes it. At most the server's
            tip limit (`CART_MAX_TIP`, ₹500 by default).
        instructions:
          allOf:
          - $ref: '#/components/schemas/DeliveryInstructionsRequest'
          description: Replaces the instructions (chips and note) as a whole.
        address_id:
          type: integer
          minimum: 1
          description: One of the caller's saved addresses. It must be inside the
            service area of the store in `X-Store-Id`, else 422 `NOT_SERVICEABLE`
            and nothing is saved.
    PatchedMeRequest:
      type: object
      description: The signed-in user. PATCH accepts `name`, `email` and `marketing_opt_in`.
      properties:
        name:
          type: string
          minLength: 1
          description: Required to complete the profile. Cannot be blanked.
          maxLength: 120
        email:
          type: string
          format: email
          nullable: true
          description: Optional. Send null (or an empty string) to remove it. Must
            be unique.
        marketing_opt_in:
          type: boolean
          description: Consent to promotional push notifications.
    PaymentMethodEnum:
      enum:
      - ONLINE
      - COD
      type: string
      description: |-
        * `ONLINE` - Pay online
        * `COD` - Cash on delivery
    PaymentOption:
      type: object
      properties:
        method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        is_available:
          type: boolean
          description: 'Show the method only when true (03 §2.9: COD is shown only
            if eligible).'
        unavailable_reason:
          allOf:
          - $ref: '#/components/schemas/PaymentUnavailableReasonEnum'
          nullable: true
        message:
          type: string
          nullable: true
          description: Display text when not available; null when available.
      required:
      - is_available
      - message
      - method
      - unavailable_reason
    PaymentStatusEnum:
      enum:
      - PENDING
      - PAID
      - FAILED
      - REFUND_PENDING
      - REFUNDED
      - PARTIALLY_REFUNDED
      - COD_PENDING
      - COD_COLLECTED
      type: string
      description: |-
        * `PENDING` - Awaiting payment
        * `PAID` - Paid
        * `FAILED` - Not paid
        * `REFUND_PENDING` - Refund in progress
        * `REFUNDED` - Refunded
        * `PARTIALLY_REFUNDED` - Partially refunded
        * `COD_PENDING` - Pay on delivery
        * `COD_COLLECTED` - Paid on delivery
    PaymentUnavailableReasonEnum:
      enum:
      - COD_DISABLED
      - ABOVE_LIMIT
      - NOT_ALLOWED
      type: string
      description: |-
        * `COD_DISABLED` - The store does not offer cash on delivery.
        * `ABOVE_LIMIT` - The order is above the cash-on-delivery limit.
        * `NOT_ALLOWED` - Cash on delivery is not available for this account.
    PaymentVerifyRequest:
      type: object
      properties:
        order_id:
          type: integer
          minimum: 1
          description: Our order id (`Order.id`).
        razorpay_order_id:
          type: string
          minLength: 1
          description: From the checkout success callback.
          pattern: ^order_[A-Za-z0-9]{10,40}$
        razorpay_payment_id:
          type: string
          minLength: 1
          description: From the checkout success callback.
          pattern: ^pay_[A-Za-z0-9]{10,40}$
        razorpay_signature:
          type: string
          minLength: 1
          description: From the checkout success callback (64 hex characters).
          pattern: ^[0-9a-f]{64}$
      required:
      - order_id
      - razorpay_order_id
      - razorpay_payment_id
      - razorpay_signature
    PlatformEnum:
      enum:
      - android
      - ios
      type: string
      description: |-
        * `android` - Android
        * `ios` - iOS
    PolicyUrls:
      type: object
      properties:
        terms:
          type: string
          format: uri
        privacy:
          type: string
          format: uri
        refund:
          type: string
          format: uri
      required:
      - privacy
      - refund
      - terms
    ProductCard:
      type: object
      description: 'A product tile (03 §2.5): used by home rails, lists, search, collections,
        similar items.'
      properties:
        id:
          type: integer
        slug:
          type: string
          description: 'For product links: `GET /products/{slug}/`.'
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          description: e.g. "Jivo Cold Pressed Canola Oil".
        brand:
          type: string
          description: '"Jivo" for every product in v1.'
        is_veg:
          type: boolean
          description: FSSAI veg mark (green dot) when true.
        image:
          allOf:
          - $ref: '#/components/schemas/ImageSet'
          nullable: true
          description: Image of the default variant (see `default_variant_id`). Null
            when none.
        default_variant_id:
          type: integer
          description: 'The variant the tile shows and ADD adds: the one this list
            is about (e.g. the collection item or past purchase), else the first in-stock
            variant, else the first. Always one of `variants`.'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/VariantSummary'
          description: Every active variant this store sells, in display order (the
            chips on the detail page), including out-of-stock ones. With more than
            one, ADD opens a variant picker. Never empty.
      required:
      - brand
      - default_variant_id
      - id
      - image
      - is_veg
      - name
      - slug
      - variants
    ProductDetail:
      type: object
      description: |-
        Product detail (03 §2.6) with the mandatory label information (09 §4: FSSAI and Legal
        Metrology). Label text fields are "" when not applicable: hide the row.
      properties:
        id:
          type: integer
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
        brand:
          type: string
        is_veg:
          type: boolean
          description: FSSAI veg mark (green dot) when true.
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryTile'
          description: The product's category (breadcrumb, links).
        short_description:
          type: string
          description: One or two lines.
        description:
          type: string
          description: Plain text; paragraphs are separated by a blank line. No HTML
            or Markdown.
        highlights:
          type: array
          items:
            type: string
          description: Key highlights (bullet points).
        default_variant_id:
          type: integer
          description: Variant selected when the page opens (the one tapped, else
            first in stock).
        variants:
          type: array
          items:
            $ref: '#/components/schemas/VariantDetail'
          description: Every active variant this store sells, in chip order (1 L /
            2 L / 5 L), including out-of-stock ones. Never empty.
        ingredients:
          type: string
        nutrition:
          allOf:
          - $ref: '#/components/schemas/NutritionTable'
          nullable: true
          description: Null when the product has no nutrition table.
        shelf_life:
          type: string
          description: Best-before guidance, e.g. "9 months from manufacture".
        storage_instructions:
          type: string
        country_of_origin:
          type: string
        manufacturer:
          type: string
          description: Name and address of the manufacturer or packer.
        marketer:
          type: string
          description: Name and address of the marketer, when different.
        importer:
          type: string
          description: Name and address of the importer, for imported products.
        consumer_care:
          type: string
          description: Consumer care details (phone, email, address).
        fssai_license_no:
          type: string
          description: FSSAI licence number printed on the label (14 digits).
        similar_products:
          type: array
          items:
            $ref: '#/components/schemas/ProductCard'
          description: Up to 10 products from the same category at this store, in
            stock first.
      required:
      - brand
      - category
      - consumer_care
      - country_of_origin
      - default_variant_id
      - description
      - fssai_license_no
      - highlights
      - id
      - importer
      - ingredients
      - is_veg
      - manufacturer
      - marketer
      - name
      - nutrition
      - shelf_life
      - short_description
      - similar_products
      - slug
      - storage_instructions
      - variants
    RazorpayCheckout:
      type: object
      description: |-
        Options for Razorpay checkout (`razorpay_flutter` `open()`), all set by the server: pass
        them through unchanged. The amount is the order's `grand_total` in paise.
      properties:
        key_id:
          type: string
          description: 'Razorpay key id (`key`). Local development only: `rzp_fake_jivo_local`
            means the server uses the fake gateway; complete the payment with the
            dev-only scheme in 06 §2.6 instead of opening Razorpay.'
        order_id:
          type: string
          description: Razorpay order id (`order_id`), "order_...".
        amount:
          type: integer
          minimum: 100
          description: '`grand_total` in paise (`amount`), e.g. 75300 for ₹753.00.
            Display the order''s `bill.grand_total` instead.'
        currency:
          type: string
          description: Always "INR".
        name:
          type: string
          description: Merchant name shown in checkout (`name`), "Jivo".
        description:
          type: string
          description: '`description`, e.g. the order number.'
        prefill:
          $ref: '#/components/schemas/RazorpayPrefill'
        expires_at:
          type: string
          format: date-time
          description: Same as the order's `payment_expires_at`.
        timeout_seconds:
          type: integer
          minimum: 1
          description: Seconds left in the payment window (`timeout`), so checkout
            closes in time.
      required:
      - amount
      - currency
      - description
      - expires_at
      - key_id
      - name
      - order_id
      - prefill
      - timeout_seconds
    RazorpayPrefill:
      type: object
      properties:
        name:
          type: string
        contact:
          type: string
          description: The customer's phone, E.164.
        email:
          type: string
          description: '"" when the customer has none.'
      required:
      - contact
      - email
      - name
    RazorpayWebhookEventRequest:
      type: object
      description: |-
        A Razorpay webhook event (only the fields the server reads are listed; others are
        ignored). Sent by Razorpay, never by the apps.
      properties:
        entity:
          type: string
          minLength: 1
          description: '"event".'
        account_id:
          type: string
          minLength: 1
        event:
          type: string
          minLength: 1
          description: 'Handled: `payment.captured`, `payment.failed`, `refund.processed`,
            `refund.failed`. Others are acknowledged and ignored.'
        contains:
          type: array
          items:
            type: string
            minLength: 1
        payload:
          type: object
          additionalProperties: {}
          description: The entities, e.g. `payment.entity`.
        created_at:
          type: integer
          description: Unix time.
      required:
      - event
      - payload
    RiderLocationSettings:
      type: object
      properties:
        active_interval_seconds:
          type: integer
          description: Location upload interval on an active task (5-10 s, 04 §3).
        idle_interval_seconds:
          type: integer
          description: Location upload interval while online and idle (30 s).
      required:
      - active_interval_seconds
      - idle_interval_seconds
    RiderStatusEnum:
      enum:
      - NONE
      - PENDING_KYC
      - ACTIVE
      - REJECTED
      - SUSPENDED
      type: string
      description: |-
        * `NONE` - No rider profile: show registration
        * `PENDING_KYC` - Registered, waiting for KYC approval
        * `ACTIVE` - Approved: can go online
        * `REJECTED` - KYC rejected: see the reason, re-submit
        * `SUSPENDED` - Suspended by ops
    SearchSuggestion:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/SearchSuggestionTypeEnum'
        text:
          type: string
          description: What to show in the suggestion row.
        query:
          type: string
          description: The search term to run (and save in recent searches) when tapped.
        id:
          type: integer
          nullable: true
          description: Product or category id; null for keywords.
        slug:
          type: string
          nullable: true
          description: Product or category slug to open; null for keywords.
          pattern: ^[-a-zA-Z0-9_]+$
        image:
          allOf:
          - $ref: '#/components/schemas/ImageSet'
          nullable: true
          description: Product or category image, if any.
      required:
      - id
      - image
      - query
      - slug
      - text
      - type
    SearchSuggestionTypeEnum:
      enum:
      - product
      - category
      - keyword
      type: string
      description: |-
        * `product` - A product: open its detail page (slug)
        * `category` - A category: open its product list (slug)
        * `keyword` - A search term (typed match or trending): run the search with `query`
    SearchSuggestions:
      type: object
      properties:
        query:
          type: string
          description: The `q` these are for (match it to the latest keystroke).
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/SearchSuggestion'
          description: 'Up to 10, best first. For a blank `q`: the trending searches
            (`keyword`), possibly empty.'
      required:
      - query
      - suggestions
    Serviceability:
      type: object
      properties:
        serviceable:
          type: boolean
          description: 'True when the point is inside an active store''s service area
            (whether or not the store is open). False: show ''We''re not in your area
            yet'' with Notify me.'
        store:
          allOf:
          - $ref: '#/components/schemas/StoreStatus'
          nullable: true
          description: The store that serves this point (the nearest open one when
            service areas overlap). Null when not serviceable.
        eta_minutes:
          type: integer
          minimum: 1
          nullable: true
          description: Estimated delivery time in minutes for the home header ('Delivery
            in 14 mins'), 08 §8. Null when not serviceable or when the store is closed.
        message:
          type: string
          nullable: true
          description: Text to show when the location is not serviceable or the store
            is closed (times in IST). Null when serviceable and open.
      required:
      - eta_minutes
      - message
      - serviceable
      - store
    StockStatusEnum:
      enum:
      - IN_STOCK
      - LOW_STOCK
      - OUT_OF_STOCK
      type: string
      description: |-
        * `IN_STOCK` - In stock
        * `LOW_STOCK` - In stock, only a few left: show 'Only {units_left} left'
        * `OUT_OF_STOCK` - Out of stock: grey the tile out, no ADD button
    StoreStatus:
      type: object
      description: The dark store serving a location, and whether it takes orders
        right now.
      properties:
        id:
          type: integer
          description: Send it as the `X-Store-Id` header on every catalog (and, from
            P3, cart) call.
        name:
          type: string
          description: Display name, e.g. "Jivo Sector 14, Gurugram".
        is_open:
          type: boolean
          description: 'True when the store is inside its opening hours and accepting
            orders. When false, browsing still works but checkout is disabled: show
            the store-closed banner.'
        opens_at:
          type: string
          format: date-time
          nullable: true
          description: UTC time of the next opening (show it in IST, e.g. 'Opens at
            7:00 AM' or 'Opens tomorrow at 7:00 AM'). Null when the store is open,
            and null when it is temporarily not accepting orders with no known reopening
            time.
      required:
      - id
      - is_open
      - name
      - opens_at
    SupportContacts:
      type: object
      properties:
        phone:
          type: string
          description: Support phone, E.164.
        email:
          type: string
          format: email
      required:
      - email
      - phone
    TokenPair:
      type: object
      properties:
        access:
          type: string
          description: New access token (15 minutes).
        refresh:
          type: string
          description: New refresh token (30 days). Replace the stored one; the old
            one is revoked.
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
          description: The current refresh token. It is single use.
      required:
      - refresh
    UnitPrice:
      type: object
      description: Unit sale price for comparison (Legal Metrology), e.g. ₹27.90 per
        100 ml.
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Selling price per `per`.
        per:
          type: string
          description: The unit quantity, e.g. "100 ml", "100 g", "1 kg".
      required:
      - amount
      - per
    VariantDetail:
      type: object
      description: A sellable variant (SKU) with its price and stock at the store.
      properties:
        id:
          type: integer
          description: 'Variant id: what the cart adds (Phase 3).'
        name:
          type: string
          description: Variant label shown on tiles and chips, e.g. "1 L".
        mrp:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: MRP (inclusive of all taxes). Show struck out when above `selling_price`.
        selling_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Price at this store (the store's price override when set).
        discount_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: '`mrp` - `selling_price`, "0.00" when none ("You save ₹70").'
        discount_percent:
          type: integer
          maximum: 99
          minimum: 0
          description: Whole percent off MRP, rounded down (never overstated). Show
            the badge ('20% OFF') only when above 0.
        unit_price:
          allOf:
          - $ref: '#/components/schemas/UnitPrice'
          nullable: true
          description: Unit sale price; null when not applicable.
        stock_status:
          $ref: '#/components/schemas/StockStatusEnum'
        orderable_quantity:
          type: integer
          minimum: 0
          description: 'Units a customer can add right now: min(units in stock at
            this store, `max_qty_per_order`). 0 when out of stock. Cap the ADD stepper
            here.'
        units_left:
          type: integer
          minimum: 1
          nullable: true
          description: 'Set only when `stock_status` is LOW_STOCK: the units left,
            for ''Only 2 left''. Null otherwise (exact stock is not published).'
        max_qty_per_order:
          type: integer
          minimum: 1
          description: Per-order limit for this variant (also enforced by the cart).
        image:
          allOf:
          - $ref: '#/components/schemas/ImageSet'
          nullable: true
          description: The variant's own first image, else the product's. Null when
            none.
        sku:
          type: string
          description: Stock keeping unit (support, analytics).
        net_quantity:
          type: string
          description: Net quantity as on the pack (Legal Metrology), e.g. "1 L" or
            "2 x 1 L".
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageSet'
          description: 'Gallery when this variant is selected: its own images first,
            then the product''s shared images. May be empty (show a placeholder).'
      required:
      - discount_amount
      - discount_percent
      - id
      - image
      - images
      - max_qty_per_order
      - mrp
      - name
      - net_quantity
      - orderable_quantity
      - selling_price
      - sku
      - stock_status
      - unit_price
      - units_left
    VariantSummary:
      type: object
      description: A sellable variant (SKU) with its price and stock at the store.
      properties:
        id:
          type: integer
          description: 'Variant id: what the cart adds (Phase 3).'
        name:
          type: string
          description: Variant label shown on tiles and chips, e.g. "1 L".
        mrp:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: MRP (inclusive of all taxes). Show struck out when above `selling_price`.
        selling_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Price at this store (the store's price override when set).
        discount_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: '`mrp` - `selling_price`, "0.00" when none ("You save ₹70").'
        discount_percent:
          type: integer
          maximum: 99
          minimum: 0
          description: Whole percent off MRP, rounded down (never overstated). Show
            the badge ('20% OFF') only when above 0.
        unit_price:
          allOf:
          - $ref: '#/components/schemas/UnitPrice'
          nullable: true
          description: Unit sale price; null when not applicable.
        stock_status:
          $ref: '#/components/schemas/StockStatusEnum'
        orderable_quantity:
          type: integer
          minimum: 0
          description: 'Units a customer can add right now: min(units in stock at
            this store, `max_qty_per_order`). 0 when out of stock. Cap the ADD stepper
            here.'
        units_left:
          type: integer
          minimum: 1
          nullable: true
          description: 'Set only when `stock_status` is LOW_STOCK: the units left,
            for ''Only 2 left''. Null otherwise (exact stock is not published).'
        max_qty_per_order:
          type: integer
          minimum: 1
          description: Per-order limit for this variant (also enforced by the cart).
        image:
          allOf:
          - $ref: '#/components/schemas/ImageSet'
          nullable: true
          description: The variant's own first image, else the product's. Null when
            none.
      required:
      - discount_amount
      - discount_percent
      - id
      - image
      - max_qty_per_order
      - mrp
      - name
      - orderable_quantity
      - selling_price
      - stock_status
      - unit_price
      - units_left
    WebhookAck:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/WebhookResultEnum'
      required:
      - status
    WebhookResultEnum:
      enum:
      - processed
      - duplicate
      - ignored
      type: string
      description: |-
        * `processed` - Processed
        * `duplicate` - Already processed (same event id): nothing done
        * `ignored` - Event type not handled: nothing done
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: health
  description: Liveness and readiness probes. No authentication.
- name: auth
  description: Phone OTP sign-in, token refresh, logout (06 §2.1).
- name: account
  description: Profile, push devices, account deletion (06 §2.1).
- name: addresses
  description: Saved delivery addresses (06 §2.2).
- name: config
  description: 'App configuration: versions, maintenance, contacts.'
- name: serviceability
  description: Which store serves a location, and notify-me (06 §2.3).
- name: catalog
  description: 'Home, categories, products, search and collections for one store:
    every operation takes the `X-Store-Id` header (06 §2.4).'
- name: cart
  description: The server cart, its bill and coupons, priced at the store in `X-Store-Id`
    (06 §2.5). The app renders the bill; it never computes money.
- name: orders
  description: Place orders, list them, retry a payment, cancel (06 §2.6, 08).
- name: payments
  description: Online payment confirmation and the gateway webhook (06 §2.6, 08 §4).
