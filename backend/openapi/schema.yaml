  /api/v1/faqs/:
    get:
      operationId: faqs_list
      description: 'Public, not paginated. Active FAQs of the app in display order,
        grouped by `category`: entries of one category are consecutive, so start a
        new heading whenever `category` changes. Answers are plain text. Cached for
        up to 5 minutes.'
      summary: FAQs for an app's help screen
      parameters:
      - in: query
        name: app
        schema:
          enum:
          - customer
          - rider
          type: string
          minLength: 1
        description: |-
          Which app's help screen: customer or rider.

          * `customer` - Customer app
          * `rider` - Rider app
        required: true
      tags:
      - cms
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Faq'
              examples:
                CustomerApp:
                  value:
                  - id: 1
                    category: Orders
                    question: How long does delivery take?
                    answer: Most orders arrive in 10 to 30 minutes.
                  summary: Customer app
          description: The FAQs (may be empty). The example shows one entry of the
            list.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                InvalidApp:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Some fields are invalid.
                      details:
                        app:
                        - '"shop" is not a valid choice.'
                  summary: Invalid app
          description: '`app` is missing or not customer/rider.'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                RATELIMITED:
                  value:
                    error:
                      code: RATE_LIMITED
                      message: Request was throttled. Expected available in 30 seconds.
                      details:
                        retry_after_seconds: 30
                  summary: RATE_LIMITED
          description: Too many requests. Wait `details.retry_after_seconds` (also
            in `Retry-After`), then retry.
        '426':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                APPUPDATEREQUIRED:
                  value:
                    error:
                      code: APP_UPDATE_REQUIRED
                      message: Please update the app to continue.
                      details:
                        min_supported_version: 1.2.0
                        latest_version: 1.4.0
                        store_url: https://play.google.com/store/apps/details?id=in.jivo.quick
                  summary: APP_UPDATE_REQUIRED
          description: Force update. Sent only when the request carries `X-App-Name`,
            `X-Platform` and `X-App-Version`, and the version is below `min_supported_version`
            for that app and platform. Requests without these headers never get 426.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                MAINTENANCE:
                  value:
                    error:
                      code: MAINTENANCE
                      message: Jivo is down for scheduled maintenance. We will be
                        back by 6:00 AM.
                      details: {}
          description: 'Maintenance mode is on (`/api/v1/config/app/` returns `maintenance:
            true`). `message` is the text to show.'
  /api/v1/home/:
    get:
      operationId: home_retrieve
      description: |-
        Banners, top-level categories, collection rails and, when signed in, 'buy again' (03 §2.5), all for the store in `X-Store-Id`.

        Optional authentication: send the token when signed in so `buy_again` is filled. An invalid or expired token gets 401 `TOKEN_INVALID` (refresh and retry); it is never silently treated as anonymous.

        `store` is the store's current status: show the store-closed banner when `store.is_open` is false (browsing stays allowed). Pull to refresh reloads this and re-checks serviceability.
      summary: Home feed for a store
      parameters:
      - in: header
        name: X-Store-Id
        schema:
          type: integer
        description: 'The store id from `GET /serviceability/` (`store.id`) for the
          selected location. Missing or not a positive integer: 400 `VALIDATION_ERROR`
          with `details: {"X-Store-Id": [...]}`. Unknown or deactivated store: 404
          `STORE_NOT_FOUND`; drop the saved store and check serviceability again.
          A closed store is still browsable.'
        required: true
      tags:
      - catalog
      security:
      - jwtAuth: []
      - {}
