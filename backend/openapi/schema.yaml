            `X-Platform` and `X-App-Version`, and the version is below `min_supported_version`
            for that app and platform. Requests without these headers never get 426.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                MAINTENANCE:
                  value:
                    error:
                      code: MAINTENANCE
                      message: Jivo is down for scheduled maintenance. We will be
                        back by 6:00 AM.
                      details: {}
          description: 'Maintenance mode is on (`/api/v1/config/app/` returns `maintenance:
            true`). `message` is the text to show.'
  /api/v1/support/tickets/{id}/messages/:
    post:
      operationId: support_tickets_messages_create
      description: 'Adds the caller''s message and returns the whole ticket. A RESOLVED
        ticket is reopened (OPEN). A CLOSED ticket refuses replies with 400 `VALIDATION_ERROR`
        (`details.ticket`): offer a new ticket instead. Rate limited per user (`SUPPORT_MESSAGES_RATE`,
        default 60 per hour).'
      summary: Reply on my ticket
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: '`SupportTicket.id` (not the TK- number).'
        required: true
      tags:
      - support
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketReplyRequest'
            examples:
              Reply:
                value:
                  message: Thank you, I can see the refund now.
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
              examples:
                Replied:
                  value:
                    id: 12
                    number: TK-000012
                    category: DAMAGED_ITEMS
                    status: OPEN
                    order_id: 1002
                    order_number: JV-261104-001002
                    last_message: Thank you, I can see the refund now.
                    created_at: '2026-11-04T05:10:00Z'
                    updated_at: '2026-11-04T06:02:00Z'
                    can_reply: true
                    messages:
                    - id: 31
                      body: The oil bottle cap was broken when it arrived.
                      from_support: false
                      created_at: '2026-11-04T05:10:00Z'
                    - id: 32
                      body: Sorry about that! We have started a refund for the bottle.
                      from_support: true
                      created_at: '2026-11-04T05:25:00Z'
                    - id: 33
                      body: Thank you, I can see the refund now.
                      from_support: false
                      created_at: '2026-11-04T06:02:00Z'
          description: The ticket with the new message.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                TicketClosed:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: This ticket is closed. Open a new ticket if you still
                        need help.
                      details:
                        ticket:
                        - This ticket is closed. Open a new ticket if you still need
                          help.
                  summary: Ticket closed
                EmptyMessage:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Some fields are invalid.
                      details:
                        message:
                        - This field may not be blank.
                  summary: Empty message
          description: Empty or too long message (1 to 1000 characters), or the ticket
            is CLOSED.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                AUTHREQUIRED:
                  value:
                    error:
                      code: AUTH_REQUIRED
                      message: Authentication is required.
                      details: {}
                  summary: No Authorization header
                TOKENINVALID:
                  value:
                    error:
                      code: TOKEN_INVALID
                      message: Given token not valid for any token type
                      details: {}
                  summary: Expired token
          description: No access token (`AUTH_REQUIRED`), or the token is invalid,
            expired or revoked (`TOKEN_INVALID`). On `TOKEN_INVALID`, refresh once
            and retry.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                NOTFOUND:
                  value:
                    error:
                      code: NOT_FOUND
                      message: Ticket not found.
                      details: {}
                  summary: NOT_FOUND
          description: The ticket does not exist or is not the caller's.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                RATELIMITED:
                  value:
                    error:
                      code: RATE_LIMITED
                      message: Request was throttled. Expected available in 120 seconds.
                      details:
                        retry_after_seconds: 120
                  summary: RATE_LIMITED
          description: Too many requests from this account. Wait `details.retry_after_seconds`
            (also in `Retry-After`), then try again with the same request.
        '426':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                APPUPDATEREQUIRED:
                  value:
                    error:
                      code: APP_UPDATE_REQUIRED
                      message: Please update the app to continue.
                      details:
                        min_supported_version: 1.2.0
                        latest_version: 1.4.0
                        store_url: https://play.google.com/store/apps/details?id=in.jivo.quick
                  summary: APP_UPDATE_REQUIRED
          description: Force update. Sent only when the request carries `X-App-Name`,
            `X-Platform` and `X-App-Version`, and the version is below `min_supported_version`
            for that app and platform. Requests without these headers never get 426.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                MAINTENANCE:
                  value:
                    error:
                      code: MAINTENANCE
                      message: Jivo is down for scheduled maintenance. We will be
                        back by 6:00 AM.
                      details: {}
          description: 'Maintenance mode is on (`/api/v1/config/app/` returns `maintenance:
            true`). `message` is the text to show.'
  /health/live:
    get:
      operationId: health_live
      description: Returns 200 while the process can serve requests. Checks no dependencies.
        The apps call this until `/api/v1/config/app/` exists (Phase 1).
      summary: Liveness probe
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLive'
              examples:
                Alive:
                  value:
                    status: ok
          description: The process is alive.
  /health/ready:
    get:
      operationId: health_ready
      description: Checks PostgreSQL (`SELECT 1`) and Redis (`PING`). Returns 200
        when both answer, otherwise 503 `SERVICE_UNAVAILABLE` with the per-check result
        in `details.checks`.
      summary: Readiness probe
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReady'
              examples:
                Ready:
                  value:
                    status: ok
                    checks:
                      database: ok
                      redis: ok
          description: Database and Redis are reachable.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                RedisDown:
                  value:
                    error:
                      code: SERVICE_UNAVAILABLE
                      message: Service is not ready.
                      details:
                        checks:
                          database: ok
                          redis: error
                  summary: Redis down
          description: A dependency is unreachable.
components:
  schemas:
    AccountDeleteRequest:
      type: object
      properties:
        otp:
          type: string
          minLength: 1
          description: 'OTP from `POST /auth/otp/request/` with `purpose: delete_account`
            for the caller''s own phone. A login OTP is rejected.'
          pattern: ^[0-9]{6}$
        reason:
          type: string
          description: Optional feedback.
          maxLength: 500
      required:
      - otp
    AccountDeletion:
      type: object
      properties:
        deleted_at:
          type: string
          format: date-time
          description: When the deletion was recorded.
        anonymise_after:
          type: string
          format: date-time
          description: Personal data is anonymised after this time (30-day grace period,
            07 §4).
      required:
      - anonymise_after
      - deleted_at
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        label:
          $ref: '#/components/schemas/AddressLabelEnum'
        custom_label:
          type: string
          description: Shown instead of the label when set, e.g. "Mom's place".
          maxLength: 40
        receiver_name:
          type: string
          description: Defaults to the user's name. Send an empty string to reset
            it to the user's own (copied when saved). Omit it to keep the current
            value; null is rejected.
          maxLength: 120
        receiver_phone:
          description: Defaults to the user's phone. Send an empty string to reset
            it to the user's own (copied when saved). Omit it to keep the current
            value; null is rejected.
          oneOf:
          - type: string
            pattern: ^\+91[6-9][0-9]{9}$
          - type: string
            maxLength: 0
        house:
          type: string
          description: House / flat / floor.
          maxLength: 120
        building_street:
          type: string
          description: Building and street.
          maxLength: 200
        landmark:
          type: string
          maxLength: 120
        area:
          type: string
          maxLength: 120
        city:
          type: string
          maxLength: 80
        state:
          type: string
          maxLength: 80
        pincode:
          type: string
          pattern: ^[1-9][0-9]{5}$
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
          description: Map pin latitude (WGS84). Required. Stored to 6 decimal places.
        lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
          description: Map pin longitude (WGS84). Required. Stored to 6 decimal places.
        is_default:
          type: boolean
          readOnly: true
          description: Change it with `POST /addresses/{id}/set-default/`.
        is_serviceable:
          type: boolean
          readOnly: true
          description: 'True when the pin is inside an active store''s service area
            (open or not), checked on every read. An unserviceable address can be
            saved but not used for an order: show it flagged (03 §2.4). Added in Phase
            2.'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - building_street
      - city
      - created_at
      - house
      - id
      - is_default
      - is_serviceable
      - label
      - lat
      - lng
      - pincode
      - state
      - updated_at
    AddressLabelEnum:
      enum:
      - home
      - work
      - other
      type: string
      description: |-
        * `home` - Home
        * `work` - Work
        * `other` - Other
    AddressRequest:
      type: object
      properties:
        label:
          $ref: '#/components/schemas/AddressLabelEnum'
        custom_label:
          type: string
          description: Shown instead of the label when set, e.g. "Mom's place".
          maxLength: 40
        receiver_name:
          type: string
          description: Defaults to the user's name. Send an empty string to reset
            it to the user's own (copied when saved). Omit it to keep the current
            value; null is rejected.
          maxLength: 120
        receiver_phone:
          description: Defaults to the user's phone. Send an empty string to reset
            it to the user's own (copied when saved). Omit it to keep the current
            value; null is rejected.
          oneOf:
          - type: string
            pattern: ^\+91[6-9][0-9]{9}$
          - type: string
            maxLength: 0
        house:
          type: string
          minLength: 1
          description: House / flat / floor.
          maxLength: 120
        building_street:
          type: string
          minLength: 1
          description: Building and street.
          maxLength: 200
        landmark:
          type: string
          maxLength: 120
        area:
          type: string
          maxLength: 120
        city:
          type: string
          minLength: 1
          maxLength: 80
        state:
          type: string
          minLength: 1
          maxLength: 80
        pincode:
          type: string
          minLength: 1
          pattern: ^[1-9][0-9]{5}$
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
          description: Map pin latitude (WGS84). Required. Stored to 6 decimal places.
        lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
          description: Map pin longitude (WGS84). Required. Stored to 6 decimal places.
      required:
      - building_street
      - city
      - house
      - label
      - lat
      - lng
      - pincode
      - state
    AppConfig:
      type: object
      properties:
        min_supported_version:
          type: string
          nullable: true
          description: 'For the app and platform in X-App-Name / X-Platform; null
            when those headers are missing. Below it: blocking update screen.'
        latest_version:
          type: string
          nullable: true
          description: 'Below it: dismissible update prompt. Null without headers.'
        store_url:
          type: string
          format: uri
          nullable: true
          description: Store page for the update button. Null without headers.
        maintenance:
          type: boolean
          description: 'True: show the maintenance screen.'
        maintenance_message:
          type: string
          description: Text for the maintenance screen.
        support:
          $ref: '#/components/schemas/SupportContacts'
        policy_urls:
          $ref: '#/components/schemas/PolicyUrls'
        terms_version:
          type: string
          description: Current Terms & Privacy version; send it as `terms_version`
            on OTP verify.
        otp:
          $ref: '#/components/schemas/OtpSettings'
        rider_location:
          $ref: '#/components/schemas/RiderLocationSettings'
        feature_flags:
          type: object
          additionalProperties:
            type: boolean
          description: Named on/off switches. Keys are added per phase; ignore unknown
            keys.
      required:
      - feature_flags
      - latest_version
      - maintenance
      - maintenance_message
      - min_supported_version
      - otp
      - policy_urls
      - rider_location
      - store_url
      - support
      - terms_version
    AppEnum:
      enum:
      - customer
      - rider
      type: string
      description: |-
        * `customer` - Customer app
        * `rider` - Rider app
    AppliedCoupon:
      type: object
      properties:
        code:
          type: string
        title:
          type: string
          description: e.g. "Flat ₹50 off".
        discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: The discount it gives this cart now ("0.00" when it does not
            apply).
        is_applicable:
          type: boolean
          description: 'False when the cart no longer qualifies (e.g. items removed):
            the coupon stays applied but gives nothing, and checkout is blocked until
            it is removed or the cart qualifies again (see `checkout.blockers`).'
        message:
          type: string
          nullable: true
          description: Why it does not apply (e.g. 'Add items worth ₹74 more'); null
            when it does.
        amount_to_unlock:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: 'When it does not apply because the item total is below its
            minimum: the item value still needed (for the app''s own ''Add items worth
            ₹X more''). Null otherwise. Added in Phase 3 R2b, like `CouponOffer.amount_to_unlock`.'
      required:
      - amount_to_unlock
      - code
      - discount
      - is_applicable
      - message
      - title
    ArrivedCustomerRequest:
      type: object
      properties:
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
          description: Latitude (WGS84), decimal degrees.
        lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
          description: Longitude (WGS84), decimal degrees.
        accuracy:
          type: number
          format: double
          minimum: 0
          nullable: true
          description: Metres; widens the geofence by at most 50 m.
        override_reason:
          type: string
          description: 'Outside the geofence (wrong pin, gated society...): a short
            reason lets the rider mark arrival anyway. Logged for ops.'
          maxLength: 200
      required:
      - lat
      - lng
    AuthSession:
      type: object
      properties:
        access:
          type: string
          description: JWT access token, valid 15 minutes.
        refresh:
          type: string
          description: JWT refresh token, valid 30 days, single use.
        user:
          $ref: '#/components/schemas/Me'
        is_new_user:
          type: boolean
          description: True when this verification created the account. Show the complete-profile
            screen when `is_new_user` is true or `user.is_profile_complete` is false.
        rider_status:
          allOf:
          - $ref: '#/components/schemas/RiderStatusEnum'
          description: |-
            Always present (NONE without a rider profile). The rider app routes on it: NONE -> registration, PENDING_KYC/REJECTED -> status screen, ACTIVE -> home, SUSPENDED -> blocked. The customer app ignores it.

            * `NONE` - No rider profile: show registration
            * `PENDING_KYC` - Registered, waiting for KYC approval
            * `ACTIVE` - Approved: can go online
            * `REJECTED` - KYC rejected: see the reason, re-submit
            * `SUSPENDED` - Suspended by ops
        deletion_cancelled:
          type: boolean
          description: 'True when this login cancelled a pending account deletion
            (login within the 30-day grace period restores the account): show a notice.
            Normally false.'
      required:
      - access
      - deletion_cancelled
      - is_new_user
      - refresh
      - rider_status
      - user
    BannerLinkTypeEnum:
      enum:
      - category
      - collection
      - product
      - url
      - none
      type: string
      description: |-
        * `category` - Product list of the category whose slug is link_value
        * `collection` - Collection page whose slug is link_value
        * `product` - Product detail whose slug is link_value
        * `url` - External https URL in link_value (open in the browser)
        * `none` - Not tappable
    Bill:
      type: object
      description: |-
        The bill (08 §6.2), from `cart.services.compute_bill()`: the same function prices the
        cart, places the order and recalculates it. Every amount is a 2-decimal string, rounded
        half-up. Fee thresholds compare against `item_total` (before the coupon, D-09).

        `grand_total = item_total - coupon_discount + delivery_fee + small_cart_fee + handling_fee
        + tip`. An empty cart's bill is all zeros.
      properties:
        mrp_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Sum of MRP x quantity. The struck-out 'Item total (MRP)'.
        item_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Sum of the store selling price x quantity (store price override
            applied).
        product_discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: '`mrp_total` - `item_total`.'
        coupon_discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Discount of the applied coupon, capped by its `max_discount`
            and by `item_total`. "0.00" without a coupon or when the coupon does not
            apply.
        delivery_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: 'Store delivery fee, "0.00" when `item_total` >= the free-delivery
            threshold: show "FREE" when "0.00".'
        small_cart_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Charged when `item_total` is below the store's small-cart threshold,
            else "0.00".
        handling_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Store handling fee ("0.00" by default).
        tip:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Rider tip chosen by the customer ("0.00" when none). Goes fully
            to the rider.
        grand_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: '**To pay.** Not rounded to the rupee in v1.'
        total_savings:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: '`product_discount` + `coupon_discount`: the highlighted ''You
            save'' amount.'
      required:
      - coupon_discount
      - delivery_fee
      - grand_total
      - handling_fee
      - item_total
      - mrp_total
      - product_discount
      - small_cart_fee
      - tip
      - total_savings
    CancelReasonEnum:
      enum:
      - CHANGE_PAYMENT_METHOD
      - PAYMENT_PROBLEM
      - ORDERED_BY_MISTAKE
      - CHANGED_MIND
      - DELIVERY_TOO_SLOW
      - OTHER
      type: string
      description: |-
        * `CHANGE_PAYMENT_METHOD` - I want to pay another way
        * `PAYMENT_PROBLEM` - The payment did not work
        * `ORDERED_BY_MISTAKE` - I ordered by mistake
        * `CHANGED_MIND` - I changed my mind
        * `DELIVERY_TOO_SLOW` - Delivery is taking too long
        * `OTHER` - Other
    CancelledByEnum:
      enum:
      - customer
      - store
      - rider
      - ops
      - system
      type: string
      description: |-
        * `customer` - Customer
        * `store` - Store staff
        * `rider` - Rider
        * `ops` - Ops / support
        * `system` - System
    Cart:
      type: object
      description: The customer's cart at the store in `X-Store-Id` (one cart per
        user).
      properties:
        store:
          allOf:
          - $ref: '#/components/schemas/StoreStatus'
          description: The store pricing this cart, and whether it is open.
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartLine'
          description: Lines in the order they were added.
        item_count:
          type: integer
          minimum: 0
          description: Units in the cart (sum of quantities), for the cart badge.
        coupon:
          allOf:
          - $ref: '#/components/schemas/AppliedCoupon'
          nullable: true
          description: Null when no coupon is applied.
        tip:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: The chosen rider tip (kept while the cart is empty; billed
            only with items).
        instructions:
          $ref: '#/components/schemas/DeliveryInstructions'
        address:
          allOf:
          - $ref: '#/components/schemas/Address'
          readOnly: true
          nullable: true
          description: 'The delivery address the cart is checked against: `?address_id=`
            when sent, else the one saved with `PATCH /cart/`. Null when none is selected.'
        bill:
          $ref: '#/components/schemas/Bill'
        thresholds:
          $ref: '#/components/schemas/CartThresholds'
        payment_methods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentOption'
          description: ONLINE then COD, each with its availability for this cart.
        checkout:
          $ref: '#/components/schemas/CheckoutStatus'
      required:
      - address
      - bill
      - checkout
      - coupon
      - instructions
      - item_count
      - items
      - payment_methods
      - store
      - thresholds
      - tip
    CartItemAddRequest:
      type: object
      properties:
        variant_id:
          type: integer
          minimum: 1
          description: '`VariantSummary.id`.'
        quantity:
          type: integer
          maximum: 1000
          minimum: 0
          description: The line's **new** quantity for this variant (not an increment),
            so a retried request does not add twice. 0 removes the line.
      required:
      - quantity
      - variant_id
    CartItemUpdateRequest:
      type: object
      description: The new quantity of a cart line (`quantity` is required).
      properties:
        quantity:
          type: integer
          maximum: 1000
          minimum: 1
          description: The line's new quantity. Use `DELETE` to remove the line.
      required:
      - quantity
    CartLine:
      type: object
      description: One variant in the cart, priced and checked against stock at the
        store right now.
      properties:
        id:
          type: integer
          description: Line id for `PATCH`/`DELETE /cart/items/{id}/`.
        product:
          $ref: '#/components/schemas/CartProduct'
        variant:
          allOf:
          - $ref: '#/components/schemas/VariantSummary'
          description: The variant with its current price and stock at this store
            (same shape as the catalog). Cap the stepper at `orderable_quantity`.
        quantity:
          type: integer
          minimum: 1
        line_mrp_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: '`variant.mrp` x `quantity`.'
        line_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: '`variant.selling_price` x `quantity`.'
        issue:
          allOf:
          - $ref: '#/components/schemas/CartLineIssue'
          nullable: true
          description: 'Set when the line cannot be ordered as it is (quantity above
            `variant.orderable_quantity`, which is 0 when out of stock or no longer
            sold). Fix: set the quantity to `variant.orderable_quantity`, or remove
            the line when it is 0. Null when the line is fine.'
      required:
      - id
      - issue
      - line_mrp_total
      - line_total
      - product
      - quantity
      - variant
    CartLineIssue:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/CartLineIssueCodeEnum'
        message:
          type: string
          description: Display text, e.g. 'Only 2 left'.
      required:
      - code
      - message
    CartLineIssueCodeEnum:
      enum:
      - OUT_OF_STOCK
      - QUANTITY_UNAVAILABLE
      type: string
      description: |-
        * `OUT_OF_STOCK` - Out of stock: remove it to continue.
        * `QUANTITY_UNAVAILABLE` - Not available in this quantity: reduce it to continue.
    CartProduct:
      type: object
      description: The product a cart line belongs to (for the line title and the
        product link).
      properties:
        id:
          type: integer
        slug:
          type: string
          description: '`GET /products/{slug}/`.'
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
        brand:
          type: string
        is_veg:
          type: boolean
      required:
      - brand
      - id
      - is_veg
      - name
      - slug
    CartThresholds:
      type: object
      description: |-
        The store's thresholds and how far the cart is from them (computed by the server, so the
        app never subtracts money). All compare against `bill.item_total`.
      properties:
        min_order_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Minimum item total to place an order.
        amount_to_min_order:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: Item value still needed to reach the minimum; null when it
            is reached.
        free_delivery_threshold:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: Item total from which delivery is free; null when the store
            charges no delivery fee.
        amount_to_free_delivery:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: For the nudge 'Add ₹X more for free delivery'; null when delivery
            is already free.
      required:
      - amount_to_free_delivery
      - amount_to_min_order
      - free_delivery_threshold
      - min_order_value
    CashEntryTypeEnum:
      enum:
      - COD_COLLECTED
      - DEPOSIT
      - ADJUSTMENT
      type: string
      description: |-
        * `COD_COLLECTED` - Cash collected
        * `DEPOSIT` - Deposited at the store
        * `ADJUSTMENT` - Adjustment
    CashLedgerEntry:
      type: object
      properties:
        id:
          type: integer
        entry_type:
          $ref: '#/components/schemas/CashEntryTypeEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: 'Signed: + collected, - deposited ("-1500.00").'
        balance_after:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Cash in hand after this entry.
        order_number:
          type: string
          nullable: true
        note:
          type: string
        recorded_at:
          type: string
          format: date-time
      required:
      - amount
      - balance_after
      - entry_type
      - id
      - note
      - order_number
      - recorded_at
    CategoryNode:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        image:
          allOf:
          - $ref: '#/components/schemas/ImageSet'
          nullable: true
        children:
          type: array
          items:
            $ref: '#/components/schemas/CategoryTile'
          description: 'Sub-categories with products at this store (the left rail
            of the product list). Empty when the category has none: list it directly.'
      required:
      - children
      - id
      - image
      - name
      - slug
    CategoryTile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          description: e.g. "Edible Oils".
        slug:
          type: string
          description: Use as `category` on `GET /products/`.
          pattern: ^[-a-zA-Z0-9_]+$
        image:
          allOf:
          - $ref: '#/components/schemas/ImageSet'
          nullable: true
          description: Square image. Null when none.
      required:
      - id
      - image
      - name
      - slug
    CategoryTree:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/CategoryNode'
          description: Top-level categories with products at this store, in admin
            order. Two levels in v1 (top-level and sub-categories). Not paginated.
      required:
      - results
    CheckoutBlocker:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/CheckoutBlockerCodeEnum'
        message:
          type: string
          description: Display text with the fix, in English.
      required:
      - code
      - message
    CheckoutBlockerCodeEnum:
      enum:
      - CART_EMPTY
      - ADDRESS_REQUIRED
      - NOT_SERVICEABLE
      - STORE_CLOSED
      - STOCK_UNAVAILABLE
      - MIN_ORDER_NOT_MET
      - COUPON_INVALID
      - COUPON_EXPIRED
      - COUPON_NOT_ELIGIBLE
      - COUPON_USAGE_EXCEEDED
      type: string
      description: |-
        * `CART_EMPTY` - Add items to your cart.
        * `ADDRESS_REQUIRED` - Select a delivery address.
        * `NOT_SERVICEABLE` - We do not deliver to this address from this store.
        * `STORE_CLOSED` - The store is not accepting orders right now.
        * `STOCK_UNAVAILABLE` - Some items are not available as chosen.
        * `MIN_ORDER_NOT_MET` - The minimum order value is not met.
        * `COUPON_INVALID` - The coupon is not valid.
        * `COUPON_EXPIRED` - The coupon has expired.
        * `COUPON_NOT_ELIGIBLE` - This cart is not eligible for the coupon.
        * `COUPON_USAGE_EXCEEDED` - The coupon usage limit is reached.
    CheckoutStatus:
      type: object
      properties:
        can_place_order:
          type: boolean
          description: Enable the checkout button only when true (no blockers).
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutBlocker'
          description: Everything that stops the order now, most important first.
      required:
      - blockers
      - can_place_order
    CodCollectionRequest:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/CodModeEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Must equal `cod_amount_due` exactly.
      required:
      - amount
      - mode
    CodModeEnum:
      enum:
      - cash
      - upi
      type: string
      description: |-
        * `cash` - Cash
        * `upi` - UPI QR
    CodQr:
      type: object
      description: |-
        A UPI QR for the COD amount (Razorpay QR). The server confirms payment; poll
        `tasks/current/` (or this endpoint) until `status` is PAID.
      properties:
        qr_id:
          type: string
        image_url:
          type: string
          format: uri
          description: https PNG of the QR code.
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Exactly the amount due.
        status:
          $ref: '#/components/schemas/CodQrStatusEnum'
        expires_at:
          type: string
          format: date-time
      required:
      - amount
      - expires_at
      - image_url
      - qr_id
      - status
    CodQrStatusEnum:
      enum:
      - PENDING
      - PAID
      - EXPIRED
      - CANCELLED
      type: string
      description: |-
        * `PENDING` - Waiting for the customer to pay
        * `PAID` - Paid (confirmed by the server)
        * `EXPIRED` - Expired
        * `CANCELLED` - Closed (cash was taken instead)
    CollectionDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductCard'
          description: All products of the collection that this store sells (at most
            100), in the collection's order, out-of-stock last. For sorting or paging
            use `GET /products/?collection={slug}`.
      required:
      - id
      - name
      - products
      - slug
    CollectionRail:
      type: object
      description: A horizontal product rail on home ('Bestsellers', 'Offers', ...).
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
          description: '''See all'' opens `GET /collections/{slug}/`.'
          pattern: ^[-a-zA-Z0-9_]+$
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductCard'
          description: Up to 10 products in the collection's order, out-of-stock last.
        has_more:
          type: boolean
          description: True when the collection has more products.
      required:
      - has_more
      - id
      - name
      - products
      - slug
    CouponApplyRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: Coupon code as typed; case-insensitive.
          maxLength: 30
      required:
      - code
    CouponDiscountTypeEnum:
      enum:
      - FLAT
      - PERCENT
      type: string
      description: |-
        * `FLAT` - Flat amount off
        * `PERCENT` - Percent off
    CouponIneligibleReasonEnum:
      enum:
      - MIN_ORDER_VALUE
      - FIRST_ORDER_ONLY
      - NO_ELIGIBLE_ITEMS
      - STORE
      type: string
      description: |-
        * `MIN_ORDER_VALUE` - The item total is below the coupon's minimum.
        * `FIRST_ORDER_ONLY` - Only for your first order.
        * `NO_ELIGIBLE_ITEMS` - No items in the cart qualify for this coupon.
        * `STORE` - Not valid at this store.
    CouponList:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/CouponOffer'
          description: Visible coupons valid at this store now, eligible first (highest
            savings first), then the rest. Expired, used-up and other-store coupons
            are not listed. Not paginated.
      required:
      - results
    CouponOffer:
      type: object
      description: A coupon in the 'Apply coupon' sheet, evaluated against the current
        cart.
      properties:
        code:
          type: string
          description: Upper case. Apply with `POST /cart/coupon/`.
        title:
          type: string
          description: e.g. "Flat ₹50 off".
        description:
          type: string
          description: Terms in one line, e.g. "On orders above ₹299".
        discount_type:
          $ref: '#/components/schemas/CouponDiscountTypeEnum'
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: 'FLAT: rupees off ("50.00"). PERCENT: percent off ("10.00"
            = 10%).'
        max_discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: Cap on the discount (PERCENT coupons); null when uncapped.
        min_order_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Minimum `item_total` (before the coupon), "0.00" when none.
        ends_at:
          type: string
          format: date-time
          nullable: true
          description: UTC expiry (show 'Expires on ...' in IST); null = no expiry.
        is_applied:
          type: boolean
          description: True for the coupon on the cart now.
        is_eligible:
          type: boolean
          description: Show APPLY enabled only when true.
        savings:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: What it would save on this cart now (the server's `coupon_discount`);
            null when not eligible.
        ineligible_reason:
          allOf:
          - $ref: '#/components/schemas/CouponIneligibleReasonEnum'
          nullable: true
        message:
          type: string
          nullable: true
          description: Why it is not eligible, with the fix (e.g. 'Add items worth
            ₹716 more').
        amount_to_unlock:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: 'MIN_ORDER_VALUE only: item value still needed. Null otherwise.'
      required:
      - amount_to_unlock
      - code
      - description
      - discount_type
      - ends_at
      - ineligible_reason
      - is_applied
      - is_eligible
      - max_discount
      - message
      - min_order_value
      - savings
      - title
      - value
    CurrentOffer:
      type: object
      properties:
        offer:
          allOf:
          - $ref: '#/components/schemas/RiderOffer'
          nullable: true
          description: The pending offer, or null.
        server_time:
          type: string
          format: date-time
          description: Server clock, for the countdown.
      required:
      - offer
      - server_time
    CurrentTask:
      type: object
      properties:
        task:
          allOf:
          - $ref: '#/components/schemas/RiderTask'
          nullable: true
          description: The active task (ASSIGNED, AT_STORE, PICKED_UP, AT_CUSTOMER,
            RETURNING), or null.
        recent_task:
          allOf:
          - $ref: '#/components/schemas/RecentTask'
          nullable: true
          description: 'When `task` is null: the rider''s last task if it ended in
            the last 10 minutes (delivered, returned, or cancelled by the store/customer/ops),
            so a lost response can be explained. Null otherwise.'
        server_time:
          type: string
          format: date-time
      required:
      - recent_task
      - server_time
      - task
    DeliverRequest:
      type: object
      properties:
        otp:
          type: string
          minLength: 1
          description: The 4-digit delivery OTP the customer reads out.
          pattern: ^[0-9]{4}$
        cod:
          allOf:
          - $ref: '#/components/schemas/CodCollectionRequest'
          nullable: true
          description: Required for COD orders, absent for prepaid.
      required:
      - otp
    DeliveryFailReasonEnum:
      enum:
      - CUSTOMER_NOT_REACHABLE
      - CUSTOMER_REFUSED
      - WRONG_ADDRESS
      - OTHER
      type: string
      description: |-
        * `CUSTOMER_NOT_REACHABLE` - Customer not reachable
        * `CUSTOMER_REFUSED` - Customer refused the order
        * `WRONG_ADDRESS` - Wrong address
        * `OTHER` - Other
    DeliveryFailRequest:
      type: object
      description: '`multipart/form-data` (the optional photo).'
      properties:
        reason:
          $ref: '#/components/schemas/DeliveryFailReasonEnum'
        note:
          type: string
          description: Required for OTHER.
          maxLength: 300
        call_attempts:
          type: integer
          minimum: 0
          description: Calls made to the customer. CUSTOMER_NOT_REACHABLE needs at
            least 2.
        photo:
          type: string
          format: binary
          description: Optional JPEG/PNG (e.g. the door), at most 1 MB.
      required:
      - reason
    DeliveryInstructionChipEnum:
      enum:
      - DONT_RING_BELL
      - LEAVE_AT_DOOR
      - AVOID_CALLING
      type: string
      description: |-
        * `DONT_RING_BELL` - Don't ring the bell
        * `LEAVE_AT_DOOR` - Leave at the door
        * `AVOID_CALLING` - Avoid calling
    DeliveryInstructions:
      type: object
      description: '03 §2.8: chips plus free text, shown to the rider.'
      properties:
        chips:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryInstructionChipEnum'
          description: Selected chips, each at most once (order kept).
          maxItems: 3
        note:
          type: string
          description: Free text for the rider ("" when none).
          maxLength: 200
      required:
      - chips
      - note
    DeliveryInstructionsRequest:
      type: object
      description: '03 §2.8: chips plus free text, shown to the rider.'
      properties:
        chips:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryInstructionChipEnum'
          description: Selected chips, each at most once (order kept).
          maxItems: 3
        note:
          type: string
          description: Free text for the rider ("" when none).
          maxLength: 200
      required:
      - chips
      - note
    DeliveryOtpState:
      type: object
      properties:
        length:
          type: integer
          description: Digits of the customer's delivery OTP (4).
        attempts_remaining:
          type: integer
          description: Of 5.
        locked:
          type: boolean
          description: 'True after 5 wrong OTPs: ops are alerted; call support.'
      required:
      - attempts_remaining
      - length
      - locked
    DeliveryTaskStatusEnum:
      enum:
      - SEARCHING
      - OFFERED
      - ASSIGNED
      - AT_STORE
      - PICKED_UP
      - AT_CUSTOMER
      - DELIVERED
      - FAILED
      - RETURNING
      - RETURNED
      - UNASSIGNED
      - CANCELLED
      type: string
      description: |-
        * `SEARCHING` - Looking for a rider
        * `OFFERED` - Offered to a rider
        * `ASSIGNED` - Rider heading to the store
        * `AT_STORE` - Rider at the store
        * `PICKED_UP` - Picked up
        * `AT_CUSTOMER` - Rider at the drop location
        * `DELIVERED` - Delivered
        * `FAILED` - Delivery failed
        * `RETURNING` - Returning items to the store
        * `RETURNED` - Items returned to the store
        * `UNASSIGNED` - No rider found: ops to assign
        * `CANCELLED` - Cancelled
    Device:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        fcm_token:
          type: string
          description: Firebase Cloud Messaging token.
          maxLength: 512
        app:
          $ref: '#/components/schemas/AppEnum'
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        app_version:
          type: string
          description: Installed app version, e.g. "1.4.2" or "1.4.2+37".
          maxLength: 32
          pattern: ^[0-9]{1,5}(?:\.[0-9]{1,5}){0,3}(?:\+[0-9]{1,9})?$
        is_active:
          type: boolean
          readOnly: true
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - app
      - app_version
      - fcm_token
      - id
      - is_active
      - last_seen_at
      - platform
    DeviceRequest:
      type: object
      properties:
        fcm_token:
          type: string
          minLength: 1
          description: Firebase Cloud Messaging token.
          maxLength: 512
        app:
          $ref: '#/components/schemas/AppEnum'
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        app_version:
          type: string
          minLength: 1
          description: Installed app version, e.g. "1.4.2" or "1.4.2+37".
          maxLength: 32
          pattern: ^[0-9]{1,5}(?:\.[0-9]{1,5}){0,3}(?:\+[0-9]{1,9})?$
      required:
      - app
      - app_version
      - fcm_token
      - platform
    EarningLine:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/EarningTypeEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: 'Signed: a PENALTY is negative ("-20.00").'
        note:
          type: string
      required:
      - amount
      - note
      - type
    EarningTotals:
      type: object
      properties:
        BASE:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Base pay.
        DISTANCE:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Distance pay.
        TIP:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Tips.
        INCENTIVE:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Incentives.
        PENALTY:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Penalties (zero or negative).
      required:
      - BASE
      - DISTANCE
      - INCENTIVE
      - PENALTY
      - TIP
    EarningTypeEnum:
      enum:
      - BASE
      - DISTANCE
      - TIP
      - INCENTIVE
      - PENALTY
      type: string
      description: |-
        * `BASE` - Base pay
        * `DISTANCE` - Distance pay
        * `TIP` - Customer tip
        * `INCENTIVE` - Incentive
        * `PENALTY` - Penalty
    Earnings:
      type: object
      description: Every total is computed by the server; the app shows them as sent.
      properties:
        from:
          type: string
          format: date
          description: IST calendar date, YYYY-MM-DD.
        to:
          type: string
          format: date
          description: IST calendar date, YYYY-MM-DD. Inclusive.
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: All earnings in the range.
        orders_count:
          type: integer
          description: Delivered orders in the range.
        totals_by_type:
          $ref: '#/components/schemas/EarningTotals'
        orders:
          type: array
          items:
            $ref: '#/components/schemas/EarningsOrder'
          description: Newest first, at most 200 (see `orders_truncated`).
        orders_truncated:
          type: boolean
          description: 'True when the range has more than 200 orders: the totals still
            cover all.'
        adjustments:
          type: array
          items:
            $ref: '#/components/schemas/EarningsAdjustment'
      required:
      - adjustments
      - from
      - orders
      - orders_count
      - orders_truncated
      - to
      - total
      - totals_by_type
    EarningsAdjustment:
      type: object
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/EarningTypeEnum'
          description: |-
            INCENTIVE or PENALTY (not tied to an order).

            * `BASE` - Base pay
            * `DISTANCE` - Distance pay
            * `TIP` - Customer tip
            * `INCENTIVE` - Incentive
            * `PENALTY` - Penalty
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Signed.
        note:
          type: string
        recorded_at:
          type: string
          format: date-time
      required:
      - amount
      - note
      - recorded_at
      - type
    EarningsOrder:
      type: object
      properties:
        task_id:
          type: integer
        order_number:
          type: string
        completed_at:
          type: string
          format: date-time
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Sum of `lines`.
        lines:
          type: array
          items:
            $ref: '#/components/schemas/EarningLine'
      required:
      - completed_at
      - lines
      - order_number
      - task_id
      - total
    ErrorBody:
      type: object
      description: The `error` object of every error response.
      properties:
        code:
          allOf:
          - $ref: '#/components/schemas/ErrorCodeEnum'
          description: |-
            Stable machine-readable error code (06 §6). Apps map codes to messages.

            * `VALIDATION_ERROR` - Some fields are invalid.
            * `OTP_INVALID` - The OTP is incorrect.
            * `OTP_EXPIRED` - The OTP has expired.
            * `OTP_RATE_LIMITED` - Too many OTP requests. Try again later.
            * `AUTH_REQUIRED` - Authentication is required.
            * `TOKEN_INVALID` - The access token is invalid or expired.
            * `PERMISSION_DENIED` - You do not have permission to do this.
            * `NOT_FOUND` - Not found.
            * `APP_UPDATE_REQUIRED` - Please update the app to continue.
            * `NOT_SERVICEABLE` - We do not deliver to this location yet.
            * `STORE_CLOSED` - The store is not accepting orders right now.
            * `STOCK_UNAVAILABLE` - Some items are out of stock.
            * `MAX_QTY_EXCEEDED` - The maximum quantity for this item is exceeded.
            * `MIN_ORDER_NOT_MET` - The minimum order value is not met.
            * `COUPON_INVALID` - The coupon is not valid.
            * `COUPON_EXPIRED` - The coupon has expired.
            * `COUPON_NOT_ELIGIBLE` - This cart is not eligible for the coupon.
            * `COUPON_USAGE_EXCEEDED` - The coupon usage limit is reached.
            * `COD_NOT_AVAILABLE` - Cash on delivery is not available for this order.
            * `PRICE_CHANGED` - The bill has changed. Refresh the cart.
            * `PAYMENT_VERIFICATION_FAILED` - The payment could not be verified.
            * `INVALID_STATE_TRANSITION` - This action is not allowed right now.
            * `OFFER_EXPIRED` - The offer has expired.
            * `OFFER_TAKEN` - The offer was taken by another rider.
            * `OUTSIDE_GEOFENCE` - You are too far from the location.
            * `DELIVERY_OTP_INVALID` - The delivery OTP is incorrect.
            * `DELIVERY_OTP_LOCKED` - Too many wrong delivery OTP attempts.
            * `CASH_LIMIT_EXCEEDED` - The cash-in-hand limit is exceeded.
            * `MAINTENANCE` - The service is under maintenance.
            * `METHOD_NOT_ALLOWED` - This HTTP method is not allowed here.
            * `NOT_ACCEPTABLE` - The requested response format is not available.
            * `UNSUPPORTED_MEDIA_TYPE` - The request body format is not supported.
            * `RATE_LIMITED` - Too many requests. Try again later.
            * `SERVER_ERROR` - Something went wrong. Please try again.
            * `SERVICE_UNAVAILABLE` - The service is temporarily unavailable.
            * `STORE_NOT_FOUND` - This store is not available. Check serviceability again.
            * `PAYLOAD_TOO_LARGE` - The request body is too large.
            * `RIDER_OFFLINE` - You are offline. Go online again to continue.
            * `PICKUP_CODE_INVALID` - The order code does not match this order.
        message:
          type: string
          description: Human-readable message (English).
        details:
          type: object
          additionalProperties: {}
          description: 'Extra data for the code; always an object, possibly empty.
            VALIDATION_ERROR: field name -> list of messages.'
      required:
      - code
      - details
      - message
    ErrorCodeEnum:
