  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh
      description: |-
        Returns a new access token **and a new refresh token**. The refresh token sent is revoked, so it works exactly once: run refreshes single-flight (one at a time), and replace both stored tokens.

        Only 401 `TOKEN_INVALID` means the session is over (log out). This endpoint is exempt from 426 `APP_UPDATE_REQUIRED` and 503 `MAINTENANCE`, so a session survives maintenance and force updates.
      summary: Rotate the refresh token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
            examples:
              Refresh:
                value:
                  refresh: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoicmVmcmVzaCIsImV4cCI6MTc5NjIwMjkwMCwiaWF0IjoxNzkzNjEwOTAwLCJqdGkiOiIwYTliOGM3ZDZlNWY0YTNiMmMxZDBlOWY4YTdiNmM1ZCIsInVzZXJfaWQiOjQyfQ.c2lnbmF0dXJlLWZvci1leGFtcGxlcy1vbmx5
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              examples:
                Rotated:
                  value:
                    access: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoiYWNjZXNzIiwiZXhwIjoxNzkzNjEyNzAwLCJpYXQiOjE3OTM2MTE4MDAsImp0aSI6IjdlNmQ1YzRiM2EyZjFlMGQ5YzhiN2E2ZjVlNGQzYzJiIiwidXNlcl9pZCI6NDJ9.c2lnbmF0dXJlLWZvci1leGFtcGxlcy1vbmx5
                    refresh: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoicmVmcmVzaCIsImV4cCI6MTc5NjIwMzgwMCwiaWF0IjoxNzkzNjExODAwLCJqdGkiOiIxYjJjM2Q0ZTVmNmE3YjhjOWQwZTFmMmEzYjRjNWQ2ZSIsInVzZXJfaWQiOjQyfQ.c2lnbmF0dXJlLWZvci1leGFtcGxlcy1vbmx5
          description: New token pair.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                VALIDATIONERROR:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Some fields are invalid.
                      details:
                        refresh:
                        - This field is required.
                  summary: VALIDATION_ERROR
          description: No refresh token in the body.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                TOKENINVALID:
                  value:
                    error:
                      code: TOKEN_INVALID
                      message: Token is blacklisted
                      details: {}
                  summary: Already used
                TOKENINVALIDEXPIRED:
                  value:
                    error:
                      code: TOKEN_INVALID
                      message: Token is expired
                      details: {}
                  summary: Expired (30 days)
                TOKENINVALIDMALFORMED:
                  value:
                    error:
                      code: TOKEN_INVALID
                      message: Token is invalid
                      details: {}
                  summary: Malformed or wrong signature
          description: 'The refresh token is invalid, expired or already used: the
            session is over.'
