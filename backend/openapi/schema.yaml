  /api/v1/products/:
    get:
      operationId: products_list
      description: Product tiles with their variants, prices and stock at this store,
        paginated (infinite scroll). Filter by `category` (a top-level category includes
        its sub-categories) and/or `collection`; with neither, all products of the
        store. Products the store does not sell are never listed; out-of-stock ones
        are listed after in-stock ones, greyed out.
      summary: Product list (category, collection or all)
      parameters:
      - in: header
        name: X-Store-Id
        schema:
          type: integer
        description: 'The store id from `GET /serviceability/` (`store.id`) for the
          selected location. Missing or not a positive integer: 400 `VALIDATION_ERROR`
          with `details: {"X-Store-Id": [...]}`. Unknown or deactivated store: 404
          `STORE_NOT_FOUND`; drop the saved store and check serviceability again.
          A closed store is still browsable.'
        required: true
      - in: query
        name: category
        schema:
          type: string
          minLength: 1
          maxLength: 120
        description: 'Category id or slug. A top-level category includes its sub-categories.
          Unknown or inactive: 404 `NOT_FOUND`.'
      - in: query
        name: collection
        schema:
          type: string
          minLength: 1
          maxLength: 120
        description: 'Collection id or slug. Unknown or inactive: 404 `NOT_FOUND`.'
      - in: query
        name: page
