  /api/v1/payments/razorpay/verify/:
    post:
      operationId: payments_razorpay_verify
      description: |-
        Call it with the fields of Razorpay checkout's success callback. The server checks the signature (and that the Razorpay order is this order's) and moves the order from PAYMENT_PENDING to PLACED (08 T3): the stock stays reserved, the coupon is used and the cart is emptied. Then show the success screen with the returned order.

        Idempotent (no `Idempotency-Key` needed): calling again, or after the webhook already confirmed the payment, returns the PLACED order. If the response is lost, call it again. On a checkout failure or dismissal do **not** call it: show 'Payment failed' with Retry (`POST /orders/{id}/retry-payment/`).

        If the order already failed or was cancelled (`INVALID_STATE_TRANSITION`), it is not revived: a payment captured anyway is refunded in full automatically (08 T3a).
      summary: Confirm an online payment
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentVerifyRequest'
            examples:
              CheckoutSuccessCallback:
                value:
                  order_id: 5012
                  razorpay_order_id: order_Nq3uVxY7kL9pQe
                  razorpay_payment_id: pay_Nq3vA1bC2dE3fG
                  razorpay_signature: bc4bcc84a495aaddc2f52819146edd4d26728c1221e5621f23995c106721c977
                summary: Checkout success callback
        required: true
      security:
      - jwtAuth: []
      responses:
