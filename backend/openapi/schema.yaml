        foreground. Records "last seen" for ops and returns whether the server still
        has the rider online, a pending offer and the active task (polling fallback,
        04 §2.4). Auto-offline (api-requests #42, ⚠ PM default): no location point
        for 10 minutes sets the rider offline, unless a heartbeat came in those 10
        minutes and the last point is at most 30 minutes old (e.g. waiting indoors
        without a GPS fix).'
