  /api/v1/search/:
    get:
      operationId: search_products
      description: 'Same tiles as the product list, best match first. Matches product
        name, variant, tags and category. No results: 200 with `count: 0`; show the
        empty state with trending searches from `GET /search/suggest/`.'
      summary: Search products
      parameters:
      - in: header
        name: X-Store-Id
        schema:
          type: integer
        description: 'The store id from `GET /serviceability/` (`store.id`) for the
          selected location. Missing or not a positive integer: 400 `VALIDATION_ERROR`
          with `details: {"X-Store-Id": [...]}`. Unknown or deactivated store: 404
          `STORE_NOT_FOUND`; drop the saved store and check serviceability again.
          A closed store is still browsable.'
        required: true
      - in: query
        name: page
        schema:
          type: integer
        description: Page number (1-based). Default 1.
      - in: query
        name: page_size
        schema:
          type: integer
        description: 'Items per page: default 20, max 100.'
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
          maxLength: 100
        description: Search text (trimmed). Matches product name, variant, tags and
          category.
        required: true
      - in: query
        name: sort
        schema:
          enum:
          - relevance
          - price_asc
          - price_desc
          - discount
          type: string
          default: relevance
          minLength: 1
        description: |-
          relevance (default): best match first. In-stock products always come first.

          * `relevance` - Relevance (default)
          * `price_asc` - Price: low to high
          * `price_desc` - Price: high to low
          * `discount` - Discount: highest first
