      description: 'Standard page (02 §5): `?page=&page_size=`, default 20, max 100.'
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProductCard'
      required:
      - count
      - next
      - previous
      - results
    PaginatedTaskHistory:
      type: object
      properties:
        count:
          type: integer
          description: All entries, whatever `before_id`.
        next:
          type: string
          format: uri
          nullable: true
