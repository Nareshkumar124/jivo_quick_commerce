                  summary: APP_UPDATE_REQUIRED
          description: Force update. Sent only when the request carries `X-App-Name`,
            `X-Platform` and `X-App-Version`, and the version is below `min_supported_version`
            for that app and platform. Requests without these headers never get 426.
        '503':
          content:
