                TOKENINVALID:
                  value:
                    error:
                      code: TOKEN_INVALID
                      message: Given token not valid for any token type
                      details: {}
                  summary: Expired token
          description: No access token (`AUTH_REQUIRED`), or the token is invalid,
            expired or revoked (`TOKEN_INVALID`). On `TOKEN_INVALID`, refresh once
            and retry.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                PRICECHANGED:
                  value:
                    error:
                      code: PRICE_CHANGED
                      message: The bill has changed. Refresh the cart.
                      details:
                        expected_grand_total: '753.00'
                        grand_total: '778.00'
                  summary: PRICE_CHANGED
                STOCKUNAVAILABLE:
                  value:
                    error:
                      code: STOCK_UNAVAILABLE
                      message: Some items are out of stock.
                      details:
                        items:
                        - variant_id: 1002
                          requested_quantity: 3
                          orderable_quantity: 2
                        - variant_id: 1004
                          requested_quantity: 1
                          orderable_quantity: 0
                  summary: STOCK_UNAVAILABLE
                PAYMENTPENDINGORDEREXISTS:
                  value:
                    error:
                      code: INVALID_STATE_TRANSITION
                      message: You have an order awaiting payment. Complete or cancel
                        it first.
                      details:
                        pending_order_id: 5012
                  summary: PAYMENT_PENDING_ORDER_EXISTS
          description: '`PRICE_CHANGED`: the bill is not the one the customer saw;
            reload the cart and show it. `STOCK_UNAVAILABLE`: some lines cannot be
            supplied (`details.items` with the `orderable_quantity` now); reload the
            cart, whose lines show the fix. `INVALID_STATE_TRANSITION` with `details.pending_order_id`:
            another of the customer''s orders is still awaiting payment; offer to
            complete it (retry-payment) or cancel it first (PM decision, Phase 3:
            one unpaid order at a time, so stock is never held twice).'
