<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} · Jivo Quick Commerce</title>
<style>
:root { color-scheme: light dark; --fg: #1f2421; --muted: #5c6660; --bg: #ffffff; --line: #e3e7e4; --accent: #1b7a3e; }
@media (prefers-color-scheme: dark) { :root { --fg: #e8ece9; --muted: #a3ada7; --bg: #121513; --line: #2a302c; --accent: #5fc584; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; overflow-wrap: break-word; }
header { border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 20px; }
.brand { color: var(--muted); font-size: 14px; text-decoration: none; }
h1 { font-size: 1.6rem; line-height: 1.25; margin: 8px 0 0; }
h2 { font-size: 1.2rem; margin: 28px 0 8px; }
h3 { font-size: 1.05rem; margin: 20px 0 6px; }
a { color: var(--accent); }
ul, ol { padding-left: 1.4em; }
li { margin: 4px 0; }
blockquote { margin: 16px 0; padding: 4px 16px; border-left: 4px solid var(--line); color: var(--muted); }
footer { margin-top: 40px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
<header>
<a class="brand" href="{% url 'legal-index' %}">Jivo Quick Commerce</a>
<h1>{% block heading %}{% endblock %}</h1>
</header>
{% block content %}{% endblock %}
<footer>Jivo Mart Pvt. Ltd. · <a href="{% url 'legal-index' %}">All policies</a></footer>
</main>
</body>
</html>
