name: rider_app
description: "Jivo Rider: delivery partner app for Jivo Quick Commerce (Android only in v1, D-07)."
publish_to: none

# versionName+versionCode. versionName is sent as X-App-Version and compared
# with config/app versions, so it must stay plain semver (no flavor suffix).
version: 1.0.0+1

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.9"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # Shared core (theme, env, dio, errors, Sentry) and the generated client.
  jivo_core:
    path: ../packages/jivo_core
  jivo_api:
    path: ../packages/jivo_api
  dio: ^5.11.1

  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2

  # Location + background service (04 §3).
  geolocator: ^14.1.2
  flutter_foreground_task: ^11.0.3
  permission_handler: ^13.0.2
  # Persisted offline buffer for location points.
  path_provider: ^2.1.6

  # Offer alert channel with full-screen intent (04 §2.4).
  flutter_local_notifications: ^22.3.3

  # Terms/Privacy links and store links for force update.
  url_launcher: ^6.3.3
  # OTP autofill with the SMS User Consent API (no app hash in the DLT SMS
  # template). See lib/features/auth/data/sms_otp_autofill.dart.
  smart_auth: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true
