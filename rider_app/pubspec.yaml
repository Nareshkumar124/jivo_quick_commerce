name: rider_app
description: "Jivo Rider: delivery partner app for Jivo Quick Commerce (Android only in v1, D-07)."
publish_to: none

# versionName+versionCode. versionName is sent as X-App-Version and compared
# with config/app versions, so it must stay plain semver (no flavor suffix).
version: 1.0.1+2

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.9"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # Shared core (theme, env, dio, errors, Sentry) and the generated client.
  jivo_core:
    path: ../packages/jivo_core
  jivo_api:
    path: ../packages/jivo_api
  dio: ^5.11.1

  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2

  # Location + background service (04 §3).
  geolocator: ^14.1.2
  flutter_foreground_task: ^11.0.3
  permission_handler: ^13.0.2
  # Persisted offline buffer for location points.
  path_provider: ^2.1.6
  # Two push flags shared with the FCM background isolate (signed in, token
  # delete pending; push_guard_store.dart). Already resolved transitively;
  # same version as customer_app.
  shared_preferences: ^2.5.6

  # Offer alert channel with full-screen intent (04 §2.4), and the push
  # channels (offers, orders, general). Pinned exactly: customer_app uses
  # the same version (check_shared_versions.py).
  flutter_local_notifications: 22.3.3

  # Push (FCM, D-19). Pinned exactly: customer_app must resolve the same
  # versions (check_shared_versions.py). Firebase is optional at runtime: a
  # build without the flavor's google-services.json runs with push off.
  firebase_core: 5.2.0
  firebase_messaging: 17.1.0

  # Terms/Privacy links and store links for force update.
  url_launcher: ^6.3.3
  # OTP autofill with the SMS User Consent API (no app hash in the DLT SMS
  # template). See lib/features/auth/data/sms_otp_autofill.dart.
  smart_auth: ^3.2.0

  # KYC documents (04 §2.2): camera or gallery (Android photo picker, no
  # storage permission), then a native JPEG re-encode that strips EXIF (GPS)
  # and steps quality/size down until the file is <= 1 MB.
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1

  # Pickup: scan the QR on the packed bag (04 §2.5). CameraX + ML Kit
  # barcode (bundled model, so the first scan works offline at the store).
  mobile_scanner: ^7.5.0

  # Active delivery map (T-821): rider position, destination and the
  # server's route polyline. Same version as customer_app (shared-version
  # check) and the same build-time key mechanism (DL-80): without a key the
  # task screens show the no-map card.
  google_maps_flutter: ^2.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
